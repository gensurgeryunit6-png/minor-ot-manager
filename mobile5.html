<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minor OT Manager</title><style>:root{--navy:#303247;--yellow:#ffc400;--bg:#f4f7fb;--ink:#25293b;--line:#e3e7ee;--green:#20c66a;--blue:#3478ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}.app{max-width:760px;margin:auto;padding:12px 12px 80px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 6px 22px #26324a0b}.head{font-size:25px;font-weight:800}.muted{font-size:11px;color:#74798a}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.inputrow{display:flex;gap:6px}.inputrow input,.inputrow textarea,.field select{width:100%;border:1px solid #d5dae3;border-radius:10px;padding:12px;font-size:14px;background:#fff}.mic{border:0;border-radius:10px;background:#eef2f7;min-width:44px;font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:11px;padding:12px 15px;font-weight:700;font-size:12px}.primary{background:var(--navy);color:#fff}.yellow{background:var(--yellow);color:#302900}.soft{background:#f0f2f5}.upload{display:block;border:1px dashed #8da9df;background:#f7faff;color:#2459a9;padding:14px;text-align:center;border-radius:11px;font-weight:700}.upload input{display:none}.check{border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0}.check.done{background:#effcf5;border-color:#9de5bd}.check.na{background:#fff9df;border-color:#f0d35a}.check input{width:18px;height:18px}.token{background:var(--navy);color:#fff;border-radius:24px;text-align:center;padding:24px}.tokenno{font-size:52px;font-weight:800}.patient{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:grid;grid-template-columns:repeat(3,1fr);z-index:5}.bottom button{background:none;border:0;color:#fff;padding:13px 4px}.photo{max-width:100%;max-height:180px;margin-top:8px;border-radius:10px}@media(max-width:430px){.grid{grid-template-columns:1fr}.app{padding:9px 9px 75px}}</style></head><body><main id="app" class="app"></main><nav class="bottom"><button onclick="show('reg')">Registration</button><button onclick="show('list')">OT List</button><button onclick="show('records')">Records</button></nav><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>'use strict';const app=document.getElementById('app');let page='reg',photo='',postPhoto='',current=null,patients=JSON.parse(localStorage.getItem('mot5')||'[]');const checks=['Allergies','TT — 0.5 ml IM stat','Test dose — Injection Xylo test dose','Attender','Ornaments','Consent'];const meds=['Tab Amoxyclav 625 mg BD for 5 days','Tab CefU 200 mg BD for 5 days','Tab Paracetamol 500 mg BD for 5 days','Tab Pantop 40 mg OD for 5 days','Tab Chymoral Forte 1 tab TDS for 5 days'];const advice=['C&D daily','Watch for soakage','Review if there is warning has explained'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('mot5',JSON.stringify(patients))}function mic(id){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){alert('Voice-to-text is not supported in this browser. Try Chrome.');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition,r=new R();r.lang='en-IN';r.interimResults=false;r.onresult=e=>{document.getElementById(id).value+=(document.getElementById(id).value?' ':'')+e.results[0][0].transcript};r.start()}function vr(id,label){return `<div class="inputrow"><input id="${id}" placeholder="${label}"><button class="mic" type="button" onclick="mic('${id}')">🎙️</button></div>`}function ta(id,label){return `<div class="inputrow"><textarea id="${id}" rows="3" placeholder="${label}"></textarea><button class="mic" type="button" onclick="mic('${id}')">🎙️</button></div>`}function photo(id,label,which){return `<label class="upload">📷 ${label}<input id="${id}" type="file" accept="image/*" capture="environment" onchange="readPhoto(this,'${which}')"></label>`}function readPhoto(el,which){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1100/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);if(which==='pre')photo=c.toDataURL('image/jpeg',.68);else if(current){current.postPhoto=c.toDataURL('image/jpeg',.68);postPhoto=current.postPhoto}render();};im.src=r.result};r.readAsDataURL(f)}function reg(){return `<section class="card"><div class="head">Minor OT</div><div class="muted">New patient registration</div>${vr('name','Patient name *')}<div class="grid"><div class="field">${vr('age','Age')}</div><div class="field"><label>Sex</label><select id="sex"><option>Male</option><option>Female</option></select></div></div><div class="field"><label>OPD *</label><select id="opd"><option value="">Select OPD</option><option>7A</option><option>7B</option><option>7C</option><option>7D</option></select></div>${vr('diagnosis','Diagnosis *')}${vr('site','Site *')}${vr('procedure','Procedure *')}${photo('pre','Upload Pre‑Op Photo','pre')}${photo?'<div class="muted">✓ Pre‑Op photo attached</div>':''}<button class="btn primary" style="width:100%;margin-top:12px" onclick="next()">Continue to Safety Checklist</button></section>`}function next(){const p={name:document.getElementById('name').value.trim(),age:document.getElementById('age').value,sex:document.getElementById('sex').value,opd:document.getElementById('opd').value,diagnosis:document.getElementById('diagnosis').value.trim(),site:document.getElementById('site').value.trim(),procedure:document.getElementById('procedure').value.trim(),photo};if(!p.name||!p.opd||!p.diagnosis||!p.site||!p.procedure){alert('Complete required details');return}current=p;page='pre';render()}function safety(){return `<section class="card"><h2>Safety Checklist</h2><div class="muted">Choose Done or N/A. Selecting N/A disables Done for that item.</div>${checks.map((x,i)=>`<div class="check" id="c${i}"><label><input id="d${i}" type="checkbox" onchange="done(${i})"> <b>${x}</b></label><br><label><input id="n${i}" type="checkbox" onchange="na(${i})"> Not applicable (N/A)</label></div>`).join('')}<button class="btn soft" onclick="page='reg';render()">Back</button><button class="btn yellow" onclick="token()">Generate Token</button></section>`}function done(i){const d=document.getElementById('d'+i),n=document.getElementById('n'+i);if(d.checked){n.checked=false;n.disabled=true}else n.disabled=false;document.getElementById('c'+i).className='check '+(d.checked?'done':'')}function na(i){const n=document.getElementById('n'+i),d=document.getElementById('d'+i);if(n.checked){d.checked=false;d.disabled=true}else d.disabled=false;document.getElementById('c'+i).className='check '+(n.checked?'na':'')}function token(){const num=String(patients.length+1).padStart(3,'0');current.token='OT-'+num;current.date=new Date().toISOString().slice(0,10);current.status='registered';current.preChecklist=checks.map((x,i)=>({name:x,done:document.getElementById('d'+i).checked,na:document.getElementById('n'+i).checked}));patients.push(current);save();page='token';render()}function tokenPage(){return `<section class="card"><div class="token"><div>MINOR OT TOKEN</div><div class="tokenno">${current.token}</div><b>${esc(current.name)}</b><div>${esc(current.opd)} · ${esc(current.site)}</div></div><div style="margin-top:10px"><button class="btn primary" onclick="show('list')">Go to OT List</button></div></section>`}function list(){return `<section class="card"><h2>OT List</h2>${patients.map((p,i)=>`<div class="patient"><b>${p.token} — ${esc(p.name)}</b><div class="muted">${esc(p.diagnosis)} · ${esc(p.procedure)}</div><button class="btn primary" onclick="notes(${i})">OT Notes</button></div>`).join('')||'<div class="muted">No patients</div>'}</section>`}function notes(i){current=patients[i];const m=document.createElement('div');m.className='card';m.innerHTML=`<h2>OT Notes</h2>${vr('od','Diagnosis')}${vr('op','Procedure')}${vr('os','Site')}${ta('of','Findings')}${ta('ox','Operative details')}<h3>Medications</h3>${meds.map((x,j)=>`<label><input id="m${j}" type="checkbox"> ${x}</label><br>`).join('')}<h3>Advice</h3>${advice.map((x,j)=>`<label><input id="a${j}" type="checkbox"> ${x}</label><br>`).join('')}<div style="margin-top:12px">${photo('post','Upload Post‑Op Photo','post')}</div><button class="btn yellow" onclick="saveNotes(${i},this)">Save</button>`;app.innerHTML='';app.appendChild(m)}function saveNotes(i,b){current=patients[i];current.ot={diagnosis:document.getElementById('od').value,procedure:document.getElementById('op').value,site:document.getElementById('os').value,findings:document.getElementById('of').value,details:document.getElementById('ox').value};current.medications=meds.filter((x,j)=>document.getElementById('m'+j).checked);current.advice=advice.filter((x,j)=>document.getElementById('a'+j).checked);save();b.textContent='Saved ✓'}async function pdf(i){const p=patients[i],{jsPDF}=window.jspdf,d=new jsPDF();let y=15;d.setFontSize(16);d.text('MINOR OT – OT NOTES',105,y,{align:'center'});y+=9;d.setFontSize(10);d.text(`Token: ${p.token}    Date: ${p.date}`,10,y);y+=6;d.setFontSize(12);d.text('OT NOTES',10,y);y+=6;d.setFontSize(10);const o=p.ot||{};[`Diagnosis: ${o.diagnosis||p.diagnosis}`,`Procedure: ${o.procedure||p.procedure}`,`Site: ${o.site||p.site}`,`Findings: ${o.findings||'-'}`,`Operative details: ${o.details||'-'}`].forEach(t=>{const ls=d.splitTextToSize(t,190);d.text(ls,10,y);y+=5*ls.length});y+=3;d.setFontSize(12);d.text('MEDICATIONS',10,y);y+=6;d.setFontSize(10);(p.medications||[]).forEach(x=>{d.text('• '+x,10,y);y+=5});y+=3;d.setFontSize(12);d.text('ADVICE',10,y);y+=6;d.setFontSize(10);(p.advice||[]).forEach(x=>{d.text('• '+x,10,y);y+=5});const imgs=[['Pre‑Op',p.photo],['Post‑Op',p.postPhoto]].filter(x=>x[1]);if(imgs.length){y=Math.max(y+8,160);d.setFontSize(12);d.text('PHOTOGRAPHS',10,y);y+=5;for(const [lab,img] of imgs){try{d.addImage(img,'JPEG',10,y,85,55);d.text(lab,10,y+60);y+=68}catch(e){}}}d.save(`${p.token}_OT_Notes.pdf`)}function records(){return `<section class="card"><h2>Records</h2>${patients.map((p,i)=>`<div class="patient"><b>${p.token} — ${esc(p.name)}</b><button class="btn yellow" onclick="pdf(${i})">PDF</button></div>`).join('')}</section>`}function show(x){page=x;render()}function render(){app.innerHTML=page==='reg'?reg():page==='pre'?safety():page==='token'?tokenPage():page==='list'?list():records()}render();</script></body></html>
