<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#303247"><title>Minor OT Manager</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script><script src="firebase-config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>:root{--navy:#303247;--ink:#25293b;--muted:#74798a;--line:#e5e8ef;--bg:#f4f7fb;--yellow:#ffc400;--green:#20c66a;--blue:#3478ee;--purple:#a34ee8;--red:#ee454d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:760px;margin:auto;padding:12px 10px 92px}.top{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 8px 28px #26324a0b}.brand{font-size:25px;font-weight:800;letter-spacing:-.8px}.date{font-size:11px;color:var(--muted);margin-top:1px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.online{background:#eafaf1;color:#16733f;border:1px solid #bce9ce;border-radius:99px;padding:7px 10px;font-size:10px;font-weight:700}.online i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:4px}.clear{background:#fff0f0;color:#b42318;border-radius:10px;padding:8px 10px;font-size:10px;font-weight:700}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:13px}.nav button{background:#f1f2f5;color:#414657;border-radius:11px;padding:11px 3px;font-size:10px;font-weight:700}.nav button.on{background:var(--navy);color:#fff}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.stat{border:1px solid var(--line);border-radius:12px;text-align:center;padding:7px 2px;background:#fff}.stat b{display:block;font-size:17px}.stat span{font-size:7px;color:var(--muted);font-weight:600}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin-top:11px;box-shadow:0 8px 28px #26324a0b}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.sectionhead h2{margin:0;font-size:18px}.sectionhead p{margin:2px 0 0;color:var(--muted);font-size:9px}.pill{background:#f1f2f5;border-radius:99px;padding:5px 9px;font-size:9px;font-weight:700}.field{margin-bottom:9px}.field label{display:block;font-size:9px;font-weight:700;color:#62687a;margin:0 0 4px 2px}.field input,.field select,.field textarea{width:100%;border:1px solid #d8dce5;border-radius:11px;background:#fff;padding:11px;outline:none;color:var(--ink)}.field textarea{min-height:70px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#87a9ee;box-shadow:0 0 0 3px #3478ee12}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr .7fr 1fr;gap:8px}.btn{border-radius:11px;padding:11px 13px;font-size:11px;font-weight:700}.primary{background:var(--navy);color:#fff}.blue{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.yellow{background:var(--yellow);color:#302900}.soft{background:#f1f2f5;color:#414657}.purple{background:var(--purple);color:#fff}.upload{display:block;text-align:center;border:1px dashed #91aee9;background:#f7faff;color:#2459a9;border-radius:11px;padding:11px;font-size:10px;font-weight:700}.upload input{display:none}.triage{display:grid;grid-template-columns:1fr 1fr;gap:8px}.triage button{background:#f5f6f8;border:1px solid var(--line);border-radius:11px;padding:11px;font-size:11px;font-weight:700}.triage .selected.non{background:#eafaf1;color:#16733f;border-color:#8fe1ae}.triage .selected.sep{background:#fff0f0;color:#b42318;border-color:#f0a0a0}.flags{background:#fff8f8;border:1px solid #f0d1d4;border-radius:13px;padding:11px;margin-top:10px}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.check{display:flex;align-items:center;gap:6px;border:1px solid #eeeef2;border-radius:9px;padding:8px;font-size:10px;background:#fff}.check input{width:16px;height:16px;accent-color:var(--blue)}.ticket{position:relative;background:var(--navy);color:#fff;border-radius:23px;overflow:hidden;max-width:440px;margin:auto}.ticket:before,.ticket:after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;top:49%}.ticket:before{left:-14px}.ticket:after{right:-14px}.tickettop{text-align:center;padding:20px 15px 15px;border-bottom:1px dashed #777b89}.ticketicon{width:45px;height:45px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;margin:-43px auto 8px;border:4px solid #fff;font-size:20px}.ticketlabel{font-size:10px}.ticketno{font-size:47px;font-weight:800;line-height:1.05}.waiting{font-size:11px}.waiting b{color:var(--yellow)}.ticketbottom{display:flex;justify-content:space-between;padding:11px 16px;font-size:8px;color:#d9dae1}.tokenActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.queue{border:1px solid var(--line);border-radius:15px;padding:11px;margin-top:9px}.qtop{display:flex;align-items:center;gap:8px}.token{background:#eafaf1;color:#117445;border:1px solid #bce9ce;border-radius:10px;padding:7px 9px;font-size:16px;font-weight:800}.qname{font-size:12px;font-weight:800}.qmeta{font-size:9px;color:var(--muted)}.qactions{margin-left:auto;display:flex;gap:5px}.icon{background:#fff;border:1px solid var(--line);border-radius:9px;width:38px;height:38px;font-size:16px}.workflow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}.workflow button{background:#f1f2f5;color:#9da2ae;border-radius:9px;padding:8px 2px;font-size:9px;font-weight:700}.workflow .active.reg{background:#fff4d5;color:#986600}.workflow .active.ready{background:#eafaf1;color:#16733f}.workflow .active.prog{background:#f2e9ff;color:#6e36bd}.workflow .active.done{background:#eafaf1;color:#16733f}.box{margin-top:9px;border-radius:13px;padding:10px}.prebox{background:#f4fcf7;border:1px solid #bce9ce}.postbox{background:#fbf7ff;border:1px solid #dfcaf6}.boxhead{display:flex;justify-content:space-between;font-size:11px;font-weight:800}.preitem{display:flex;justify-content:space-between;gap:5px;background:#fff;border:1px solid #edf0ee;border-radius:9px;padding:8px;font-size:10px;margin-top:6px}.preitem label{display:flex;gap:6px;align-items:flex-start}.preitem input{width:16px;height:16px;accent-color:var(--blue)}.na{color:var(--muted);font-size:9px}.record{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:13px;padding:10px;margin-top:7px}.record .grow{flex:1}.record b{font-size:11px}.record small{display:block;color:var(--muted);font-size:8px}.recordActions{display:flex;gap:5px}.mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:9px;font-weight:700}.datebar{display:flex;align-items:center;gap:7px}.datebar input{border:1px solid var(--line);border-radius:9px;padding:8px;font-size:10px}.empty{text-align:center;color:var(--muted);font-size:10px;padding:28px 8px}.modal{position:fixed;inset:0;background:#111426a8;z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}.modalbox{width:min(620px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:18px;padding:14px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.modalhead h3{margin:0;font-size:16px}.rx{display:flex;gap:7px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px;margin:5px 0;background:#fafbfc;font-size:10px}.rx input{width:16px;height:16px;accent-color:var(--blue)}.photoNote{font-size:9px;color:var(--muted);margin-top:6px}.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:10px 14px;z-index:100;font-size:10px;font-weight:600;max-width:90%;text-align:center}.toast.bad{background:#a5222b}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(760px,100%);background:var(--navy);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:20}.bottom button{background:none;color:#dfe1e8;font-size:9px;padding:5px 2px}.bottom button.on{color:var(--yellow)}.bottom span{display:block;font-size:16px;margin-bottom:2px}@media(min-width:600px){.app{padding:18px 15px 100px}.grid3{grid-template-columns:1fr .7fr 1fr}.card{padding:18px}}@media(max-width:430px){.grid3{grid-template-columns:1fr 1fr}.grid3 .fullrow{grid-column:1/-1}.stats span{font-size:6px}.nav button{font-size:9px}.checkgrid{grid-template-columns:1fr}.ticketno{font-size:43px}}
</style></head><body><main class="app" id="app"></main><nav class="bottom"><button data-tab="reg"><span>⌂</span>Dashboard</button><button data-tab="list"><span>☷</span>List / Records</button><button data-tab="stats"><span>▥</span>Statistics</button><button data-tab="settings"><span>⚙</span>Settings</button></nav><script>
(()=>{'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());
let date=today(),tab='reg',step=1,patients=[],form=blank(),photoData='',current=null;
const PRE=[['allergies','Allergies',''],['tt','TT','Subject: 0.5 ml IM stat'],['testDose','Test dose','Subject: Injection Xylo test dose'],['attender','Attender',''],['ornaments','Ornaments',''],['consent','Consent','']];
const RX=[['amoxyclav','Tab Amoxyclav 625 mg','BD for 5 days'],['cefu','Tab CefU 200 mg','BD for 5 days'],['paracetamol','Tab Paracetamol 500 mg','BD for 5 days'],['pantop','Tab Pantop 40 mg','OD for 5 days'],['chymoral','Tab Chymoral Forte','1 tab TDS for 5 days']];
const INS=[['cd','C&D daily'],['soak','Watch for soakage'],['warning','Review if there is warning has explained']];
function blank(){return{name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',isSeptic:false,fever:false,bleeding:false,pain:false,shock:false}}
function db(){return firebase.firestore()}
function storage(){return firebase.storage()}
function coll(d=date){return db().collection('minorOT').doc(d).collection('patients')}
async function load(){try{patients=(await coll().get()).docs.map(d=>({id:d.id,...d.data()}))}catch(e){patients=JSON.parse(localStorage.getItem('minorOT_'+date)||'[]');if(!patients.length)toast('Cloud storage unavailable; using this device',true)}}
function localSave(){localStorage.setItem('minorOT_'+date,JSON.stringify(patients))}
function counts(){return[patients.length,...['registered','ready','in-progress','completed'].map(s=>patients.filter(p=>p.status===s).length)]}
function header(){const c=counts();return `<section class="top"><div class="toprow"><div><div class="brand">Minor OT</div><div class="date">${new Date(date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</div></div><div class="toprow"><span class="online"><i></i>Online</span><button class="clear" id="clear">Clear data</button></div></div><div class="nav"><button class="${tab==='reg'?'on':''}" data-tab="reg">Registration</button><button class="${tab==='pre'?'on':''}" data-tab="pre">Pre‑Op</button><button class="${tab==='list'?'on':''}" data-tab="list">OT List</button><button class="${tab==='records'?'on':''}" data-tab="records">Records</button></div><div class="stats">${[['Total',c[0]],['Reg',c[1]],['Ready',c[2]],['Progress',c[3]],['Done',c[4]]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div></section>`}
function registration(){if(step===2)return safety();if(step===3)return token();return `<section class="card"><div class="sectionhead"><div><h2>New patient</h2><p>Fast registration • mobile first</p></div><span class="pill">Step 1 / 3</span></div><div class="field"><label>Patient name</label><input id="name" value="${esc(form.name)}" placeholder="Full name"></div><div class="grid3"><div class="field"><label>Age</label><input id="age" type="number" min="0" value="${esc(form.age)}" placeholder="Age"></div><div class="field"><label>Sex</label><select id="sex"><option value="M" ${form.sex==='M'?'selected':''}>Male</option><option value="F" ${form.sex==='F'?'selected':''}>Female</option><option value="O" ${form.sex==='O'?'selected':''}>Other</option></select></div><div class="field"><label>OPD</label><select id="opd"><option value="">Select OPD</option>${['7A','7B','7C','7D'].map(x=>`<option ${form.opd===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label>Diagnosis</label><input id="diagnosis" value="${esc(form.diagnosis)}" placeholder="Diagnosis"></div><div class="field"><label>Site</label><input id="site" value="${esc(form.site)}" placeholder="Site"></div></div><div class="field"><label>Procedure</label><input id="procedure" value="${esc(form.procedure)}" placeholder="Procedure"></div><div class="field"><label>Pre‑Op photo</label><label class="upload">⇧ Upload photo<input id="photo" type="file" accept="image/*" capture="environment"></label><div class="photoNote">Photo is stored with the patient record and final summary PDF. No separate “view photo” button.</div></div><button class="btn primary" id="next" style="width:100%">Continue to safety checklist</button></section>`}
function safety(){return `<section class="card"><div class="sectionhead"><div><h2>Safety checklist</h2><p>Confirm only the items that apply.</p></div><span class="pill">Step 2 / 3</span></div><div class="triage"><button class="${!form.isSeptic?'selected non':''}" id="non">🟢 NON‑SEPTIC</button><button class="${form.isSeptic?'selected sep':''}" id="sep">🔴 SEPTIC</button></div><div class="flags"><b>Red flags</b><div class="checkgrid">${[['fever','Fever'],['bleeding','Bleeding'],['pain','Severe pain'],['shock','Shock']].map(x=>`<label class="check"><input type="checkbox" id="${x[0]}" ${form[x[0]]?'checked':''}>${x[1]}</label>`).join('')}</div></div><div class="actions" style="display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:11px"><button class="btn soft" id="back">Back</button><button class="btn blue" id="generate">Generate token</button></div></section>`}
function nextToken(){let n=patients.length+1;return (form.isSeptic?'T':'OT-')+String(n).padStart(3,'0')}
function token(){const t=current?.token||nextToken();return `<section class="card"><div class="sectionhead"><div><h2>Token generated</h2><p>Patient is ready for registration.</p></div></div><div class="ticket"><div class="tickettop"><div class="ticketicon">▤</div><div class="ticketlabel">your token number:</div><div class="ticketno">${esc(t)}</div><div class="waiting">number of customers waiting: <b>${patients.filter(p=>p.status==='registered').length}</b></div></div><div class="ticketbottom"><span>Date: ${new Date(date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</span><span>Time: ${new Date().toLocaleTimeString('en-IN')}</span></div></div><div class="tokenActions"><button class="btn green" id="announce">🔊 Announce</button><button class="btn blue" id="printToken">🖨 Print token</button></div><button class="btn yellow" id="new" style="width:100%;margin-top:8px">＋ New registration</button></section>`}
function list(){return `<section class="card"><div class="sectionhead"><div><h2>OT List / Post‑Op</h2><p>Tap status to move the patient.</p></div><div class="datebar"><input id="datePick" type="date" value="${date}"></div></div>${patients.length?patients.map(p=>patientCard(p)).join(''):'<div class="empty">No patients for this date.</div>'}</section>`}
function patientCard(p){return `<div class="queue"><div class="qtop"><span class="token">${esc(p.token)}</span><div><div class="qname">${esc(p.name)}</div><div class="qmeta">${esc(p.age)}/${esc(p.sex)} • ${esc(p.opd)} • ${esc(p.site||'Site not entered')}</div></div><div class="qactions"><button class="icon" data-announce="${esc(p.id)}">🔊</button><button class="icon" data-notes="${esc(p.id)}">📝</button><button class="icon" data-pdf="${esc(p.id)}">📄</button></div></div><div class="workflow">${[['registered','Reg','reg'],['ready','Ready','ready'],['in-progress','Prog','prog'],['completed','Done','done']].map(s=>`<button class="${p.status===s[0]?'active '+s[2]:''}" data-status="${p.id}|${s[0]}">${s[1]}</button>`).join('')}</div>${p.status!=='registered'?`<div class="box ${p.status==='completed'?'postbox':'prebox'}"><div class="boxhead"><span>${p.status==='completed'?'Post‑Op':'Pre‑Op'}</span><span>${p.status==='completed'?'4/4':''}</span></div>${p.status==='completed'?`<label class="upload">⇧ Upload post‑op photo<input type="file" accept="image/*" capture="environment" data-postphoto="${p.id}"></label>`:PRE.map(x=>`<div class="preitem"><label><input type="checkbox" ${p.pre?.[x[0]]?'checked':''} data-pre="${p.id}|${x[0]}">${x[1]}${x[2]?` <span class="na">— ${x[2]}</span>`:''}</label>${x[0]!=='allergies'&&x[0]!=='consent'?`<span class="na">N/A</span>`:''}</div>`).join('')}</div>`:''}</div>`}
function records(){return `<section class="card"><div class="sectionhead"><div><h2>Patient records</h2><p>Date-wise PDF storage & sharing</p></div><div class="datebar"><input id="recordDate" type="date" value="${date}"></div></div>${patients.length?patients.map(p=>`<div class="record"><div class="grow"><b>${esc(p.token)} • ${esc(p.name)}</b><small>${esc(p.diagnosis)} • ${esc(p.procedure)} • ${esc(p.site||'')}</small></div><div class="recordActions"><button class="mini" data-pdf="${esc(p.id)}">PDF</button><button class="mini" data-share="${esc(p.id)}">Share</button></div></div>`).join(''):'<div class="empty">No records for this date.</div>'}</section>`}
function render(){let body=tab==='reg'?registration():tab==='pre'?list():tab==='list'?list():tab==='records'?records():`<section class="card"><h2>Statistics</h2><p style="font-size:10px;color:var(--muted)">Daily workflow counts are shown above.</p></section>`;$('#app').innerHTML=header()+body;document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;step=1;render()});const clear=$('#clear');if(clear)clear.onclick=async()=>{if(confirm('Clear all patients for this date?')){try{const snap=await coll().get();await Promise.all(snap.docs.map(d=>d.ref.delete()))}catch{}patients=[];localSave();render()}};const p=$('#photo');if(p)p.onchange=e=>readPhoto(e.target.files?.[0]);['name','age','sex','opd','diagnosis','site','procedure'].forEach(id=>{const e=$('#'+id);if(e)e.oninput=()=>form[id]=e.value});const next=$('#next');if(next)next.onclick=()=>{if(!form.name||!form.age||!form.opd||!form.diagnosis||!form.site||!form.procedure)return toast('Please complete the required patient details',true);step=2;render()};const non=$('#non');if(non)non.onclick=()=>{form.isSeptic=false;render()};const sep=$('#sep');if(sep)sep.onclick=()=>{form.isSeptic=true;render()};['fever','bleeding','pain','shock'].forEach(id=>{const e=$('#'+id);if(e)e.onchange=()=>form[id]=e.checked});const back=$('#back');if(back)back.onclick=()=>{step=1;render()};const gen=$('#generate');if(gen)gen.onclick=createPatient;const ann=$('#announce');if(ann)ann.onclick=()=>announce(current);const pt=$('#printToken');if(pt)pt.onclick=()=>printToken(current);const nw=$('#new');if(nw)nw.onclick=()=>{form=blank();photoData='';current=null;step=1;tab='reg';render()};const dp=$('#datePick');if(dp)dp.onchange=()=>changeDate(dp.value);const rd=$('#recordDate');if(rd)rd.onchange=()=>changeDate(rd.value);document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.status));document.querySelectorAll('[data-announce]').forEach(b=>b.onclick=()=>announce(patients.find(p=>p.id===b.dataset.announce),false));document.querySelectorAll('[data-notes]').forEach(b=>b.onclick=()=>openNotes(patients.find(p=>p.id===b.dataset.notes)));document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>makePDF(patients.find(p=>p.id===b.dataset.pdf)));document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>sharePDF(patients.find(p=>p.id===b.dataset.share)));document.querySelectorAll('[data-pre]').forEach(e=>e.onchange=()=>savePre(e.dataset.pre,e.checked));document.querySelectorAll('[data-postphoto]').forEach(e=>e.onchange=ev=>uploadPostPhoto(e.dataset.postphoto,ev.target.files?.[0]));}
function readPhoto(file){if(!file)return;const r=new FileReader();r.onload=()=>photoData=r.result;r.readAsDataURL(file)}
async function uploadDataUrl(data,path){if(!data)return null;const ref=storage().ref(path);await ref.putString(data,'data_url');return ref.getDownloadURL()}
async function createPatient(){const token=nextToken(),p={...form,id:crypto.randomUUID(),token,status:'registered',pre:{},post:{},createdAt:new Date().toISOString()};try{if(photoData)p.prePhotoUrl=await uploadDataUrl(photoData,`minorOT/${date}/${p.id}/preop.jpg`);await coll().doc(p.id).set(p)}catch(e){console.error(e);localStorage.setItem('minorOT_'+date,JSON.stringify([...patients,p]));}patients.push(p);localSave();current=p;step=3;render();}
async function changeDate(d){date=d||today();await load();render()}
async function setStatus(raw){const [id,status]=raw.split('|'),p=patients.find(x=>x.id===id);if(!p)return;p.status=status;if(status==='completed')p.completedAt=new Date().toISOString();try{await coll().doc(id).update({status:p.status,completedAt:p.completedAt||null})}catch{}localSave();render()}
async function savePre(raw,v){const [id,k]=raw.split('|'),p=patients.find(x=>x.id===id);if(!p)return;p.pre=p.pre||{};p.pre[k]=v;try{await coll().doc(id).update({pre:p.pre})}catch{}localSave()}
async function uploadPostPhoto(id,file){if(!file)return;const p=patients.find(x=>x.id===id);if(!p)return;try{const data=await fileToData(file);p.postPhotoUrl=await uploadDataUrl(data,`minorOT/${date}/${id}/postop.jpg`);await coll().doc(id).update({postPhotoUrl:p.postPhotoUrl});localSave();toast('Post‑Op photo saved')}catch(e){toast('Photo upload failed',true)}}
function fileToData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function announce(p,dressing=false){if(!p)return;if(!('speechSynthesis'in window))return toast('Text-to-speech is not available',true);speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`திரு ${p.name} அவர்கள் ${dressing?'dressing room':'minor OT room'}க்கு வரவும்.`);u.lang='ta-IN';u.rate=.82;speechSynthesis.speak(u)}
function printToken(p){if(!p)return;const w=window.open('','_blank','width=400,height=600');if(!w)return;w.document.write(`<html><head><title>${p.token}</title><style>body{font-family:Poppins,Arial;text-align:center;padding:25px;color:#303247}.ticket{background:#303247;color:white;border-radius:24px;padding:30px 18px}.n{font-size:52px;font-weight:800}.small{font-size:12px;margin:8px}</style></head><body><div class="ticket"><div class="small">your token number:</div><div class="n">${esc(p.token)}</div><div class="small">${esc(p.name)} • ${esc(p.opd)}</div><div class="small">${date}</div></div><script>window.print();<\/script></body></html>`);w.document.close()}
function openNotes(p){if(!p)return;const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><div class="modalhead"><h3>Operative notes • ${esc(p.token)}</h3><button class="mini" id="close">Close</button></div><div class="field"><label>Operative details</label><textarea id="opText" placeholder="Procedure details, findings, complications, dressing..."></textarea></div><b style="font-size:11px">Prescription</b>${RX.map(x=>`<label class="rx"><input type="checkbox" data-rx="${x[0]}"><span><b>${x[1]}</b><br>${x[2]}</span></label>`).join('')}<b style="font-size:11px;display:block;margin-top:9px">Instructions</b>${INS.map(x=>`<label class="rx"><input type="checkbox" data-ins="${x[0]}"><span>${x[1]}</span></label>`).join('')}<div class="tokenActions"><button class="btn primary" id="saveNotes">Save notes</button><button class="btn blue" id="printNotes">Print notes</button></div></div>`;document.body.appendChild(m);m.querySelector('#close').onclick=()=>m.remove();m.querySelector('#saveNotes').onclick=()=>saveNotes(m,p);m.querySelector('#printNotes').onclick=()=>{saveNotes(m,p,true)} }
async function saveNotes(m,p,print=false){p.otNotes=m.querySelector('#opText').value;p.prescription=RX.filter(x=>m.querySelector(`[data-rx="${x[0]}"]`).checked).map(x=>x[1]+' — '+x[2]);p.instructions=INS.filter(x=>m.querySelector(`[data-ins="${x[0]}"]`).checked).map(x=>x[1]);try{await coll().doc(p.id).update({otNotes:p.otNotes,prescription:p.prescription,instructions:p.instructions})}catch{}localSave();if(print)printNotes(p);else{m.remove();toast('Operative notes saved')}}
function printNotes(p){const w=window.open('','_blank');if(!w)return;w.document.write(`<html><head><title>Operative Notes ${esc(p.token)}</title><style>body{font-family:Arial;padding:25px;color:#202334}h1{font-size:20px}h2{font-size:14px;border-bottom:1px solid #ddd;padding-bottom:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rx{margin:6px 0}</style></head><body><h1>Minor OT — Operative Notes</h1><div class="row"><div><b>Token:</b> ${esc(p.token)}<br><b>Name:</b> ${esc(p.name)}<br><b>Age/Sex:</b> ${esc(p.age)}/${esc(p.sex)}</div><div><b>OPD:</b> ${esc(p.opd)}<br><b>Diagnosis:</b> ${esc(p.diagnosis)}<br><b>Site:</b> ${esc(p.site)}</div></div><h2>Procedure</h2><p>${esc(p.procedure)}</p><h2>Operative details</h2><p>${esc(p.otNotes||'')}</p><h2>Prescription</h2>${(p.prescription||[]).map(x=>`<div class="rx">☐ ${esc(x)}</div>`).join('')}<h2>Instructions</h2>${(p.instructions||[]).map(x=>`<div class="rx">☐ ${esc(x)}</div>`).join('')}<script>window.print();<\/script></body></html>`);w.document.close()}
async function makePDF(p,share=false){if(!p)return;const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});pdf.setTextColor(48,50,71);pdf.setFont('helvetica','bold');pdf.setFontSize(20);pdf.text('Minor OT — Patient Summary',15,18);pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.text(`Date: ${date}`,15,25);pdf.text(`Token: ${p.token}`,150,25);let y=35;const rows=[['Patient',p.name],['Age / Sex',`${p.age} / ${p.sex}`],['OPD',p.opd],['Diagnosis',p.diagnosis],['Site',p.site],['Procedure',p.procedure],['Type',p.isSeptic?'SEPTIC':'NON-SEPTIC'],['Status',p.status]];pdf.setFontSize(10);rows.forEach(r=>{pdf.setFont('helvetica','bold');pdf.text(r[0]+':',15,y);pdf.setFont('helvetica','normal');pdf.text(String(r[1]||''),48,y);y+=7});pdf.setFont('helvetica','bold');pdf.text('Pre‑Op checklist',15,y+3);y+=10;pdf.setFont('helvetica','normal');PRE.forEach(x=>{pdf.text(`${p.pre?.[x[0]]?'☑':'☐'} ${x[1]}${x[2]?' — '+x[2]:''}`,18,y);y+=6});if(p.otNotes){y+=3;pdf.setFont('helvetica','bold');pdf.text('Operative notes',15,y);y+=6;pdf.setFont('helvetica','normal');const lines=pdf.splitTextToSize(p.otNotes,175);pdf.text(lines,18,y);y+=lines.length*5+5}if(p.prescription?.length){pdf.setFont('helvetica','bold');pdf.text('Prescription',15,y);y+=6;pdf.setFont('helvetica','normal');p.prescription.forEach(x=>{pdf.text('• '+x,18,y);y+=6})}if(p.instructions?.length){pdf.setFont('helvetica','bold');pdf.text('Instructions',15,y);y+=6;pdf.setFont('helvetica','normal');p.instructions.forEach(x=>{pdf.text('• '+x,18,y);y+=6})}const imgs=[['Pre‑Op photo',p.prePhotoUrl],['Post‑Op photo',p.postPhotoUrl]];for(const [label,url] of imgs){if(!url)continue;if(y>225){pdf.addPage();y=20}pdf.setFont('helvetica','bold');pdf.text(label,15,y);y+=5;try{const data=await fetch(url).then(r=>r.blob()).then(blobToData);pdf.addImage(data,'JPEG',15,y,75,65);y+=72}catch{}}pdf.setFontSize(7);pdf.setTextColor(110,115,130);pdf.text('Generated by Minor OT Manager',15,288);if(share)return uploadPDF(p,pdf);pdf.save(`${date}_${p.token}_${p.name.replace(/\s+/g,'_')}.pdf`)}
function blobToData(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
async function uploadPDF(p,pdf){try{const blob=pdf.output('blob');const ref=storage().ref(`minorOT/${date}/${p.id}/patient-summary.pdf`);await ref.put(blob,{contentType:'application/pdf'});const url=await ref.getDownloadURL();await coll().doc(p.id).update({pdfUrl:url,pdfDate:date});p.pdfUrl=url;toast('PDF stored for this date');if(navigator.share)await navigator.share({title:`${p.token} Patient Summary`,text:`Minor OT patient summary — ${p.name}`,url});else window.open(url,'_blank')}catch(e){toast('PDF storage/share failed',true)}}
async function sharePDF(p){if(p.pdfUrl){if(navigator.share)navigator.share({title:`${p.token} Patient Summary`,url:p.pdfUrl});else window.open(p.pdfUrl,'_blank');return}await makePDF(p,true)}
async function start(){try{if(!firebase.apps.length)firebase.initializeApp(window.firebaseConfig)}catch(e){}await load();render()}start();
})();</script></body></html>
