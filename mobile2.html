();toast('Operative notes saved');render()}}function patientPrint(p){const old=$('#printSheet');if(old)old.remove();const o=p.otNotes||{},s=document.createElement('section');s.id='printSheet';s.innerHTML=`<div style="font-family:Arial;padding:14mm;color:#111"><h2 style="text-align:center">MINOR OT – PATIENT RECORD</h2><p><b>Name:</b> ${esc(p.name)}<br><b>Age/Sex:</b> ${esc(p.age||'-')}/${p.sex==='F'?'Female':'Male'}<br><b>Date:</b> ${esc(p.date)}<br><b>Token:</b> ${esc(p.token)}</p><h3>OT NOTES</h3><hr><p><b>Diagnosis:</b> ${esc(o.diagnosis||p.diagnosis||'-')}</p><p><b>Procedure:</b> ${esc(o.procedure||p.procedure||'-')}</p><p><b>Site:</b> ${esc(o.site||p.site||'-')}</p><p><b>Findings:</b> ${esc(o.findings||'-')}</p><p><b>Operative Details:</b> ${esc(o.details||'-')}</p><h3>MEDICATIONS</h3><hr>${(p.prescription||[]).map(x=>`<div>• ${esc(x)}</div>`).join('')||'-'}<h3>ADVICE</h3><hr>${(p.instructions||[]).map(x=>`<div>• ${esc(x)}</div>`).join('')||'-'}<div style="display:flex;gap:8mm;flex-wrap:wrap;margin-top:8mm">${p.preOpPhoto?`<div><img src="${p.preOpPhoto}" style="width:78mm;max-height:62mm;object-fit:contain"><div>Pre‑Op Photo</div></div>`:''}${p.postOpPhoto?`<div><img src="${p.postOpPhoto}" style="width:78mm;max-height:62mm;object-fit:contain"><div>Post‑Op Photo</div></div>`:''}</div><div style="margin-top:12mm;font-size:10pt">IGMC&RI - Department of Surgery</div></div>`;document.body.appendChild(s);setTimeout(()=>window.print(),40)}function records(){return `${header()}<section class="card"><div class="head"><h2 class="title" style="margin:0">Records</h2><input id="datePick" type="date" value="${esc(date)}" style="width:145px;padding:8px;border:1px solid var(--l);border-radius:9px"></div><button class="btn green full" id="summary" style="margin-top:9px">🖨 Print Summary — Completed Patients</button>${patients.map(p=>`<article class="patient"><div class="prow"><span class="token">${esc(p.token)}</span><b>${esc(p.name)}</b><span class="push sub">${esc(p.status)}</span></div><div class="info">${esc(p.age||'-')}/${p.sex==='F'?'F':'M'} · ${esc(p.diagnosis||'-')}</div><button class="btn ${p.status==='completed'?'green':'yellow'} full mark" data-t="${esc(p.token)}" style="margin-top:7px">${p.status==='completed'?'Done':'Mark Completed'}</button><button class="btn primary full print" data-t="${esc(p.token)}" style="margin-top:7px">Print PDF</button></article>`).join('')||'<div class="empty">No records for this date.</div>'}</section>`}function summary(){const d=patients.filter(p=>p.status==='completed');if(!d.length){toast('No completed patients');return}const s=document.createElement('section');s.id='printSheet';s.innerHTML=`<div style="font-family:Arial;padding:12mm"><h2 style="text-align:center">MINOR OT — COMPLETED PATIENT SUMMARY</h2><div style="text-align:center">${esc(date)} · ${d.length} completed</div>${d.map((p,i)=>`<div style="border:1px solid #aaa;padding:5mm;margin:5mm 0"><b>${i+1}. ${esc(p.token)} — ${esc(p.name)}</b><div>${esc(p.age||'-')}/${p.sex==='F'?'F':'M'} · ${esc(p.diagnosis||'-')} · ${esc(p.procedure||'-')}</div><div><b>Findings:</b> ${esc(p.otNotes?.findings||'-')}</div></div>`).join('')}<div style="margin-top:8mm;font-size:10pt">IGMC&RI - Department of Surgery</div></div>`;document.body.appendChild(s);setTimeout(()=>window.print(),40)}function bind(){ $$('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});const c=$('#clear');if(c)c.onclick=()=>{if(confirm('Clear ALL patient data from this device? This cannot be undone.')){patients=[];current=null;prePhoto='';localStorage.removeItem(KEY);render();toast('All patient data cleared')}}if(page==='reg'){$('#goPre').onclick=()=>{if(readForm()){page='pre';render()}else toast('Complete required details')};bindPhoto('pre',x=>prePhoto=x)}if(page==='pre')bindPre();if(page==='token'){$('#announce').onclick=()=>announce(current);$('#thermal').onclick=()=>thermal(current);$('#system').onclick=()=>systemToken(current);$('#new').onclick=()=>{form={name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',septic:false};prePhoto='';current=null;page='reg';render()}}if(page==='list'){$$('.adv').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.t);if(p)advance(p)});$$('.ann').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.t);if(p)announce(p)});$$('.notes').forEach(b=>b.onclick=()=>openNotes(b.dataset.t));$$('.print').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.t);if(p)patientPrint(p)})}if(page==='records'){$('#datePick').onchange=()=>{date=$('#datePick').value||today();localStorage.setItem(DK,date);localLoad();cloudLoad();render()};$('#summary').onclick=summary;$$('.mark').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.t);if(p){p.status='completed';localSave();cloudSave(p);render()}});$$('.print').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.t);if(p)patientPrint(p)})}}function render(){localLoad();if(page==='reg')app.innerHTML=reg();else if(page==='pre')app.innerHTML=pre();else if(page==='token')app.innerHTML=tokenPage();else if(page==='list')app.innerHTML=list();else app.innerHTML=records();bind()}window.addEventListener('afterprint',()=>$('#printSheet')?.remove());render();cloudLoad();</script></body></html>
