<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minor OT Manager</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>:root{--navy:#303247;--yellow:#ffc400;--bg:#f4f7fb;--ink:#25293b;--muted:#74798a;--line:#e5e8ef;--green:#20c66a;--red:#ee454d;--blue:#3478ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:14px 12px 90px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 5px 20px #26324a0a}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800}.muted{color:var(--muted);font-size:11px}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d8dce5;border-radius:10px;padding:11px;background:#fff;color:var(--ink)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:700;font-size:11px}.primary{background:var(--navy);color:#fff}.yellow{background:var(--yellow);color:#302900}.blue{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.soft{background:#f0f2f5;color:#404554}.upload{display:block;border:1px dashed #8da9df;background:#f7faff;color:#2459a9;text-align:center;padding:12px;border-radius:10px;font-size:11px;font-weight:700}.upload input{display:none}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{border:1px solid #eee;border-radius:9px;padding:9px;font-size:10px}.check label{display:flex;gap:6px;align-items:center}.check input{width:16px;height:16px;accent-color:var(--blue)}.ticket{background:var(--navy);color:#fff;border-radius:22px;padding:22px;text-align:center;position:relative}.ticket:before,.ticket:after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:var(--bg);top:50%;margin-top:-14px}.ticket:before{left:-14px}.ticket:after{right:-14px}.tokenno{font-size:48px;font-weight:800;line-height:1.1}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.patient{border:1px solid var(--line);border-radius:14px;padding:11px;margin:8px 0;background:#fff}.token{font-weight:800;font-size:16px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.row .push{margin-left:auto}.photo{width:100%;max-height:180px;object-fit:contain;border-radius:10px;margin-top:7px}.modal{position:fixed;inset:0;background:#111426aa;z-index:20;padding:10px;overflow:auto}.modalbox{max-width:650px;margin:auto;background:#fff;border-radius:18px;padding:15px}.rx{display:flex;gap:7px;border:1px solid var(--line);padding:8px;border-radius:9px;margin:5px 0;font-size:10px}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.bottom button{background:none;color:#fff;border:0;padding:9px 2px;font-size:9px}.bottom button.active{color:var(--yellow)}.toast{position:fixed;bottom:65px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:10px;z-index:50;max-width:90%;text-align:center}@media(max-width:430px){.checks{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.tokenno{font-size:43px}}</style></head><body><main class="app" id="app"></main><nav class="bottom"><button data-p="reg">Registration</button><button data-p="pre">Pre‑Op</button><button data-p="list">OT List</button><button data-p="records">Records</button></nav><script>(async()=>{'use strict';const app=document.getElementById('app');const db=firebase.firestore();const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());let date=today(),page='reg',step=1,patients=[],form={name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',septic:false},prePhoto='',current=null;const checklist=['Allergies','TT — Subject: 0.5 ml IM stat','Test dose — Subject: Injection Xylo test dose','Attender','Ornaments','Consent'];const meds=['Tab Amoxyclav 625 mg BD for 5 days','Tab CefU 200 mg BD for 5 days','Tab Paracetamol 500 mg BD for 5 days','Tab Pantop 40 mg OD for 5 days','Tab Chymoral Forte 1 tab TDS for 5 days'];const instructions=['C&D daily','Watch for soakage','Review if there is warning has explained'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const col=()=>db.collection('minorOT').doc(date).collection('patients');function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}function compress(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const max=1000,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.7))};im.onerror=reject;im.src=e.target.result};r.onerror=reject;r.readAsDataURL(file)})}function photoInput(id,label,cb){return `<label class="upload">📷 ${label}<input id="${id}" type="file" accept="image/*" capture="environment" onchange="window._photo('${id}',this.files[0],${cb})"></label>`}window._photo=async(id,file,cb)=>{try{const x=await compress(file);window[cb]=x;render();toast('Photo compressed and stored') }catch(e){toast('Photo could not be read')}};async function load(){try{patients=(await col().get()).docs.map(d=>({id:d.id,...d.data()}))}catch(e){patients=JSON.parse(localStorage.getItem('mot_'+date)||'[]')}}function saveLocal(){localStorage.setItem('mot_'+date,JSON.stringify(patients))}function reg(){return `<section class="card"><div class="top"><div><div class="brand">Minor OT</div><div class="muted">New patient registration</div></div><span class="muted">Step 1/3</span></div><div class="field"><label>Patient name</label><input id="name" value="${esc(form.name)}"></div><div class="grid"><div class="field"><label>Age</label><input id="age" type="number" value="${esc(form.age)}"></div><div class="field"><label>Sex</label><select id="sex"><option>M</option><option ${form.sex==='F'?'selected':''}>F</option></select></div></div><div class="field"><label>OPD</label><select id="opd"><option value="">Select OPD</option>${['7A','7B','7C','7D'].map(x=>`<option ${form.opd===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Diagnosis</label><input id="diagnosis" value="${esc(form.diagnosis)}"></div><div class="field"><label>Site</label><input id="site" value="${esc(form.site)}"></div><div class="field"><label>Procedure</label><input id="procedure" value="${esc(form.procedure)}"></div>${photoInput('prephoto','Upload Pre‑Op Photo','prePhoto')}${prePhoto?'<div class="muted">✓ Compressed photo attached</div>':''}<button class="btn primary" style="width:100%;margin-top:12px" onclick="nextPre()">Continue to Safety Checklist</button></section>`}window.nextPre=()=>{form.name=$('#name').value.trim();form.age=$('#age').value;form.sex=$('#sex').value;form.opd=$('#opd').value;form.diagnosis=$('#diagnosis').value.trim();form.site=$('#site').value.trim();form.procedure=$('#procedure').value.trim();if(!form.name||!form.diagnosis||!form.site||!form.procedure)return toast('Complete patient details');step=2;page='pre';render()};function safety(){return `<section class="card"><div class="top"><div><h2>Safety Checklist</h2><div class="muted">N/A is separate and does not count as completed.</div></div></div>${checklist.map((x,i)=>`<div class="check"><label><input id="done${i}" type="checkbox"> ${x}</label><label class="muted"><input id="na${i}" type="checkbox"> N/A</label></div>`).join('')}<div class="row" style="margin-top:14px"><button class="btn soft" onclick="page='reg';step=1;render()">Back</button><button class="btn yellow push" onclick="generateToken()">Generate Token</button></div></section>`}async function generateToken(){const done=checklist.map((x,i)=>({name:x,done:$('#done'+i).checked,na:$('#na'+i).checked}));let n=0;try{n=(await col().get()).size}catch(e){n=patients.length}const token='OT-'+String(n+1).padStart(3,'0');const p={...form,token,date,status:'registered',preChecklist:done,preOpPhoto:prePhoto,createdAt:new Date().toISOString()};try{await col().doc(token).set(p)}catch(e){patients.push({...p,id:token});saveLocal()}current=p;patients.push(p);page='token';step=3;render();toast('Token generated successfully')};function token(){const p=current;return `<section class="card"><div class="ticket"><div>MINOR OT TOKEN</div><div class="tokenno">${esc(p?.token)}</div><div>${esc(p?.name)}</div><div>${esc(p?.opd)} · ${esc(p?.site)}</div></div><div class="actions"><button class="btn yellow" onclick="announce(${JSON.stringify(p?.name)})">🔊 Announce</button><button class="btn primary" onclick="printPatient()">Print</button></div></section>`}window.announce=n=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('திரு '+n+' அவர்கள் Minor OT roomக்கு வரவும்.');u.lang='ta-IN';speechSynthesis.speak(u)};window.printPatient=()=>window.print();function list(){return `<section class="card"><div class="top"><div><h2>OT List</h2><div class="muted">${date}</div></div></div>${patients.length?patients.map(p=>`<div class="patient"><div class="row"><span class="token">${esc(p.token)}</span><b>${esc(p.name)}</b><span class="muted">${esc(p.opd)}</span><span class="push"></span><button class="btn yellow" onclick="announce(${JSON.stringify(p.name)})">🔊</button></div><div class="muted">${esc(p.diagnosis)} · ${esc(p.site)} · ${esc(p.procedure)}</div><div class="row" style="margin-top:8px"><button class="btn primary" onclick="openNotes('${esc(p.token)}')">Operative Notes</button><button class="btn soft" onclick="setDone('${esc(p.token)}')">${p.status==='completed'?'Completed':'Mark Complete'}</button></div></div>`).join(''):'<div class="muted" style="padding:20px">No patients for today.</div>'}</section>`}window.setDone=async t=>{const p=patients.find(x=>x.token===t);if(!p)return;p.status='completed';try{await col().doc(t).update({status:'completed'})}catch(e){}saveLocal();render()};function records(){return `<section class="card"><div class="top"><div><h2>Records</h2><div class="muted">Date-wise Patient Summary PDFs</div></div><input id="recdate" type="date" value="${date}" onchange="changeDate(this.value)"></div>${patients.map(p=>`<div class="patient"><b>${esc(p.token)} — ${esc(p.name)}</b><div class="muted">${esc(p.diagnosis)} · ${esc(p.site)}</div><div class="row" style="margin-top:7px"><button class="btn primary" onclick="makePDF('${esc(p.token)}')">PDF</button><button class="btn yellow" onclick="sharePDF('${esc(p.token)}')">Share</button></div></div>`).join('')||'<div class="muted" style="padding:20px">No records for this date.</div>'}</section>`}window.changeDate=async d=>{date=d;await load();render()};function openNotes(t){const p=patients.find(x=>x.token===t);if(!p)return;let m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><div class="top"><h2>Operative Notes</h2><button class="btn soft" onclick="this.closest('.modal').remove()">Close</button></div><div class="field"><label>Diagnosis</label><input id="od" value="${esc(p.diagnosis)}"></div><div class="field"><label>Procedure</label><input id="op" value="${esc(p.procedure)}"></div><div class="field"><label>Site</label><input id="os" value="${esc(p.site)}"></div><div class="field"><label>Findings</label><textarea id="of" rows="3"></textarea></div><div class="field"><label>Operative details</label><textarea id="ox" rows="3"></textarea></div><h3>Prescription</h3>${meds.map((x,i)=>`<div class="rx"><input id="rx${i}" type="checkbox"> ${x}</div>`).join('')}<h3>Instructions</h3>${instructions.map((x,i)=>`<div class="rx"><input id="in${i}" type="checkbox"> ${x}</div>`).join('')}<div style="margin-top:10px">${photoInput('postphoto','Upload Post‑Op Photo','postPhoto')}${p.postOpPhoto?'<div class="muted">✓ Post‑Op photo already stored</div>':''}</div><div class="row" style="margin-top:12px"><button class="btn yellow" onclick="saveNotes('${esc(t)}',this)">Save & Print PDF</button></div></div>`;document.body.appendChild(m)}let postPhoto='';window.saveNotes=async(t,b)=>{const p=patients.find(x=>x.token===t);if(!p)return;p.otNotes={diagnosis:$('#od').value,procedure:$('#op').value,site:$('#os').value,findings:$('#of').value,details:$('#ox').value};p.prescription=meds.filter((x,i)=>$('#rx'+i).checked);p.instructions=instructions.filter((x,i)=>$('#in'+i).checked);if(postPhoto)p.postOpPhoto=postPhoto;try{await col().doc(t).update({otNotes:p.otNotes,prescription:p.prescription,instructions:p.instructions,postOpPhoto:p.postOpPhoto||''})}catch(e){}saveLocal();b.closest('.modal').remove();toast('Operative notes saved');render()};async function makePDF(t){const p=patients.find(x=>x.token===t);if(!p)return;const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'mm',format:'a4'});let y=12;d.setFont('helvetica','bold');d.setFontSize(15);d.text('MINOR OT – PATIENT SUMMARY',105,y,{align:'center'});y+=8;d.setFontSize(9);d.setFont('helvetica','normal');const lines=[`Token: ${p.token}    Date: ${p.date}`,`Name: ${p.name}    Age/Sex: ${p.age}/${p.sex}    OPD: ${p.opd}`,`Diagnosis: ${p.diagnosis}`,`Site: ${p.site}`,`Procedure: ${p.procedure}`,`Category: ${p.septic?'Septic':'Non-septic'}`];lines.forEach(x=>{d.text(x,10,y);y+=5});y+=2;d.setFont('helvetica','bold');d.text('PRE-OPERATIVE',10,y);y+=5;d.setFont('helvetica','normal');(p.preChecklist||[]).forEach(x=>{d.text(`${x.done?'✓':'○'} ${x.name}${x.na?' (N/A)':''}`,10,y);y+=4});y+=2;d.setFont('helvetica','bold');d.text('OPERATIVE NOTES',10,y);y+=5;d.setFont('helvetica','normal');let o=p.otNotes||{};[`Diagnosis: ${o.diagnosis||p.diagnosis}`,`Procedure: ${o.procedure||p.procedure}`,`Site: ${o.site||p.site}`,`Findings: ${o.findings||'-'}`,`Details: ${o.details||'-'}`].forEach(x=>{let a=d.splitTextToSize(x,185);d.text(a,10,y);y+=4*a.length});y+=2;d.setFont('helvetica','bold');d.text('PRESCRIPTION / INSTRUCTIONS',10,y);y+=5;d.setFont('helvetica','normal');(p.prescription||[]).forEach(x=>{d.text('□ '+x,10,y);y+=4});(p.instructions||[]).forEach(x=>{d.text('□ '+x,10,y);y+=4});let imgs=[p.preOpPhoto,p.postOpPhoto].filter(Boolean);if(imgs.length){y=Math.max(y+3,170);d.setFont('helvetica','bold');d.text('PHOTOGRAPHS',10,y);y+=4;let w=88;for(let i=0;i<imgs.length;i++){try{d.addImage(imgs[i],'JPEG',10+i*95,y,w,55);d.setFont('helvetica','normal');d.text(i===0?'Pre-Op':'Post-Op',10+i*95,y+59)}catch(e){}}}d.save(`${p.token}_${p.name.replace(/[^a-z0-9]+/gi,'_')}.pdf`);return d.output('blob')};window.makePDF=makePDF;window.sharePDF=async t=>{const p=patients.find(x=>x.token===t);if(!p)return;try{const blob=await makePDF(t);const file=new File([blob],`${p.token}_summary.pdf`,{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({title:'Minor OT Patient Summary',files:[file]});else toast('PDF saved. Use your device Share option from the saved file.')}catch(e){toast('PDF generated and saved')}};document.querySelectorAll('.bottom button').forEach(b=>b.onclick=async()=>{page=b.dataset.p;if(page==='pre'&&step!==2)step=2;await load();render()});window.openNotes=openNotes;async function render(){await load();app.innerHTML=page==='reg'?reg():page==='pre'?safety():page==='token'?token():page==='list'?list():records()}render()})();</script></body></html>
