<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Minor OT Manager</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>:root{--navy:#303247;--yellow:#ffc400;--bg:#f4f7fb;--ink:#25293b;--muted:#74798a;--line:#e3e7ee;--green:#20c66a;--blue:#3478ee;--red:#ee454d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:12px 12px 86px}.header{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 6px 22px #26324a0b}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:25px;font-weight:800;letter-spacing:-.5px}.sub{font-size:11px;color:var(--muted);margin-top:1px}.online{background:#d9f8e8;color:#087445;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}.clear{border:0;background:var(--red);color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;font-size:10px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}.tab{border:0;background:#f0f2f5;color:var(--ink);padding:11px 4px;border-radius:11px;font-size:11px;font-weight:700}.tab.active{background:var(--navy);color:#fff}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.stat{padding:8px 3px;text-align:center;border-radius:11px;border:1px solid var(--line);background:#fff}.stat b{display:block;font-size:17px}.stat span{font-size:8px;font-weight:700;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px;box-shadow:0 6px 22px #26324a0b}.sectiontitle{font-size:20px;font-weight:800;margin:0 0 12px}.field{margin:9px 0}.field label{display:block;font-size:10px;font-weight:700;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d5dae3;border-radius:10px;padding:12px;background:#fff;color:var(--ink);outline:none;font-size:13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:11px;padding:12px 14px;font-size:11px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:#fff}.yellow{background:var(--yellow);color:#302900}.green{background:var(--green);color:#fff}.soft{background:#f0f2f5;color:#414657}.upload{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:1px dashed #8da9df;background:#f7faff;color:#2459a9;padding:13px;border-radius:11px;font-size:11px;font-weight:700;cursor:pointer}.upload input{display:none}.attached{font-size:10px;color:#087445;margin-top:5px;font-weight:600}.checklist{display:grid;gap:8px}.checkrow{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff}.checkmain{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:600}.checkmain input{width:19px;height:19px;accent-color:var(--green)}.na{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:10px;color:#687080}.na input{width:17px;height:17px;accent-color:var(--yellow)}.checkrow.naactive{background:#fff9df;border-color:#f0d35a}.checkrow.naactive .checkmain{opacity:.55}.checkrow.doneactive{background:#effcf5;border-color:#9de5bd}.hint{font-size:10px;color:var(--muted);margin-bottom:10px}.ticket{background:var(--navy);color:#fff;border-radius:24px;padding:22px 18px 18px;text-align:center;position:relative;overflow:hidden}.ticket:before,.ticket:after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:var(--bg);top:52%;transform:translateY(-50%)}.ticket:before{left:-14px}.ticket:after{right:-14px}.ticketlabel{font-size:11px;opacity:.85;font-weight:600;letter-spacing:1px}.tokenno{font-size:52px;font-weight:800;line-height:1.05;margin:6px 0}.ticketname{font-size:15px;font-weight:600}.ticketmeta{font-size:11px;opacity:.85;margin-top:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.patient{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px;background:#fff}.prow{display:flex;align-items:center;gap:8px}.token{font-weight:800;font-size:15px}.push{margin-left:auto}.tiny{font-size:10px;color:var(--muted)}.patientinfo{font-size:11px;color:#555d6d;margin-top:6px;line-height:1.7}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:grid;grid-template-columns:repeat(4,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:none;color:#fff;padding:10px 2px;font-size:9px}.bottom button.active{color:var(--yellow)}.modal{position:fixed;inset:0;background:#111426aa;z-index:30;padding:10px;overflow:auto}.modalbox{max-width:650px;margin:12px auto;background:#fff;border-radius:18px;padding:16px}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalhead h2{font-size:20px;margin:0}.rx{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);padding:10px;border-radius:10px;margin:6px 0;font-size:11px}.rx input{width:18px;height:18px;accent-color:var(--green)}.toast{position:fixed;left:50%;bottom:72px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 15px;border-radius:11px;font-size:10px;z-index:60;max-width:90%;text-align:center;box-shadow:0 8px 25px #0003}.empty{padding:24px 8px;text-align:center;color:var(--muted);font-size:12px}.photo-note{font-size:9px;color:var(--muted);margin-top:4px}@media(max-width:430px){.app{padding:9px 9px 82px}.brand{font-size:23px}.card{padding:13px}.grid2{grid-template-columns:1fr 1fr}.field input,.field select,.field textarea{font-size:14px;padding:12px}.sectiontitle{font-size:20px}.tokenno{font-size:48px}.stats{gap:4px}.stat b{font-size:16px}}</style></head><body><main class="app" id="app"></main><nav class="bottom"><button data-page="reg">Registration</button><button data-page="pre">Pre‑Op</button><button data-page="list">OT List</button><button data-page="records">Records</button></nav><script>'use strict';const app=document.getElementById('app');let db=null;try{if(window.firebase&&firebase.apps.length)db=firebase.firestore()}catch(e){}const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());let date=today(),page='reg',patients=[],form={name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',septic:false},prePhoto='',current=null;const checklist=[{name:'Allergies',key:'allergies'},{name:'TT — 0.5 ml IM stat',key:'tt'},{name:'Test dose — Injection Xylo test dose',key:'testdose'},{name:'Attender',key:'attender'},{name:'Ornaments',key:'ornaments'},{name:'Consent',key:'consent'}];const meds=['Tab Amoxyclav 625 mg BD for 5 days','Tab CefU 200 mg BD for 5 days','Tab Paracetamol 500 mg BD for 5 days','Tab Pantop 40 mg OD for 5 days','Tab Chymoral Forte 1 tab TDS for 5 days'];const instructions=['C&D daily','Watch for soakage','Review if there is warning has explained'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=()=>`mot_${date}`;const col=()=>db?db.collection('minorOT').doc(date).collection('patients'):null;function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2400)}function saveLocal(){localStorage.setItem(key(),JSON.stringify(patients))}async function load(){try{if(col()){const s=await col().get();patients=s.docs.map(d=>({id:d.id,...d.data()}));saveLocal();return}}catch(e){}try{patients=JSON.parse(localStorage.getItem(key())||'[]')}catch(e){patients=[]}}function compress(file){return new Promise((resolve,reject)=>{if(!file)return reject(new Error('No file'));const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1100,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));const ctx=c.getContext('2d');ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.68))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}function photoBlock(id,label){return `<label class="upload">📷 ${label}<input id="${id}" type="file" accept="image/*" capture="environment"></label><div id="${id}_status" class="photo-note"></div>`}function bindPhoto(id,which){const el=document.getElementById(id);if(!el)return;el.addEventListener('change',async()=>{const f=el.files&&el.files[0];if(!f)return;const s=document.getElementById(id+'_status');s.textContent='Compressing photo…';try{const data=await compress(f);if(which==='pre')prePhoto=data;else if(current)current.postOpPhoto=data;s.textContent='✓ Photo compressed and attached';toast('Photo attached successfully')}catch(e){s.textContent='Photo could not be read';toast('Photo upload failed')}})}function header(){const c={total:patients.length,reg:patients.filter(p=>p.status==='registered').length,ready:patients.filter(p=>p.status==='ready').length,progress:patients.filter(p=>p.status==='progress').length,done:patients.filter(p=>p.status==='completed').length};return `<header class="header"><div class="headrow"><div><div class="brand">Minor OT</div><div class="sub">${esc(date)}</div></div><div class="online">● Online</div></div><div class="headrow" style="margin-top:10px"><div></div><button class="clear" id="clear">🗑 Clear All Data</button></div><div class="tabs"><button class="tab ${page==='reg'?'active':''}" data-page="reg">Registration</button><button class="tab ${page==='pre'?'active':''}" data-page="pre">Pre‑Op</button><button class="tab ${page==='list'||page==='token'?'active':''}" data-page="list">List</button></div><div class="stats"><div class="stat"><b>${c.total}</b><span>Total</span></div><div class="stat"><b>${c.reg}</b><span>Reg</span></div><div class="stat"><b>${c.ready}</b><span>Ready</span></div><div class="stat"><b>${c.progress}</b><span>Progress</span></div><div class="stat"><b>${c.done}</b><span>Done</span></div></div></header>`}function reg(){return `${header()}<section class="card"><h2 class="sectiontitle">New Patient</h2><div class="field"><label>Patient Name *</label><input id="name" value="${esc(form.name)}" placeholder="Enter patient name"></div><div class="grid2"><div class="field"><label>Age</label><input id="age" type="number" min="0" value="${esc(form.age)}" placeholder="Age"></div><div class="field"><label>Sex</label><select id="sex"><option value="M" ${form.sex==='M'?'selected':''}>Male</option><option value="F" ${form.sex==='F'?'selected':''}>Female</option></select></div></div><div class="grid2"><div class="field"><label>OPD *</label><select id="opd"><option value="">Select OPD</option>${['7A','7B','7C','7D'].map(x=>`<option ${form.opd===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Diagnosis *</label><input id="diagnosis" value="${esc(form.diagnosis)}" placeholder="Diagnosis"></div></div><div class="grid2"><div class="field"><label>Site *</label><input id="site" value="${esc(form.site)}" placeholder="Site"></div><div class="field"><label>Procedure *</label><input id="procedure" value="${esc(form.procedure)}" placeholder="Procedure"></div></div><div class="field"><label>Case Type</label><select id="septic"><option value="0">Non‑Septic</option><option value="1" ${form.septic?'selected':''}>Septic</option></select></div>${photoBlock('prePhotoInput','Upload Pre‑Op Photo')}<div id="preStatus" class="attached">${prePhoto?'✓ Compressed photo attached':''}</div><button class="btn primary" id="toSafety" style="width:100%;margin-top:12px">Continue to Safety Checklist</button></section>`}async function readForm(){form.name=document.getElementById('name').value.trim();form.age=document.getElementById('age').value;form.sex=document.getElementById('sex').value;form.opd=document.getElementById('opd').value;form.diagnosis=document.getElementById('diagnosis').value.trim();form.site=document.getElementById('site').value.trim();form.procedure=document.getElementById('procedure').value.trim();form.septic=document.getElementById('septic').value==='1';if(!form.name||!form.opd||!form.diagnosis||!form.site||!form.procedure){toast('Please complete the required patient details');return false}return true}function safety(){return `${header()}<section class="card"><h2 class="sectiontitle">Safety Checklist</h2><div class="hint">For each item, choose either <b>Done</b> or <b>N/A</b>. Selecting N/A disables the Done checkbox for that item.</div><div class="checklist">${checklist.map((x,i)=>`<div class="checkrow" id="cr${i}"><label class="checkmain"><input class="donebox" data-i="${i}" id="done${i}" type="checkbox"> ${x.name}</label><label class="na"><input class="nabox" data-i="${i}" id="na${i}" type="checkbox"> Not applicable (N/A)</label></div>`).join('')}</div><div class="row" style="display:flex;gap:8px;margin-top:14px"><button class="btn soft" id="backReg">Back</button><button class="btn yellow" id="generate" style="margin-left:auto">Generate Token</button></div></section>`}function bindSafety(){document.querySelectorAll('.nabox').forEach(n=>n.addEventListener('change',()=>{const i=n.dataset.i,d=document.getElementById('done'+i),r=document.getElementById('cr'+i);if(n.checked){d.checked=false;d.disabled=true;r.classList.add('naactive');r.classList.remove('doneactive')}else{d.disabled=false;r.classList.remove('naactive')}}));document.querySelectorAll('.donebox').forEach(d=>d.addEventListener('change',()=>{const i=d.dataset.i,n=document.getElementById('na'+i),r=document.getElementById('cr'+i);if(d.checked){n.checked=false;n.disabled=true;r.classList.add('doneactive');r.classList.remove('naactive')}else{n.disabled=false;r.classList.remove('doneactive')}}));document.getElementById('backReg').onclick=()=>{page='reg';render()};document.getElementById('generate').onclick=generateToken}async function generateToken(){const preChecklist=checklist.map((x,i)=>({name:x.name,done:document.getElementById('done'+i).checked,na:document.getElementById('na'+i).checked}));let max=0;patients.forEach(p=>{const n=parseInt(String(p.token||'').replace(/\D/g,''));if(n>max)max=n});const token='OT-'+String(max+1).padStart(3,'0');const p={...form,token,date,status:'registered',preChecklist,preOpPhoto:prePhoto,createdAt:new Date().toISOString()};try{if(col())await col().doc(token).set(p)}catch(e){}patients.push(p);saveLocal();current=p;page='token';render();announce(p.name);toast('Token generated: '+token)}function token(){const p=current;return `${header()}<section class="card"><div class="ticket"><div class="ticketlabel">MINOR OT TOKEN</div><div class="tokenno">${esc(p.token)}</div><div class="ticketname">${esc(p.name)}</div><div class="ticketmeta">${esc(p.age)}/${esc(p.sex)} · OPD ${esc(p.opd)} · ${esc(p.site)}</div></div><div class="actions"><button class="btn yellow" id="announce">🔊 Announce</button><button class="btn primary" id="printToken">🖨 Print Token</button></div><button class="btn soft" id="newPatient" style="width:100%;margin-top:8px">+ New Patient</button></section>`}function announce(name){if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`திரு ${name} அவர்கள் Minor OT roomக்கு வரவும்.`);u.lang='ta-IN';window.speechSynthesis.speak(u)}function list(){return `${header()}<section class="card"><div class="headrow"><div><h2 class="sectiontitle" style="margin:0">OT List / Post‑Op</h2><div class="sub">${esc(date)}</div></div></div>${patients.length?patients.map(p=>`<article class="patient"><div class="prow"><span class="token">${esc(p.token)}</span><b>${esc(p.name)}</b><span class="push tiny">${esc(p.opd)}</span></div><div class="patientinfo">${esc(p.age)}/${esc(p.sex)} · ${esc(p.diagnosis)} · ${esc(p.site)}<br>${esc(p.procedure)}</div><div class="actions"><button class="btn yellow ann" data-name="${esc(p.name)}">🔊 Announce</button><button class="btn primary notes" data-token="${esc(p.token)}">Operative Notes</button></div><div class="row" style="display:flex;gap:8px;margin-top:8px"><button class="btn soft status" data-token="${esc(p.token)}" style="flex:1">Status: ${esc(p.status)}</button><button class="btn green pdf" data-token="${esc(p.token)}">PDF</button></div></article>`).join(''):'<div class="empty">No patients for this date.</div>'}</section>`}function records(){return `${header()}<section class="card"><div class="headrow"><div><h2 class="sectiontitle" style="margin:0">Records</h2><div class="sub">Date-wise patient records and PDF</div></div><input id="datePick" type="date" value="${date}" style="width:145px;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:10px"></div>${patients.length?patients.map(p=>`<article class="patient"><div class="prow"><span class="token">${esc(p.token)}</span><b>${esc(p.name)}</b><span class="push tiny">${esc(p.status)}</span></div><div class="patientinfo">${esc(p.diagnosis)} · ${esc(p.site)} · ${esc(p.procedure)}</div><div class="actions"><button class="btn primary pdf" data-token="${esc(p.token)}">Generate PDF</button><button class="btn yellow share" data-token="${esc(p.token)}">Share PDF</button></div></article>`).join(''):'<div class="empty">No records for this date.</div>'}</section>`}function openNotes(t){const p=patients.find(x=>x.token===t);if(!p)return;const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Operative Notes</h2><button class="btn soft close">Close</button></div><div class="field"><label>Diagnosis</label><input id="od" value="${esc(p.diagnosis)}"></div><div class="field"><label>Procedure</label><input id="op" value="${esc(p.procedure)}"></div><div class="field"><label>Site</label><input id="os" value="${esc(p.site)}"></div><div class="field"><label>Findings</label><textarea id="of" rows="3" placeholder="Enter findings"></textarea></div><div class="field"><label>Operative details</label><textarea id="ox" rows="3" placeholder="Brief operative details"></textarea></div><h3 style="font-size:14px">Prescription</h3>${meds.map((x,i)=>`<label class="rx"><input id="rx${i}" type="checkbox">${x}</label>`).join('')}<h3 style="font-size:14px">Discharge Instructions</h3>${instructions.map((x,i)=>`<label class="rx"><input id="in${i}" type="checkbox">${x}</label>`).join('')}<div style="margin-top:10px">${photoBlock('postPhotoInput','Upload Post‑Op Photo')}${p.postOpPhoto?'<div class="attached">✓ Existing Post‑Op photo stored</div>':''}</div><button class="btn yellow" id="saveNotes" style="width:100%;margin-top:12px">Save Operative Notes</button></div>`;document.body.appendChild(m);bindPhoto('postPhotoInput','post');m.querySelector('.close').onclick=()=>m.remove();m.querySelector('#saveNotes').onclick=async()=>{p.otNotes={diagnosis:document.getElementById('od').value,procedure:document.getElementById('op').value,site:document.getElementById('os').value,findings:document.getElementById('of').value,details:document.getElementById('ox').value};p.prescription=meds.filter((x,i)=>document.getElementById('rx'+i).checked);p.instructions=instructions.filter((x,i)=>document.getElementById('in'+i).checked);try{if(col())await col().doc(t).update({otNotes:p.otNotes,prescription:p.prescription,instructions:p.instructions,postOpPhoto:p.postOpPhoto||''})}catch(e){}saveLocal();m.remove();toast('Operative notes saved');render()}}async function makePDF(t){const p=patients.find(x=>x.token===t);if(!p||!window.jspdf){toast('PDF library not ready');return null}const {jsPDF}=window.jspdf;const d=new jsPDF({unit:'mm',format:'a4'});let y=12;d.setFont('helvetica','bold');d.setFontSize(15);d.text('MINOR OT – PATIENT SUMMARY',105,y,{align:'center'});y+=8;d.setFontSize(9);d.setFont('helvetica','normal');[`Token: ${p.token}    Date: ${p.date}`,`Name: ${p.name}    Age/Sex: ${p.age}/${p.sex}    OPD: ${p.opd}`,`Diagnosis: ${p.diagnosis}`,`Site: ${p.site}`,`Procedure: ${p.procedure}`,`Category: ${p.septic?'Septic':'Non-septic'}`].forEach(x=>{d.text(x,10,y);y+=5});y+=2;d.setFont('helvetica','bold');d.text('PRE-OPERATIVE CHECKLIST',10,y);y+=5;d.setFont('helvetica','normal');(p.preChecklist||[]).forEach(x=>{d.text(`${x.done?'Done':'○'}${x.na?' N/A':''}  ${x.name}`,10,y);y+=4});y+=2;d.setFont('helvetica','bold');d.text('OPERATIVE NOTES',10,y);y+=5;d.setFont('helvetica','normal');const o=p.otNotes||{};[[`Diagnosis`,o.diagnosis||p.diagnosis],[`Procedure`,o.procedure||p.procedure],[`Site`,o.site||p.site],[`Findings`,o.findings||'-'],[`Details`,o.details||'-']].forEach(([k,v])=>{const a=d.splitTextToSize(`${k}: ${v}`,185);d.text(a,10,y);y+=4*a.length});y+=2;d.setFont('helvetica','bold');d.text('PRESCRIPTION / INSTRUCTIONS',10,y);y+=5;d.setFont('helvetica','normal');(p.prescription||[]).forEach(x=>{d.text('□ '+x,10,y);y+=4});(p.instructions||[]).forEach(x=>{d.text('□ '+x,10,y);y+=4});const imgs=[['Pre-Op',p.preOpPhoto],['Post-Op',p.postOpPhoto]].filter(x=>x[1]);if(imgs.length){y=Math.max(y+3,175);d.setFont('helvetica','bold');d.text('PHOTOGRAPHS',10,y);y+=4;imgs.slice(0,2).forEach((im,i)=>{try{d.addImage(im[1],'JPEG',10+i*95,y,88,55);d.setFont('helvetica','normal');d.text(im[0],10+i*95,y+59)}catch(e){}})}return d.output('blob')}async function sharePDF(t){const p=patients.find(x=>x.token===t),blob=await makePDF(t);if(!blob)return;const file=new File([blob],`${p.token}_summary.pdf`,{type:'application/pdf'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:`${p.token} Patient Summary`,files:[file]})}catch(e){}}else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('PDF downloaded')}}function bindCommon(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=async()=>{page=b.dataset.page;await load();render()});const clear=document.getElementById('clear');if(clear)clear.onclick=async()=>{if(confirm('Clear all data for today?')){patients=[];localStorage.removeItem(key());if(col()){try{const s=await col().get(),batch=db.batch();s.docs.forEach(x=>batch.delete(x.ref));await batch.commit()}catch(e){}}render()}}}function bindPage(){bindCommon();if(page==='reg'){bindPhoto('prePhotoInput','pre');document.getElementById('toSafety').onclick=async()=>{if(await readForm()){page='pre';render()}}}if(page==='pre')bindSafety();if(page==='token'){document.getElementById('announce').onclick=()=>announce(current.name);document.getElementById('printToken').onclick=()=>window.print();document.getElementById('newPatient').onclick=()=>{form={name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',septic:false};prePhoto='';current=null;page='reg';render()}}if(page==='list'){document.querySelectorAll('.ann').forEach(b=>b.onclick=()=>announce(b.dataset.name));document.querySelectorAll('.notes').forEach(b=>b.onclick=()=>openNotes(b.dataset.token));document.querySelectorAll('.pdf').forEach(b=>b.onclick=async()=>{const blob=await makePDF(b.dataset.token);if(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.dataset.token+'_summary.pdf';a.click()}});document.querySelectorAll('.status').forEach(b=>b.onclick=async()=>{const p=patients.find(x=>x.token===b.dataset.token);if(!p)return;const next={registered:'ready',ready:'progress',progress:'completed',completed:'completed'}[p.status]||'registered';p.status=next;try{if(col())await col().doc(p.token).update({status:next})}catch(e){}saveLocal();render()})}if(page==='records'){const dp=document.getElementById('datePick');dp.onchange=async()=>{date=dp.value;await load();render()};document.querySelectorAll('.pdf').forEach(b=>b.onclick=async()=>{const blob=await makePDF(b.dataset.token);if(blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=b.dataset.token+'_summary.pdf';a.click()}});document.querySelectorAll('.share').forEach(b=>b.onclick=()=>sharePDF(b.dataset.token))}}async function render(){await load();app.innerHTML=page==='reg'?reg():page==='pre'?safety():page==='token'?token():page==='list'?list():records();bindPage()}render();</script></body></html>
