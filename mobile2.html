<style>
:root{--navy:#303247;--yellow:#ffc400;--green:#20c66a;--red:#ee454d;--bg:#f4f7fb;--ink:#25293b;--muted:#74798a;--line:#e1e5ec}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,Arial,sans-serif}body{padding-bottom:78px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;padding:9px}.header,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:9px;box-shadow:0 5px 20px #23304610}.head{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:24px;font-weight:800}.sub{font-size:11px;color:var(--muted)}.online{background:#dff8eb;color:#087445;padding:7px 9px;border-radius:99px;font-size:10px;font-weight:700}.clear{border:0;background:var(--red);color:#fff;border-radius:9px;padding:9px 10px;font-size:11px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.stat{text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 2px}.stat b{display:block;font-size:17px}.stat span{font-size:9px;color:var(--muted);font-weight:700}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.tab{border:0;background:#eef0f4;border-radius:9px;padding:10px 2px;font-size:12px;font-weight:700}.tab.active{background:var(--navy);color:#fff}.title{font-size:21px;font-weight:800;margin:0 0 11px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #d3d8e1;border-radius:10px;padding:12px;font-size:15px;background:#fff;color:var(--ink);outline:none}.field textarea{min-height:85px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:10px;padding:12px 13px;font-size:13px;font-weight:800}.primary{background:var(--navy);color:#fff}.yellow{background:var(--yellow);color:#302900}.green{background:var(--green);color:#fff}.soft{background:#eef0f4;color:#414657}.red{background:var(--red);color:#fff}.full{width:100%}.upload{display:flex;justify-content:center;border:1px dashed #7e9bd0;background:#f7faff;color:#2459a9;border-radius:10px;padding:13px;font-size:13px;font-weight:800;cursor:pointer}.upload input{display:none}.photo{font-size:11px;color:#087445;font-weight:700;margin-top:5px}.checklist{display:grid;gap:8px}.checkrow{border:1px solid var(--line);border-radius:11px;padding:10px}.checkmain{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700}.checkmain input,.na input,.rx input{width:19px;height:19px}.na{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:11px;color:var(--muted)}.checkrow.done{background:#effcf5;border-color:#9de5bd}.checkrow.naactive{background:#fff9df;border-color:#efd05a}.ticket{background:var(--navy);color:#fff;border-radius:18px;padding:20px 8px;text-align:center}.ticketlabel{font-size:10px;letter-spacing:1px}.tokenno{font-size:58px;font-weight:900;line-height:1;margin:5px 0}.ticketname{font-size:17px;font-weight:800}.ticketmeta{font-size:11px;line-height:1.5;margin-top:4px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.patient{border:1px solid var(--line);border-radius:12px;padding:11px;margin-top:8px}.prow{display:flex;gap:7px;align-items:center}.token{font-size:15px;font-weight:900}.push{margin-left:auto}.info{font-size:12px;color:#555d6d;line-height:1.6;margin-top:5px}.status{width:100%;margin-top:8px}.modal{position:fixed;inset:0;background:#0a0e1e99;z-index:50;padding:9px;overflow:auto}.modalbox{max-width:650px;margin:9px auto;background:#fff;border-radius:16px;padding:14px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;font-size:20px}.section{font-size:15px;font-weight:800;margin:13px 0 6px}.rx{display:flex;gap:7px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:8px;margin:5px 0;font-size:12px}.toast{position:fixed;left:10px;right:10px;bottom:79px;z-index:100;background:var(--navy);color:#fff;border-radius:10px;padding:11px;text-align:center;font-size:12px;font-weight:700}.empty{text-align:center;color:var(--muted);padding:22px}.datebar{display:flex;justify-content:space-between;align-items:center;gap:8px}.datebar input{width:145px;border:1px solid var(--line);border-radius:9px;padding:8px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navy);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:none;color:#fff;padding:12px 2px;font-size:10px}.bottom button.active{color:var(--yellow)}#printSheet{display:none}.tokenPrintSheet{width:58mm;background:#fff;color:#000;font-family:Arial,sans-serif;text-align:center}.tokenPrintNumber{font-size:80px;font-weight:900;line-height:1;margin:0}.tokenPrintFooter{font-size:10px;font-weight:700;line-height:1.1;margin-top:3px}@media print{@page{margin:0;size:58mm auto}html,body{margin:0!important;padding:0!important}body>*:not(#printSheet){display:none!important}#printSheet{display:block!important;margin:0!important;padding:0!important}}@media(max-width:430px){.app{padding:7px}.tokenno{font-size:52px}.stat b{font-size:16px}}

<body>
<main id="app" class="app"></main>
<nav class="bottom"><button data-page="reg">Registration</button><button data-page="pre">Pre-Op</button><button data-page="list">OT List</button><button data-page="records">Records</button></nav>
<script>
'use strict';
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const FB={apiKey:'AIzaSyBhLTBL9j5ynCqLE_-0Bkj-qVY3v3SEz0g',authDomain:'minor-ot-manager.firebaseapp.com',projectId:'minor-ot-manager',storageBucket:'minor-ot-manager.firebasestorage.app',messagingSenderId:'240851011199',appId:'1:240851011199:web:3c3cf35c56751849eb214a'};
let db=null;try{if(window.firebase){if(!firebase.apps.length)firebase.initializeApp(FB);db=firebase.firestore()}}catch(e){console.error(e)}
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());
const KEY='mot_patients_v1',DATEKEY='mot_date_v1';
let date=localStorage.getItem(DATEKEY)||today(),page='reg',patients=[],current=null,prePhoto='';
let form={name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',septic:false};
const checklist=[{name:'Allergies',na:false},{name:'TT — 0.5 ml IM stat',na:true},{name:'Test dose — Injection Xylo test dose',na:true},{name:'Attender',na:true},{name:'Ornaments',na:true},{name:'Consent',na:false}];
const meds=['Tab Amoxyclav 625 mg BD for 5 days','Tab CefU 200 mg BD for 5 days','Tab Paracetamol 500 mg BD for 5 days','Tab Pantop 40 mg OD for 5 days','Tab Chymoral Forte 1 tab TDS for 5 days'];
const advice=['C&D daily','Watch for soakage','Review if there is warning has explained'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2300)}
function localLoad(){try{patients=JSON.parse(localStorage.getItem(KEY+'_'+date)||'[]');if(!Array.isArray(patients))patients=[]}catch(e){patients=[]}}
function localSave(){try{localStorage.setItem(KEY+'_'+date,JSON.stringify(patients));localStorage.setItem(DATEKEY,date);return true}catch(e){toast('Local storage is full');return false}}
function cloudCol(){return db?db.collection('minorOT').doc(date).collection('patients'):null}
function cloudSave(p){const c=cloudCol();if(!c)return;c.doc(p.token).set(p,{merge:true}).catch(e=>console.error('Cloud save',e))}
async function cloudLoad(){const c=cloudCol();if(!c)return;try{const s=await c.get();if(!s.empty){patients=s.docs.map(d=>({id:d.id,...d.data()}));localSave();render()}}catch(e){console.warn('Cloud load',e)}}
function photoBlock(id,label){return '<label class="upload">📷 '+label+'<input id="'+id+'" type="file" accept="image/*" capture="environment"></label><div id="'+id+'_status" class="photo"></div>'}
function bindPhoto(id,cb){const el=document.getElementById(id);if(!el)return;el.onchange=()=>{const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=900,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.55));const st=document.getElementById(id+'_status');if(st)st.textContent='✓ Photo attached';toast('Photo attached')};im.onerror=()=>toast('Photo failed');im.src=r.result};r.onerror=()=>toast('Photo failed');r.readAsDataURL(f)}}
function counts(){return{total:patients.length,reg:patients.filter(p=>p.status==='registered').length,ready:patients.filter(p=>p.status==='ready').length,progress:patients.filter(p=>p.status==='progress').length,done:patients.filter(p=>p.status==='completed').length}}
function header(){const c=counts();return '<header class="header"><div class="head"><div><div class="brand">Minor OT Manager</div><div class="sub">'+esc(date)+'</div></div><div class="online">● Online</div></div><div style="text-align:right;margin-top:9px"><button class="clear" id="clear">🗑 Clear All Data</button></div><div class="stats"><div class="stat"><b>'+c.total+'</b><span>Total</span></div><div class="stat"><b>'+c.reg+'</b><span>Reg</span></div><div class="stat"><b>'+c.ready+'</b><span>Ready</span></div><div class="stat"><b>'+c.progress+'</b><span>Progress</span></div><div class="stat"><b>'+c.done+'</b><span>Done</span></div></div><div class="tabs"><button class="tab '+(page==='reg'?'active':'')+'" data-page="reg">Registration</button><button class="tab '+(page==='pre'?'active':'')+'" data-page="pre">Pre-Op</button><button class="tab '+((page==='list'||page==='token')?'active':'')+'" data-page="list">OT List</button></div></header>'}
function regPage(){return header()+'<section class="card"><h2 class="title">New Patient</h2><div class="field"><label>Patient Name *</label><input id="name" value="'+esc(form.name)+'" placeholder="Enter patient name"></div><div class="grid2"><div class="field"><label>Age</label><input id="age" type="number" min="0" value="'+esc(form.age)+'"></div><div class="field"><label>Sex</label><select id="sex"><option value="M" '+(form.sex==='M'?'selected':'')+'>Male</option><option value="F" '+(form.sex==='F'?'selected':'')+'>Female</option></select></div></div><div class="grid2"><div class="field"><label>OPD *</label><select id="opd"><option value="">Select OPD</option>'+['7A','7B','7C','7D'].map(x=>'<option value="'+x+'" '+(form.opd===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Diagnosis *</label><input id="diagnosis" value="'+esc(form.diagnosis)+'"></div></div><div class="grid2"><div class="field"><label>Site *</label><input id="site" value="'+esc(form.site)+'"></div><div class="field"><label>Procedure *</label><input id="procedure" value="'+esc(form.procedure)+'"></div></div><div class="field"><label>Case Type</label><select id="septic"><option value="0" '+(!form.septic?'selected':'')+'>Non-Septic</option><option value="1" '+(form.septic?'selected':'')+'>Septic</option></select></div>'+photoBlock('prePhoto','Upload Pre-Op Photo')+'<div class="photo">'+(prePhoto?'✓ Pre-Op photo attached':'')+'</div><button class="btn primary full" id="goPre" style="margin-top:12px">Continue to Safety Checklist</button></section>'}
function readForm(){form.name=$('#name').value.trim();form.age=$('#age').value;form.sex=$('#sex').value;form.opd=$('#opd').value;form.diagnosis=$('#diagnosis').value.trim();form.site=$('#site').value.trim();form.procedure=$('#procedure').value.trim();form.septic=$('#septic').value==='1';if(!form.name||!form.opd||!form.diagnosis||!form.site||!form.procedure){toast('Please complete all required details');return false}return true}
function prePage(){return header()+'<section class="card"><h2 class="title">Safety Checklist</h2><div style="font-size:11px;color:var(--muted);margin-bottom:9px">Done and N/A are mutually exclusive.</div><div class="checklist">'+checklist.map((x,i)=>'<div class="checkrow" id="cr'+i+'"><label class="checkmain"><input class="done" id="d'+i+'" type="checkbox">'+x.name+'</label>'+(x.na?'<label class="na"><input class="nabox" id="n'+i+'" type="checkbox">N/A</label>':'')+'</div>').join('')+'</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn soft" id="back">Back</button><button class="btn yellow" id="gen" style="margin-left:auto">Generate Token</button></div></section>'}
function bindPre(){ $$('.nabox').forEach(n=>n.onchange=()=>{const i=n.id.slice(1),d=$('#d'+i),r=$('#cr'+i);if(n.checked){d.checked=false;d.disabled=true;r.classList.add('naactive')}else{d.disabled=false;r.classList.remove('naactive')}});$$('.done').forEach(d=>d.onchange=()=>{const i=d.id.slice(1),n=$('#n'+i),r=$('#cr'+i);if(d.checked){if(n){n.checked=false;n.disabled=true}r.classList.add('done')}else{if(n)n.disabled=false;r.classList.remove('done')}});$('#back').onclick=()=>{page='reg';render()};$('#gen').onclick=generateToken}
function generateToken(){let max=0;patients.forEach(p=>{const n=parseInt(String(p.token||'').replace(/\D/g,''),10);if(Number.isFinite(n)&&n>max)max=n});const token='OT-'+String(max+1).padStart(3,'0');const p={...form,token,date,status:'registered',preChecklist:checklist.map((x,i)=>({name:x.name,done:!!$('#d'+i)?.checked,na:!!$('#n'+i)?.checked})),preOpPhoto:prePhoto||'',postOpPhoto:'',otNotes:{diagnosis:form.diagnosis,procedure:form.procedure,site:form.site,findings:'',details:''},medications:[],advice:[],hpeSent:false,hpeNA:false,pusCultureSent:false,pusCultureNA:false,createdAt:new Date().toISOString()};patients.push(p);localSave();cloudSave(p);current=p;page='token';render();toast('Token generated: '+token)}
function tokenPage(){if(!current){page='reg';return regPage()}const p=current;return header()+'<section class="card"><div class="ticket"><div class="ticketlabel">MINOR OT TOKEN</div><div class="tokenno">'+esc(p.token)+'</div><div class="ticketname">'+esc(p.name)+'</div><div class="ticketmeta">'+esc(p.age||'-')+' / '+esc(p.sex==='F'?'Female':'Male')+' · '+esc(p.diagnosis)+' · '+esc(p.site)+'</div></div><div class="actions"><button class="btn yellow" id="announce">🔊 Announce</button><button class="btn primary" id="printToken">🖨 Seznik Thermal</button></div><button class="btn soft full" id="systemToken" style="margin-top:8px">🖨 System Print</button><button class="btn soft full" id="newPatient" style="margin-top:8px">+ New Patient</button></section>'}
function announceToken(p){if(!('speechSynthesis' in window)){toast('Tamil voice is not supported');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('தயவு செய்து டோக்கன் எண் '+String(p.token).replace(/^OT-/i,'')+' ஐ அணுகவும்');u.lang='ta-IN';u.rate=.9;speechSynthesis.speak(u)}
let b21Busy=false;const SERVICE='0000ae30-0000-1000-8000-00805f9b34fb',TX='0000ae01-0000-1000-8000-00805f9b34fb';
function crc8(data){let c=0;for(const v of data){c^=v;for(let i=0;i<8;i++)c=(c&128)?((c<<1)^7)&255:(c<<1)&255}return c}
function packet(cmd,data){data=data||[];return new Uint8Array([81,120,cmd,0,data.length&255,(data.length>>8)&255,...data,crc8(data),255])}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function thermalRows(lines){const W=384,rows=[];lines.forEach((text,idx)=>{const fs=idx===0?80:idx===lines.length-1?10:18,h=idx===0?100:idx===lines.length-1?18:28,c=document.createElement('canvas');c.width=W;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,h);x.fillStyle='#000';x.font='900 '+fs+'px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(String(text),W/2,h/2);const px=x.getImageData(0,0,W,h).data;for(let y=0;y<h;y++){const row=new Uint8Array(48);let ink=false;for(let xx=0;xx<W;xx++){if(px[(y*W+xx)*4]<160){row[xx>>3]|=1<<(xx&7);ink=true}}if(ink)rows.push(row)}});return rows}
async function thermalPrint(p){if(b21Busy)return;b21Busy=true;try{if(!navigator.bluetooth)throw new Error('Web Bluetooth is not available. Use Chrome on Android.');const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SERVICE]});const server=await device.gatt.connect();let ch=null;const services=await server.getPrimaryServices();for(const s of services){const cs=await s.getCharacteristics().catch(()=>[]);ch=cs.find(c=>c.uuid.toLowerCase()===TX&&(c.properties.write||c.properties.writeWithoutResponse));if(ch)break}if(!ch)throw new Error('Printer writable channel not found');const write=async bytes=>{for(let i=0;i<bytes.length;i+=120){const part=bytes.slice(i,i+120);if(ch.writeValueWithoutResponse)await ch.writeValueWithoutResponse(part);else await ch.writeValue(part);await sleep(25)}};await write(packet(163,[0]));await write(packet(164,[50]));await write(packet(175,[255,255]));await write(packet(190,[1]));for(const row of thermalRows([String(p.token),'IGMC&RI - Department of Surgery']))await write(packet(162,[...row]));await write(packet(189,[25]));await write(packet(161,[48,0]));toast('SEZNIK B21: token sent')}catch(e){toast('Thermal print failed: '+(e.message||'Unknown error'))}finally{b21Busy=false}}
function statusLabel(s){return({registered:'Registered',ready:'Ready',progress:'In Progress',completed:'Done'})[s]||'Registered'}
function advance(p){const n={registered:'ready',ready:'progress',progress:'completed',completed:'completed'}[p.status]||'registered';p.status=n;localSave();cloudSave(p);toast('Status: '+statusLabel(n));render()}
function listPage(){return header()+'<section class="card"><h2 class="title">OT List</h2><div class="sub">'+esc(date)+'</div>'+(patients.length?patients.map(p=>'<article class="patient"><div class="prow"><span class="token">'+esc(p.token)+'</span><b>'+esc(p.name)+'</b><span class="push sub">'+esc(p.opd)+'</span></div><div class="info">'+esc(p.age||'-')+'/'+esc(p.sex==='F'?'F':'M')+' · '+esc(p.diagnosis||'-')+' · '+esc(p.site||'-')+'<br>'+esc(p.procedure||'-')+'</div><button class="btn soft status" data-token="'+esc(p.token)+'">Status: '+esc(statusLabel(p.status))+(p.status!=='completed'?' → Advance':'')+'</button><div class="actions"><button class="btn yellow ann" data-token="'+esc(p.token)+'">🔊 Announce</button>'+(p.status==='completed'?'<button class="btn primary notes" data-token="'+esc(p.token)+'">Operative Notes</button>':'<button class="btn soft" disabled>Notes after Done</button>')+'</div>'+(p.status==='completed'?'<button class="btn green full print" data-token="'+esc(p.token)+'" style="margin-top:8px">Print PDF</button>':'')+'</article>').join(''):'<div class="empty">No patients for this date.</div>')+'</section>'}
function mutual(title,a,b,sa,sb){return '<div class="section">'+title+'</div><label class="rx"><input id="'+a+'" type="checkbox" '+(sa?'checked':'')+'> Sent</label><label class="rx"><input id="'+b+'" type="checkbox" '+(sb?'checked':'')+'> N/A</label>'}
function openNotes(token){const p=patients.find(x=>x.token===token);if(!p||p.status!=='completed')return;let post=p.postOpPhoto||'';const m=document.createElement('div');m.className='modal';const o=p.otNotes||{};m.innerHTML='<div class="modalbox"><div class="modalhead"><h2>Operative Notes</h2><button class="btn soft close">Close</button></div><div class="field"><label>Diagnosis</label><input id="od" value="'+esc(o.diagnosis||p.diagnosis)+'"></div><div class="field"><label>Procedure</label><input id="op" value="'+esc(o.procedure||p.procedure)+'"></div><div class="field"><label>Site</label><input id="os" value="'+esc(o.site||p.site)+'"></div><div class="field"><label>Findings</label><textarea id="of">'+esc(o.findings||'')+'</textarea></div><div class="field"><label>Operative Details</label><textarea id="ox">'+esc(o.details||'')+'</textarea></div>'+mutual('HPE','hpeS','hpeN',p.hpeSent,p.hpeNA)+mutual('Pus Culture','pusS','pusN',p.pusCultureSent,p.pusCultureNA)+'<div class="section">Medications</div>'+meds.map((x,i)=>'<label class="rx"><input id="m'+i+'" type="checkbox" '+((p.medications||[]).includes(x)?'checked':'')+'>'+esc(x)+'</label>').join('')+'<div class="section">Advice</div>'+advice.map((x,i)=>'<label class="rx"><input id="a'+i+'" type="checkbox" '+((p.advice||[]).includes(x)?'checked':'')+'>'+esc(x)+'</label>').join('')+photoBlock('postPhoto','Upload Post-Op Photo')+'<div class="photo">'+(post?'✓ Existing Post-Op photo stored':'')+'</div><button class="btn yellow full" id="saveNotes" style="margin-top:10px">Save Operative Notes</button></div>';document.body.appendChild(m);bindPhoto('postPhoto',d=>{post=d});function pair(a,b){const x=m.querySelector('#'+a),y=m.querySelector('#'+b);x.onchange=()=>{if(x.checked)y.checked=false};y.onchange=()=>{if(y.checked)x.checked=false}}pair('hpeS','hpeN');pair('pusS','pusN');m.querySelector('.close').onclick=()=>m.remove();m.querySelector('#saveNotes').onclick=()=>{p.otNotes={diagnosis:m.querySelector('#od').value,procedure:m.querySelector('#op').value,site:m.querySelector('#os').value,findings:m.querySelector('#of').value,details:m.querySelector('#ox').value};p.medications=meds.filter((x,i)=>m.querySelector('#m'+i).checked);p.advice=advice.filter((x,i)=>m.querySelector('#a'+i).checked);p.postOpPhoto=post;p.hpeSent=m.querySelector('#hpeS').checked;p.hpeNA=m.querySelector('#hpeN').checked;p.pusCultureSent=m.querySelector('#pusS').checked;p.pusCultureNA=m.querySelector('#pusN').checked;localSave();cloudSave(p);m.remove();toast('Operative notes saved');render()}}
function makePrint(p){const old=$('#printSheet');if(old)old.remove();const o=p.otNotes||{},s=document.createElement('section');s.id='printSheet';const list=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<div>-</div>';s.innerHTML='<div style="font-family:Arial,sans-serif;padding:14mm;color:#111;max-width:210mm"><h2 style="text-align:center">MINOR OT — PATIENT RECORD</h2><div><b>Name:</b> '+esc(p.name)+'<br><b>Age/Sex:</b> '+esc(p.age||'-')+'/'+esc(p.sex||'-')+'<br><b>Date:</b> '+esc(p.date)+'<br><b>Token:</b> '+esc(p.token)+'</div><h3>OT NOTES</h3><hr><p><b>Diagnosis:</b> '+esc(o.diagnosis||p.diagnosis||'-')+'</p><p><b>Procedure:</b> '+esc(o.procedure||p.procedure||'-')+'</p><p><b>Site:</b> '+esc(o.site||p.site||'-')+'</p><p><b>Findings:</b> '+esc(o.findings||'-')+'</p><p><b>Details:</b> '+esc(o.details||'-')+'</p><h3>MEDICATIONS</h3>'+list(p.medications)+'<h3>ADVICE</h3>'+list(p.advice)+'<div style="display:flex;gap:8mm;flex-wrap:wrap">'+(p.preOpPhoto?'<div><img src="'+p.preOpPhoto+'" style="width:78mm;max-height:62mm;object-fit:contain"><div>Pre-Op Photo</div></div>':'')+(p.postOpPhoto?'<div><img src="'+p.postOpPhoto+'" style="width:78mm;max-height:62mm;object-fit:contain"><div>Post-Op Photo</div></div>':'')+'</div><div style="margin-top:12mm;font-size:10pt">IGMC&RI - Department of Surgery</div></div>';document.body.appendChild(s);setTimeout(()=>window.print(),50)}
function printTokenSystem(p){const old=$('#printSheet');if(old)old.remove();const s=document.createElement('section');s.id='printSheet';s.innerHTML='<div class="tokenPrintSheet"><div class="tokenPrintNumber">'+esc(p.token)+'</div><div class="tokenPrintFooter">IGMC&RI - Department of Surgery</div></div>';document.body.appendChild(s);setTimeout(()=>window.print(),50)}
function recordsPage(){return header()+'<section class="card"><div class="datebar"><div><h2 class="title" style="margin:0">Records</h2><div class="sub">Date-wise patient records</div></div><input id="datePick" type="date" value="'+esc(date)+'"></div><button class="btn yellow full" id="summary" style="margin-top:12px">Print Completed Summary</button>'+(patients.length?patients.map(p=>'<article class="patient"><div class="prow"><span class="token">'+esc(p.token)+'</span><b>'+esc(p.name)+'</b><span class="push sub">'+esc(statusLabel(p.status))+'</span></div><div class="info">'+esc(p.age||'-')+'/'+esc(p.sex||'-')+' · '+esc(p.diagnosis||'-')+' · '+esc(p.site||'-')+'</div><button class="btn primary full print" data-token="'+esc(p.token)+'" style="margin-top:8px">Print PDF</button></article>').join(''):'<div class="empty">No records for this date.</div>')+'</section>'}
function printSummary(){const done=patients.filter(p=>p.status==='completed');if(!done.length){toast('No completed patients');return}const old=$('#printSheet');if(old)old.remove();const s=document.createElement('section');s.id='printSheet';s.innerHTML='<div style="font-family:Arial,sans-serif;padding:12mm"><h2 style="text-align:center">MINOR OT — COMPLETED PATIENT SUMMARY</h2><div style="text-align:center">'+esc(date)+' · '+done.length+' completed</div>'+done.map((p,i)=>'<div style="border:1px solid #bbb;padding:5mm;margin-top:5mm"><b>'+(i+1)+'. '+esc(p.token)+' — '+esc(p.name)+'</b><div style="margin-top:2mm">'+esc(p.age||'-')+'/'+esc(p.sex||'-')+' · '+esc(p.diagnosis||'-')+' · '+esc(p.site||'-')+' · '+esc(p.procedure||'-')+'</div></div>').join('')+'<div style="margin-top:8mm">IGMC&RI - Department of Surgery</div></div>';document.body.appendChild(s);setTimeout(()=>window.print(),50)}
function clearAll(){if(!confirm('Clear all patient data on this device?'))return;patients=[];current=null;localStorage.removeItem(KEY+'_'+date);toast('All local patient data cleared');render()}
function bind(){ $$('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});const c=$('#clear');if(c)c.onclick=clearAll;if(page==='reg'){bindPhoto('prePhoto',d=>{prePhoto=d});$('#goPre').onclick=()=>{if(readForm()){page='pre';render()}}}else if(page==='pre'){bindPre()}else if(page==='token'){const p=current;$('#announce').onclick=()=>announceToken(p);$('#printToken').onclick=()=>thermalPrint(p);$('#systemToken').onclick=()=>printTokenSystem(p);$('#newPatient').onclick=()=>{form={name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',septic:false};prePhoto='';current=null;page='reg';render()}}else if(page==='list'){ $$('.ann').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.token);if(p)announceToken(p)});$$('.status').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.token);if(p&&p.status!=='completed')advance(p)});$$('.notes').forEach(b=>b.onclick=()=>openNotes(b.dataset.token));$$('.print').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.token);if(p)makePrint(p)})}else if(page==='records'){$('#datePick').onchange=()=>{date=$('#datePick').value||today();localStorage.setItem(DATEKEY,date);localLoad();render();cloudLoad()};$('#summary').onclick=printSummary;$$('.print').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.token);if(p)makePrint(p)})}}
function render(){localLoad();if(page==='reg')app.innerHTML=regPage();else if(page==='pre')app.innerHTML=prePage();else if(page==='token')app.innerHTML=tokenPage();else if(page==='list')app.innerHTML=listPage();else if(page==='records')app.innerHTML=recordsPage();bind()}
window.addEventListener('afterprint',()=>{const s=$('#printSheet');if(s)s.remove()});
render();
cloudLoad();
</script>
</body>
</html>
