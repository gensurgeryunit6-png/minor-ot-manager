<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minor OT Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
:root{--navy:#303247;--yellow:#ffc400;--bg:#f4f7fb;--ink:#25293b;--muted:#74798a;--line:#e3e7ee;--green:#20c66a;--red:#ee454d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,Arial,sans-serif}button,input,select,textarea{font:inherit}
.app{max-width:760px;margin:auto;padding:10px 10px 88px}.header,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-top:10px;box-shadow:0 6px 22px #26324a0b}.header{margin-top:0}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:24px;font-weight:800}.sub{font-size:11px;color:var(--muted)}.online{background:#d9f8e8;color:#087445;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:700}.clear{border:0;background:var(--red);color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;font-size:11px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}.tab{border:0;background:#f0f2f5;color:var(--ink);padding:11px 4px;border-radius:11px;font-size:12px;font-weight:700}.tab.active{background:var(--navy);color:#fff}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.stat{padding:8px 3px;text-align:center;border-radius:11px;border:1px solid var(--line);background:#fff}.stat b{display:block;font-size:17px}.stat span{font-size:9px;font-weight:700;color:var(--muted)}
.sectiontitle{font-size:20px;font-weight:800;margin:0 0 12px}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d5dae3;border-radius:10px;padding:12px;background:#fff;color:var(--ink);outline:none;font-size:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:11px;padding:12px 14px;font-size:13px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:#fff}.yellow{background:var(--yellow);color:#302900}.green{background:var(--green);color:#fff}.soft{background:#f0f2f5;color:#414657}.red{background:var(--red);color:#fff}
.upload{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:1px dashed #8da9df;background:#f7faff;color:#2459a9;padding:13px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer}.upload input{display:none}.attached{font-size:11px;color:#087445;margin-top:5px;font-weight:600}.photo-note{font-size:10px;color:var(--muted);margin-top:5px}.checklist{display:grid;gap:8px}.checkrow{border:1px solid var(--line);border-radius:12px;padding:10px 11px}.checkmain{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600}.checkmain input,.na input,.mutual input{width:19px;height:19px}.checkmain input{accent-color:var(--green)}.na,.mutual{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:#687080}.na input,.mutual input{accent-color:var(--yellow)}.checkrow.naactive{background:#fff9df;border-color:#f0d35a}.checkrow.doneactive{background:#effcf5;border-color:#9de5bd}
.ticket{background:var(--navy);color:#fff;border-radius:22px;padding:22px 18px;text-align:center}.ticketlabel{font-size:11px;opacity:.85;font-weight:600;letter-spacing:1px}.tokenno{font-size:50px;font-weight:800;line-height:1.05;margin:6px 0}.ticketname{font-size:16px;font-weight:600}.ticketmeta{font-size:11px;opacity:.85;margin-top:4px;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.patient{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px}.prow{display:flex;align-items:center;gap:8px}.token{font-weight:800;font-size:15px}.push{margin-left:auto}.patientinfo{font-size:12px;color:#555d6d;margin-top:6px;line-height:1.7}.statusbtn{width:100%;margin-top:10px}.summarybtn{width:100%;margin-top:10px;background:var(--yellow);color:#302900}.complete{width:100%;margin-top:10px}.completed{background:#eafaf1;color:#087445}.pending{background:#f0f2f5;color:#414657}.mutualbox{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:9px}.mutual-title{font-size:13px;font-weight:700}.empty{padding:24px 8px;text-align:center;color:var(--muted)}.toast{position:fixed;left:12px;right:12px;bottom:72px;z-index:100;background:var(--navy);color:#fff;padding:12px;border-radius:12px;text-align:center;font-weight:600;font-size:13px}.modal{position:fixed;inset:0;background:#111426aa;z-index:30;padding:10px;overflow:auto}.modalbox{max-width:650px;margin:12px auto;background:#fff;border-radius:18px;padding:16px}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.modalhead h2{font-size:20px;margin:0}.rx{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);padding:10px;border-radius:10px;margin:6px 0;font-size:13px}.rx input{width:19px;height:19px;accent-color:var(--green)}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:grid;grid-template-columns:repeat(4,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}.bottom button{border:0;background:none;color:#fff;padding:10px 2px;font-size:10px}.bottom button.active{color:var(--yellow)}#printSheet,#summaryPrint{display:none}
@media print{body>*:not(#printSheet):not(#summaryPrint){display:none!important}#printSheet,#summaryPrint{display:block!important}@page{size:A4;margin:0}}
@media(max-width:430px){.tokenno{font-size:47px}.stat b{font-size:16px}}
</style>
</head>
<body><main class="app" id="app"></main><nav class="bottom"><button data-page="reg">Registration</button><button data-page="pre">Pre‑Op</button><button data-page="list">OT List</button><button data-page="records">Records</button></nav>
<script>
'use strict';
const app=document.getElementById('app'),$=s=>document.querySelector(s),FB={apiKey:'AIzaSyBhLTBL9j5ynCqLE_-0Bkj-qVY3v3SEz0g',authDomain:'minor-ot-manager.firebaseapp.com',projectId:'minor-ot-manager',storageBucket:'minor-ot-manager.firebasestorage.app',messagingSenderId:'240851011199',appId:'1:240851011199:web:3c3cf35c56751849eb214a'};
try{if(window.firebase&&!firebase.apps.length)firebase.initializeApp(FB)}catch(e){}let db=null;try{db=firebase.firestore()}catch(e){}
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());let date=today(),page='reg',patients=[],prePhoto='',current=null;
let form={name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',septic:false};
const checklist=[{name:'Allergies',key:'allergies',na:false},{name:'TT — 0.5 ml IM stat',key:'tt',na:true},{name:'Test dose — Injection Xylo test dose',key:'testdose',na:true},{name:'Attender',key:'attender',na:true},{name:'Ornaments',key:'ornaments',na:true},{name:'Consent',key:'consent',na:false}];
const meds=['Tab Amoxyclav 625 mg BD for 5 days','Tab CefU 200 mg BD for 5 days','Tab Paracetamol 500 mg BD for 5 days','Tab Pantop 40 mg OD for 5 days','Tab Chymoral Forte 1 tab TDS for 5 days'];
const instructions=['C&D daily','Watch for soakage','Review if there is warning has explained'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=()=>`mot_${date}`,col=()=>db?db.collection('minorOT').doc(date).collection('patients'):null;
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function saveLocal(){try{localStorage.setItem(key(),JSON.stringify(patients))}catch(e){toast('Local storage is full; photo could not be saved')}}
async function load(){try{patients=JSON.parse(localStorage.getItem(key())||'[]')}catch(e){patients=[]}if(col())try{const s=await col().get();if(!s.empty){patients=s.docs.map(d=>({id:d.id,...d.data()}));saveLocal()}}catch(e){}}
function saveCloud(p){try{if(col())col().doc(p.token).set(p,{merge:true}).catch(()=>{})}catch(e){}}function updateCloud(p,f){try{if(col())col().doc(p.token).set(f,{merge:true}).catch(()=>{})}catch(e){}}
function compress(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1000,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.62))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
function photoBlock(id,label){return `<label class="upload">📷 ${label}<input id="${id}" type="file" accept="image/*" capture="environment"></label><div id="${id}_status" class="photo-note"></div>`}function bindPhoto(id,cb){const el=document.getElementById(id);if(!el)return;el.onchange=async()=>{const f=el.files?.[0];if(!f)return;const st=document.getElementById(id+'_status');st.textContent='Compressing photo…';try{const d=await compress(f);cb(d);st.textContent='✓ Photo attached';toast('Photo attached successfully')}catch(e){st.textContent='Photo failed';toast('Photo upload failed')}}}
function header(){const c={total:patients.length,reg:patients.filter(p=>p.status==='registered').length,ready:patients.filter(p=>p.status==='ready').length,progress:patients.filter(p=>p.status==='progress').length,done:patients.filter(p=>p.status==='completed').length};return `<header class="header"><div class="headrow"><div><div class="brand">Minor OT</div><div class="sub">${esc(date)}</div></div><div class="online">● Online</div></div><div class="headrow" style="margin-top:10px"><div></div><button class="clear" id="clear">🗑 Clear All Data</button></div><div class="tabs"><button class="tab ${page==='reg'?'active':''}" data-page="reg">Registration</button><button class="tab ${page==='pre'?'active':''}" data-page="pre">Pre‑Op</button><button class="tab ${page==='list'||page==='token'?'active':''}" data-page="list">List</button></div><div class="stats"><div class="stat"><b>${c.total}</b><span>Total</span></div><div class="stat"><b>${c.reg}</b><span>Reg</span></div><div class="stat"><b>${c.ready}</b><span>Ready</span></div><div class="stat"><b>${c.progress}</b><span>Progress</span></div><div class="stat"><b>${c.done}</b><span>Done</span></div></div></header>`}
function reg(){return `${header()}<section class="card"><h2 class="sectiontitle">New Patient</h2><div class="field"><label>Patient Name *</label><input id="name" value="${esc(form.name)}" placeholder="Enter patient name"></div><div class="grid2"><div class="field"><label>Age</label><input id="age" type="number" min="0" value="${esc(form.age)}" placeholder="Age"></div><div class="field"><label>Sex</label><select id="sex"><option value="M" ${form.sex==='M'?'selected':''}>Male</option><option value="F" ${form.sex==='F'?'selected':''}>Female</option></select></div></div><div class="grid2"><div class="field"><label>OPD *</label><select id="opd"><option value="">Select OPD</option>${['7A','7B','7C','7D'].map(x=>`<option ${form.opd===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Diagnosis *</label><input id="diagnosis" value="${esc(form.diagnosis)}" placeholder="Diagnosis"></div></div><div class="grid2"><div class="field"><label>Site *</label><input id="site" value="${esc(form.site)}" placeholder="Site"></div><div class="field"><label>Procedure *</label><input id="procedure" value="${esc(form.procedure)}" placeholder="Procedure"></div></div><div class="field"><label>Case Type</label><select id="septic"><option value="0">Non‑Septic</option><option value="1" ${form.septic?'selected':''}>Septic</option></select></div>${photoBlock('prePhotoInput','Upload Pre‑Op Photo')}<div class="attached">${prePhoto?'✓ Pre‑Op photo attached':''}</div><button class="btn primary" id="toSafety" style="width:100%;margin-top:12px">Continue to Safety Checklist</button></section>`}
function readForm(){form.name=$('#name').value.trim();form.age=$('#age').value;form.sex=$('#sex').value;form.opd=$('#opd').value;form.diagnosis=$('#diagnosis').value.trim();form.site=$('#site').value.trim();form.procedure=$('#procedure').value.trim();form.septic=$('#septic').value==='1';if(!form.name||!form.opd||!form.diagnosis||!form.site||!form.procedure){toast('Please complete required patient details');return false}return true}
function safety(){return `${header()}<section class="card"><h2 class="sectiontitle">Safety Checklist</h2><div class="hint">Choose Done or N/A. They are mutually exclusive.</div><div class="checklist">${checklist.map((x,i)=>`<div class="checkrow" id="cr${i}"><label class="checkmain"><input class="donebox" id="done${i}" type="checkbox"> ${x.name}</label>${x.na?`<label class="na"><input class="nabox" id="na${i}" type="checkbox"> Not applicable (N/A)</label>`:''}</div>`).join('')}</div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn soft" id="backReg">Back</button><button class="btn yellow" id="generate" style="margin-left:auto">Generate Token</button></div></section>`}
function bindSafety(){document.querySelectorAll('.nabox').forEach(n=>n.onchange=()=>{const i=n.id.slice(2),d=$('#done'+i),r=$('#cr'+i);if(n.checked){d.checked=false;d.disabled=true;r.classList.add('naactive')}else{d.disabled=false;r.classList.remove('naactive')}});document.querySelectorAll('.donebox').forEach(d=>d.onchange=()=>{const i=d.id.slice(4),n=$('#na'+i),r=$('#cr'+i);if(d.checked&&n){n.checked=false;n.disabled=true;r.classList.add('doneactive')}else if(n){n.disabled=false;r.classList.remove('doneactive')}});$('#backReg').onclick=()=>{page='reg';render()};$('#generate').onclick=generateToken}
function generateToken(){const preChecklist=checklist.map((x,i)=>({name:x.name,done:$('#done'+i)?.checked||false,na:$('#na'+i)?.checked||false}));let max=0;patients.forEach(p=>{const n=parseInt(String(p.token||'').replace(/\D/g,''));if(n>max)max=n});const token='OT-'+String(max+1).padStart(3,'0');const p={...form,token,date,status:'registered',preChecklist,preOpPhoto:prePhoto,postOpPhoto:'',otNotes:{},prescription:[],instructions:[],hpeSent:false,hpeNA:false,pusCultureSent:false,pusCultureNA:false,createdAt:new Date().toISOString()};patients.push(p);saveLocal();saveCloud(p);current=p;page='token';render();toast('Token generated: '+token)}
function token(){const p=current;return `${header()}<section class="card"><div class="ticket"><div class="ticketlabel">MINOR OT TOKEN</div><div class="tokenno">${esc(p.token)}</div><div class="ticketname">${esc(p.name)}</div><div class="ticketmeta">${esc(p.age||'-')}/${esc(p.sex||'-')} · ${esc(p.diagnosis||'-')} · ${esc(p.site||'-')}</div></div><div class="actions"><button class="btn yellow" id="announce">🔊 Announce</button><button class="btn primary" id="printToken">🖨 Seznik Thermal Token</button></div><button class="btn soft" id="newPatient" style="width:100%;margin-top:8px">+ New Patient</button></section>`}
function announce(token){if(!('speechSynthesis' in window)){toast('Tamil voice is not supported');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`தயவு செய்து டோக்கன் எண் ${token.replace(/^OT-/i,'')} ஐ அணுகவும்`);u.lang='ta-IN';speechSynthesis.speak(u)}
function statusNext(s){return {registered:'ready',ready:'progress',progress:'completed',completed:'completed'}[s]||'registered'}
function list(){return `${header()}<section class="card"><h2 class="sectiontitle">OT List / Post‑Op</h2><div class="sub">${esc(date)}</div>${patients.length?patients.map(p=>`<article class="patient"><div class="prow"><span class="token">${esc(p.token)}</span><b>${esc(p.name)}</b><span class="push sub">${esc(p.opd)}</span></div><div class="patientinfo">${esc(p.age||'-')}/${esc(p.sex||'-')} · ${esc(p.diagnosis||'-')} · ${esc(p.site||'-')}<br>${esc(p.procedure||'-')}</div><div class="actions"><button class="btn yellow ann" data-token="${esc(p.token)}">🔊 Announce</button>${p.status==='completed'?`<button class="btn primary notes" data-token="${esc(p.token)}">Operative Notes</button>`:`<button class="btn soft" disabled>Complete status to open notes</button>`}</div><button class="btn ${p.status==='completed'?'completed':'pending'} statusbtn status" data-token="${esc(p.token)}">Status: ${esc(p.status)}${p.status!=='completed'?' → Tap to advance':''}</button>${p.status==='completed'?`<button class="btn green print" data-token="${esc(p.token)}" style="width:100%;margin-top:8px">Print PDF</button>`:''}</article>`).join(''):'<div class="empty">No patients for this date.</div>'}</section>`}
function records(){return `${header()}<section class="card"><div class="headrow"><div><h2 class="sectiontitle" style="margin:0">Records</h2><div class="sub">Date-wise patient records</div></div><input id="datePick" type="date" value="${date}" style="width:145px;border:1px solid var(--line);border-radius:9px;padding:8px;font-size:12px"></div><button class="btn summarybtn" id="summaryBtn">📊 Print Summary Report</button>${patients.length?patients.map(p=>`<article class="patient"><div class="prow"><span class="token">${esc(p.token)}</span><b>${esc(p.name)}</b><span class="push sub">${esc(p.status)}</span></div><div class="patientinfo">${esc(p.age||'-')}/${esc(p.sex||'-')} · ${esc(p.diagnosis||'-')} · ${esc(p.site||'-')}</div><button class="btn ${p.status==='completed'?'completed':'yellow'} complete" data-complete="${esc(p.token)}">${p.status==='completed'?'☑ Completed — Mark Pending':'☐ Mark as Completed'}</button><div class="actions"><button class="btn primary print" data-token="${esc(p.token)}">Print PDF</button><button class="btn yellow share" data-token="${esc(p.token)}">Share / Print</button></div></article>`).join(''):'<div class="empty">No records for this date.</div>'}</section>`}
function mutual(title,a,b,checkedA,checkedB){return `<div class="mutualbox"><div class="mutual-title">${title}</div><label class="mutual"><input id="${a}" type="checkbox" ${checkedA?'checked':''}> Sent</label><label class="mutual"><input id="${b}" type="checkbox" ${checkedB?'checked':''}> N/A</label></div>`}
function openNotes(t){const p=patients.find(x=>x.token===t);if(!p)return;let postPhoto=p.postOpPhoto||'';const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Operative Notes</h2><button class="btn soft close">Close</button></div><div class="field"><label>Diagnosis</label><input id="od" value="${esc(p.otNotes?.diagnosis||p.diagnosis)}"></div><div class="field"><label>Procedure</label><input id="op" value="${esc(p.otNotes?.procedure||p.procedure)}"></div><div class="field"><label>Site</label><input id="os" value="${esc(p.otNotes?.site||p.site)}"></div><div class="field"><label>Findings</label><textarea id="of" rows="3">${esc(p.otNotes?.findings||'')}</textarea></div><div class="field"><label>Operative details</label><textarea id="ox" rows="3">${esc(p.otNotes?.details||'')}</textarea></div>${mutual('HPE sent','hpeSent','hpeNA',p.hpeSent,p.hpeNA)}${mutual('Pus culture sent','pusCultureSent','pusCultureNA',p.pusCultureSent,p.pusCultureNA)}<h3 style="font-size:15px">Prescription</h3>${meds.map((x,i)=>`<label class="rx"><input id="rx${i}" type="checkbox" ${p.prescription?.includes(x)?'checked':''}>${x}</label>`).join('')}<h3 style="font-size:15px">Discharge Instructions</h3>${instructions.map((x,i)=>`<label class="rx"><input id="in${i}" type="checkbox" ${p.instructions?.includes(x)?'checked':''}>${x}</label>`).join('')}<div style="margin-top:10px">${photoBlock('postPhotoInput','Upload Post‑Op Photo')}<div class="attached">${postPhoto?'✓ Existing Post‑Op photo stored':''}</div></div><button class="btn yellow" id="saveNotes" style="width:100%;margin-top:12px">Save Operative Notes</button></div>`;document.body.appendChild(m);bindPhoto('postPhotoInput',d=>{postPhoto=d});function pair(a,b){const x=m.querySelector('#'+a),y=m.querySelector('#'+b);x.onchange=()=>{if(x.checked)y.checked=false};y.onchange=()=>{if(y.checked)x.checked=false}}pair('hpeSent','hpeNA');pair('pusCultureSent','pusCultureNA');m.querySelector('.close').onclick=()=>m.remove();m.querySelector('#saveNotes').onclick=()=>{p.otNotes={diagnosis:m.querySelector('#od').value,procedure:m.querySelector('#op').value,site:m.querySelector('#os').value,findings:m.querySelector('#of').value,details:m.querySelector('#ox').value};p.prescription=meds.filter((x,i)=>m.querySelector('#rx'+i).checked);p.instructions=instructions.filter((x,i)=>m.querySelector('#in'+i).checked);p.postOpPhoto=postPhoto;p.hpeSent=m.querySelector('#hpeSent').checked;p.hpeNA=m.querySelector('#hpeNA').checked;p.pusCultureSent=m.querySelector('#pusCultureSent').checked;p.pusCultureNA=m.querySelector('#pusCultureNA').checked;saveLocal();updateCloud(p,{otNotes:p.otNotes,prescription:p.prescription,instructions:p.instructions,postOpPhoto:p.postOpPhoto,hpeSent:p.hpeSent,hpeNA:p.hpeNA,pusCultureSent:p.pusCultureSent,pusCultureNA:p.pusCultureNA});m.remove();toast('Operative notes and post‑op photo saved');render()}}
function printSheet(p){let old=$('#printSheet');if(old)old.remove();const o=p.otNotes||{},medsHtml=(p.prescription||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>-</li>',advHtml=(p.instructions||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>-</li>';const q=document.createElement('section');q.id='printSheet';q.innerHTML=`<div style="font-family:Arial,sans-serif;padding:14mm;color:#111;max-width:210mm"><h2 style="text-align:center;margin:0 0 6mm">MINOR OT – PATIENT SUMMARY</h2><div><b>Name:</b> ${esc(p.name||'-')} &nbsp; <b>Age/Sex:</b> ${esc(p.age||'-')}/${esc(p.sex||'-')} &nbsp; <b>Date:</b> ${esc(p.date||date)} &nbsp; <b>Token:</b> ${esc(p.token||'-')}</div><div style="margin-top:5mm"><b>OT NOTES</b><hr><div><b>Diagnosis:</b> ${esc(o.diagnosis||p.diagnosis||'-')}</div><div><b>Procedure:</b> ${esc(o.procedure||p.procedure||'-')}</div><div><b>Site:</b> ${esc(o.site||p.site||'-')}</div><div><b>Findings:</b> ${esc(o.findings||'-')}</div><div><b>Details:</b> ${esc(o.details||'-')}</div></div><div style="margin-top:5mm"><b>MEDICATIONS</b><hr><ul>${medsHtml}</ul></div><div style="margin-top:5mm"><b>ADVICE</b><hr><ul>${advHtml}</ul></div><div style="display:flex;gap:8mm;margin-top:8mm;flex-wrap:wrap">${p.preOpPhoto?`<div><img src="${p.preOpPhoto}" style="width:78mm;max-height:62mm;object-fit:contain"><div>Pre‑Op Photo</div></div>`:''}${p.postOpPhoto?`<div><img src="${p.postOpPhoto}" style="width:78mm;max-height:62mm;object-fit:contain"><div>Post‑Op Photo</div></div>`:''}</div><div style="margin-top:12mm;font-size:10pt">IGMC&RI - Department of Surgery</div></div>`;document.body.appendChild(q);setTimeout(()=>window.print(),30);setTimeout(()=>q.remove(),1200)}
async function getPatient(t){const p=patients.find(x=>x.token===t);if(p)return p;try{const s=await col().doc(t).get();if(s.exists)return{id:s.id,...s.data()}}catch(e){}return null}async function systemPrint(t){const p=await getPatient(t);if(p)printSheet(p);else toast('Patient record not found')}async function sharePDF(t){await systemPrint(t)}
function allLocalPatients(){const out=[];Object.keys(localStorage).filter(k=>/^mot_\d{4}-\d{2}-\d{2}$/.test(k)).forEach(k=>{try{const a=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(a))a.forEach(p=>{if(p&&p.token)out.push({...p,date:p.date||k.slice(4)})})}catch(e){}});return out}
async function allCompleted(){const map=new Map();allLocalPatients().forEach(p=>map.set(`${p.date}|${p.token}`,p));if(db)try{const s=await db.collectionGroup('patients').get();s.docs.forEach(d=>{const p={id:d.id,...d.data()};if(p.token)map.set(`${p.date||''}|${p.token}`,p)})}catch(e){}return [...map.values()].filter(p=>p.status==='completed'||p.completed===true).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.createdAt||'').localeCompare(String(b.createdAt||''))||String(a.token||'').localeCompare(String(b.token||''),undefined,{numeric:true}))}
function sumImg(src,label){return src?`<div style="width:42mm"><img src="${src}" style="width:42mm;height:30mm;object-fit:cover;border:1px solid #aaa"><div style="font-size:8pt">${label}</div></div>`:''}
async function printSummary(){const list=await allCompleted();if(!list.length){toast('No completed patients found');return}let old=$('#summaryPrint');if(old)old.remove();const body=list.map((p,i)=>{const o=p.otNotes||{};return `<article style="border:1px solid #aaa;border-radius:4px;padding:4mm;margin-bottom:5mm;break-inside:avoid"><div style="font-size:12pt;font-weight:700">${i+1}. ${esc(p.token||'-')} — ${esc(p.name||'-')}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 8mm;font-size:9.5pt;margin:2mm 0"><div><b>Name:</b> ${esc(p.name||'-')}</div><div><b>Token:</b> ${esc(p.token||'-')}</div><div><b>Age/Gender:</b> ${esc(p.age||'-')}/${esc(p.sex||'-')}</div><div><b>Date:</b> ${esc(p.date||'-')}</div></div><div style="font-size:9.5pt"><b>OT Notes</b><div>${esc([o.diagnosis?`Diagnosis: ${o.diagnosis}`:'',o.procedure?`Procedure: ${o.procedure}`:'',o.site?`Site: ${o.site}`:'',o.findings?`Findings: ${o.findings}`:'',o.details?`Details: ${o.details}`:''].filter(Boolean).join('\n')||'-')}</div><br><b>Medications</b><div>${esc((p.prescription||[]).join('\n')||'-')}</div><br><b>Advice</b><div>${esc((p.instructions||[]).join('\n')||'-')}</div><div style="display:flex;gap:8mm;margin-top:3mm">${sumImg(p.preOpPhoto,'Pre‑Op Photo')}${sumImg(p.postOpPhoto,'Post‑Op Photo')}</div><div style="margin-top:3mm"><b>Status:</b> Completed ☑</div></div></article>`}).join('');const q=document.createElement('section');q.id='summaryPrint';q.innerHTML=`<div style="font-family:Arial,sans-serif;padding:12mm;color:#111;max-width:210mm"><h1 style="text-align:center;font-size:17pt;margin:0 0 2mm">IGMC&RI - Department of Surgery - Procedure Summary</h1><div style="text-align:center;font-size:9pt;margin-bottom:6mm">Completed patients · ${list.length} records · Chronological order</div>${body}</div><div style="position:fixed;bottom:0;left:0;right:0;text-align:center;border-top:1px solid #aaa;padding-top:2mm;font-size:8.5pt;background:#fff">IGMC&RI - Department of Surgery</div>`;document.body.appendChild(q);setTimeout(()=>window.print(),30);setTimeout(()=>q.remove(),1500)}
function bindCommon(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=async()=>{page=b.dataset.page;await load();render()});const c=$('#clear');if(c)c.onclick=async()=>{if(!confirm('Clear all data for today?'))return;patients=[];localStorage.removeItem(key());try{if(col()){const s=await col().get(),batch=db.batch();s.docs.forEach(x=>batch.delete(x.ref));await batch.commit()}}catch(e){}render()}}
function bindPage(){bindCommon();if(page==='reg'){bindPhoto('prePhotoInput',d=>{prePhoto=d});$('#toSafety').onclick=()=>{if(readForm()){page='pre';render()}}}if(page==='pre')bindSafety();if(page==='token'){$('#announce').onclick=()=>announce(current.token);$('#printToken').onclick=()=>thermalPrint(current);$('#newPatient').onclick=()=>{form={name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',septic:false};prePhoto='';current=null;page='reg';render()}}if(page==='list'){document.querySelectorAll('.ann').forEach(b=>b.onclick=()=>announce(b.dataset.token));document.querySelectorAll('.notes').forEach(b=>b.onclick=()=>openNotes(b.dataset.token));document.querySelectorAll('.print').forEach(b=>b.onclick=()=>systemPrint(b.dataset.token));document.querySelectorAll('.status').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.token);if(!p)return;const n=statusNext(p.status);p.status=n;saveLocal();updateCloud(p,{status:n});render()})}if(page==='records'){const dp=$('#datePick');dp.onchange=async()=>{date=dp.value;await load();render()};$('#summaryBtn').onclick=printSummary;document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{const p=patients.find(x=>x.token===b.dataset.complete);if(!p)return;const done=p.status==='completed';p.status=done?'registered':'completed';p.completed=!done;saveLocal();updateCloud(p,{status:p.status,completed:p.completed});render()});document.querySelectorAll('.print').forEach(b=>b.onclick=()=>systemPrint(b.dataset.token));document.querySelectorAll('.share').forEach(b=>b.onclick=()=>sharePDF(b.dataset.token))}}
let b21Device=null,b21Char=null,b21Busy=false;const B21_SERVICE='0000ae30-0000-1000-8000-00805f9b34fb',B21_TX='0000ae01-0000-1000-8000-00805f9b34fb';function crc8(data){let c=0;for(const v of data){c^=v;for(let i=0;i<8;i++)c=(c&0x80)?((c<<1)^7)&255:(c<<1)&255}return c}function pkt(cmd,data=[]){return new Uint8Array([0x51,0x78,cmd,0,data.length&255,(data.length>>8)&255,...data,crc8(data),0xff])}function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function getRows(lines){const W=384,lh=34,pad=12,c=document.createElement('canvas');c.width=W;c.height=pad+lines.length*lh+pad;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,c.height);x.fillStyle='#000';x.textAlign='center';x.textBaseline='middle';lines.forEach((s,i)=>{x.font=i===0?'bold 30px Arial':'bold 17px Arial';x.fillText(String(s),W/2,pad+i*lh+17)});const px=x.getImageData(0,0,W,c.height).data,rows=[];for(let y=0;y<c.height;y++){const row=new Uint8Array(48);for(let q=0;q<W;q++)if(px[(y*W+q)*4]<160)row[q>>3]|=1<<(q&7);rows.push(row)}return rows}
async function writeChunks(bytes){for(let i=0;i<bytes.length;i+=120){const c=bytes.slice(i,i+120);if(b21Char.properties.writeWithoutResponse&&b21Char.writeValueWithoutResponse)await b21Char.writeValueWithoutResponse(c);else await b21Char.writeValue(c);await sleep(25)}}
async function connectB21(){if(b21Char&&b21Device?.gatt?.connected)return;if(!navigator.bluetooth)throw new Error('Web Bluetooth is not supported. Use Chrome on Android.');b21Device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[B21_SERVICE,'0000ff00-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb']});const server=await b21Device.gatt.connect();let services=[];try{services=await server.getPrimaryServices()}catch(e){}for(const s of services){const chars=await s.getCharacteristics().catch(()=>[]);const c=chars.find(x=>x.uuid.toLowerCase()===B21_TX&&(x.properties.writeWithoutResponse||x.properties.write));if(c){b21Char=c;break}}if(!b21Char)for(const s of services){const chars=await s.getCharacteristics().catch(()=>[]);const c=chars.find(x=>x.properties.writeWithoutResponse||x.properties.write);if(c){b21Char=c;break}}if(!b21Char)throw new Error('No writable Bluetooth printer channel found')}
async function thermalPrint(p){if(b21Busy)return;b21Busy=true;try{await connectB21();await writeChunks(pkt(0xA3,[0]));await writeChunks(pkt(0xA4,[0x32]));await writeChunks(pkt(0xAF,[0xff,0xff]));await writeChunks(pkt(0xBE,[1]));for(const row of getRows([String(p.token),`${p.name||'-'}`,`${p.age||'-'}/${p.sex||'-'} · ${p.diagnosis||'-'}`,`Site: ${p.site||'-'}`,'IGMC&RI - Department of General Surgery']))await writeChunks(pkt(0xA2,[...row]));await writeChunks(pkt(0xBD,[25]));await writeChunks(pkt(0xA1,[0x30,0]));await writeChunks(pkt(0xA1,[0x30,0]));await writeChunks(new Uint8Array([0x51,0x78,0xA6,0,0x0B,0,0xAA,0x55,0x17,0,0,0,0,0,0,0,0x17,0x11,0xff]));toast('SEZNIK B21: token sent')}catch(e){toast('SEZNIK B21 failed: '+e.message)}finally{b21Busy=false}}
async function render(){await load();app.innerHTML=page==='reg'?reg():page==='pre'?safety():page==='token'?token():page==='list'?list():records();bindPage()}render();
</script></body></html>
