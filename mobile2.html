<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#303247">
<title>Minor OT Manager</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --navy:#303247;--yellow:#ffc400;--green:#20c66a;--red:#ee454d;
  --bg:#f4f7fb;--ink:#25293b;--muted:#74798a;--line:#e1e5ec;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:78px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:760px;margin:auto;padding:10px}
.header,.card{
  background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:16px;margin-top:10px;box-shadow:0 5px 20px rgba(35,45,70,.06)
}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:25px;font-weight:800}
.sub{font-size:12px;color:var(--muted)}
.online{background:#dff8eb;color:#087445;border-radius:999px;padding:7px 10px;
  font-size:11px;font-weight:700}
.clear{border:0;background:var(--red);color:#fff;border-radius:10px;
  padding:10px 12px;font-weight:700;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:13px}
.stat{border:1px solid var(--line);border-radius:13px;padding:10px 3px;text-align:center}
.stat b{display:block;font-size:19px}.stat span{font-size:10px;font-weight:700;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:13px}
.tab{border:0;background:#f0f2f5;color:var(--ink);border-radius:11px;padding:11px 4px;
  font-size:12px;font-weight:700}.tab.active{background:var(--navy);color:#fff}
.title{font-size:23px;font-weight:800;margin:0 0 15px}
.field{margin:12px 0}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:7px}
.field input,.field select,.field textarea{
  width:100%;border:1px solid #d3d8e1;border-radius:12px;background:#fff;
  padding:14px;font-size:16px;color:var(--ink);outline:none
}
.field textarea{min-height:92px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:14px 15px;font-weight:800;font-size:14px}
.primary{background:var(--navy);color:#fff}.yellow{background:var(--yellow);color:#2f2a00}
.green{background:var(--green);color:#fff}.soft{background:#eef0f4;color:#414657}
.full{width:100%}
.upload{
  display:flex;align-items:center;justify-content:center;text-align:center;
  border:1px dashed #7e9bd0;background:#f7faff;color:#2459a9;
  border-radius:12px;padding:15px;font-weight:800;font-size:14px
}
.upload input{display:none}
.photo-status{font-size:12px;color:#087445;margin-top:6px;font-weight:700}
.checklist{display:grid;gap:9px}
.checkrow{border:1px solid var(--line);border-radius:13px;padding:12px}
.checkmain{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700}
.checkmain input,.na input{width:20px;height:20px}
.na{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12px;color:var(--muted)}
.checkrow.done{background:#effcf5;border-color:#9de5bd}
.checkrow.na{background:#fff9df;border-color:#efd05a}
.hint{font-size:12px;color:var(--muted);margin-bottom:10px}
.ticket{background:var(--navy);color:#fff;border-radius:22px;padding:25px 16px;text-align:center}
.ticketlabel{font-size:12px;letter-spacing:1px;opacity:.85;font-weight:700}
.tokenno{font-size:56px;font-weight:900;line-height:1;margin:8px 0}
.ticketname{font-size:18px;font-weight:800}
.ticketmeta{font-size:13px;opacity:.9;margin-top:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.patient{border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px;background:#fff}
.prow{display:flex;align-items:center;gap:8px}.token{font-size:17px;font-weight:900}
.push{margin-left:auto}.info{font-size:13px;color:#555d6d;line-height:1.65;margin-top:7px}
.statusbtn{width:100%}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.62);z-index:50;padding:10px;overflow:auto}
.modalbox{max-width:680px;margin:12px auto;background:#fff;border-radius:20px;padding:17px}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modalhead h2{margin:0;font-size:22px}
.section{font-size:16px;font-weight:800;margin:18px 0 8px}
.rx{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line);
  border-radius:11px;padding:11px;margin:6px 0;font-size:13px;font-weight:600}
.rx input{width:20px;height:20px;flex:none}
.toast{position:fixed;left:12px;right:12px;bottom:88px;z-index:100;
  background:var(--navy);color:#fff;border-radius:12px;padding:13px;text-align:center;
  font-weight:700;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:25px 5px}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.datebar input{width:145px;border:1px solid var(--line);border-radius:10px;padding:9px}
.summarybox{background:#f7f8fb;border-radius:13px;padding:12px;margin-top:10px;font-size:13px}
.summarybox b{font-size:15px}
#printSheet{display:none}
.tokenPrintSheet{width:58mm;max-width:100%;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff}
.tokenPrintNumber{font-size:80px!important;font-weight:900!important;line-height:1!important;margin:0!important;padding:0!important;text-align:center;white-space:nowrap}
.tokenPrintLine{font-size:30px!important;font-weight:700!important;line-height:1.3!important;margin:0!important;padding:0!important;overflow-wrap:anywhere;word-break:break-word}
.tokenPrintFooter{font-size:10px!important;line-height:1!important;margin:0!important;padding:0!important;text-align:center}
@media print{@page{margin:0;size:auto}html,body{margin:0!important;padding:0!important}body>*:not(#printSheet){display:none!important}#printSheet{display:block!important;margin:0!important;padding:0!important}}
@media(max-width:430px){.app{padding:8px}.header,.card{padding:14px}.brand{font-size:23px}.title{font-size:22px}.tokenno{font-size:52px}.stat b{font-size:17px}.stat span{font-size:9px}.bottom button{font-size:11px}}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--navy);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
.bottom button{border:0;background:none;color:#fff;padding:13px 3px;font-size:11px}.bottom button.active{color:var(--yellow)}
@media print{body>*:not(#printSheet){display:none!important}#printSheet{display:block!important}@page{size:58mm auto;margin:0}}
</style>
</head>
<body>
<main id="app" class="app"></main>
<nav class="bottom">
  <button data-page="reg">Registration</button><button data-page="pre">Pre‑Op</button>
  <button data-page="list">OT List</button><button data-page="records">Records</button>
</nav>
<script>

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const STORAGE_KEY='minor_ot_manager_patients_v1';
const DATE_KEY='minor_ot_manager_date_v1';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());
let date=localStorage.getItem(DATE_KEY)||today();
let page='reg';let patients=[];let current=null;let prePhoto='';
let form={name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',septic:false};
const checklist=[{name:'Allergies',key:'allergies',na:false},{name:'TT — 0.5 ml IM stat',key:'tt',na:true},{name:'Test dose — Injection Xylo test dose',key:'testdose',na:true},{name:'Attender',key:'attender',na:true},{name:'Ornaments',key:'ornaments',na:true},{name:'Consent',key:'consent',na:false}];
const medications=['Tab Amoxyclav 625 mg BD for 5 days','Tab CefU 200 mg BD for 5 days','Tab Paracetamol 500 mg BD for 5 days','Tab Pantop 40 mg OD for 5 days','Tab Chymoral Forte 1 tab TDS for 5 days'];
const advice=['C&D daily','Watch for soakage','Review if there is warning has explained'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(text){const x=document.createElement('div');x.className='toast';x.textContent=text;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function loadLocal(){try{const raw=localStorage.getItem(STORAGE_KEY);patients=raw?JSON.parse(raw):[];if(!Array.isArray(patients))patients=[]}catch(e){patients=[];toast('Could not read saved patient data')}}
function saveLocal(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(patients));localStorage.setItem(DATE_KEY,date);return true}catch(e){toast('Storage is full. Reduce photo size or clear old data.');return false}}
async function cloudSavePatient(p){if(!db||!p||!p.token)return;try{await db.collection(CLOUD_ROOT).doc(p.date||date).collection('patients').doc(p.token).set(p,{merge:true})}catch(e){console.error('Firebase save failed:',e)}}
async function cloudLoadDate(){if(!db)return;const requestedDate=date;try{const snap=await db.collection(CLOUD_ROOT).doc(requestedDate).collection('patients').get();if(requestedDate!==date)return;const cloud=[];snap.forEach(doc=>cloud.push({id:doc.id,...doc.data()}));if(cloud.length){const otherDates=patients.filter(p=>(p.date||'')!==requestedDate);patients=[...otherDates,...cloud];saveLocal();if(page!=='token')render();toast('☁ Firebase data loaded')}else{const localForDate=patients.filter(p=>(p.date||'')===requestedDate);for(const p of localForDate)await cloudSavePatient(p)}}catch(e){console.error('Firebase load failed:',e)}}
async function cloudClearDate(targetDate){if(!db)return;try{const ref=db.collection(CLOUD_ROOT).doc(targetDate).collection('patients');const snap=await ref.get();const batch=db.batch();snap.forEach(doc=>batch.delete(doc.ref));await batch.commit()}catch(e){console.error('Firebase clear failed:',e)}}
function resetForm(){form={name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',septic:false};prePhoto='';current=null}
function photoBlock(id,label){return `<label class="upload">📷 ${label}<input id="${id}" type="file" accept="image/*" capture="environment"></label><div id="${id}_status" class="photo-status"></div>`}
function compressPhoto(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=900;const scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.55))};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function bindPhoto(id,callback){const el=document.getElementById(id);if(!el)return;el.onchange=async()=>{const file=el.files?.[0];if(!file)return;const status=document.getElementById(id+'_status');status.textContent='Preparing photo…';try{const data=await compressPhoto(file);callback(data);status.textContent='✓ Photo attached';toast('Photo attached')}catch(e){status.textContent='Photo failed';toast('Photo could not be processed')}}}
function counts(){return{total:patients.length,reg:patients.filter(p=>p.status==='registered').length,ready:patients.filter(p=>p.status==='ready').length,progress:patients.filter(p=>p.status==='progress').length,done:patients.filter(p=>p.status==='completed').length}}
function header(){const c=counts();return `<header class="header"><div class="head"><div><div class="brand">Minor OT Manager</div><div class="sub">${esc(date)}</div></div><div class="online">● Online</div></div><div style="display:flex;justify-content:flex-end;margin-top:11px"><button class="clear" id="clearAll">🗑 Clear All Data</button></div><div class="stats"><div class="stat"><b>${c.total}</b><span>Total</span></div><div class="stat"><b>${c.reg}</b><span>Reg</span></div><div class="stat"><b>${c.ready}</b><span>Ready</span></div><div class="stat"><b>${c.progress}</b><span>Progress</span></div><div class="stat"><b>${c.done}</b><span>Done</span></div></div><div class="tabs"><button class="tab ${page==='reg'?'active':''}" data-page="reg">Registration</button><button class="tab ${page==='pre'?'active':''}" data-page="pre">Pre‑Op</button><button class="tab ${page==='list'||page==='token'?'active':''}" data-page="list">OT List</button></div></header>`}
function regPage(){return `${header()}<section class="card"><h2 class="title">New Patient</h2><div class="field"><label>Patient Name *</label><input id="name" value="${esc(form.name)}" placeholder="Enter patient name" autocomplete="off"></div><div class="grid2"><div class="field"><label>Age</label><input id="age" type="number" min="0" value="${esc(form.age)}" placeholder="Age"></div><div class="field"><label>Sex</label><select id="sex"><option value="M" ${form.sex==='M'?'selected':''}>Male</option><option value="F" ${form.sex==='F'?'selected':''}>Female</option></select></div></div><div class="grid2"><div class="field"><label>OPD *</label><select id="opd"><option value="">Select OPD</option>${['7A','7B','7C','7D'].map(x=>`<option value="${x}" ${form.opd===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Diagnosis *</label><input id="diagnosis" value="${esc(form.diagnosis)}" placeholder="Diagnosis" autocomplete="off"></div></div><div class="grid2"><div class="field"><label>Site *</label><input id="site" value="${esc(form.site)}" placeholder="Site" autocomplete="off"></div><div class="field"><label>Procedure *</label><input id="procedure" value="${esc(form.procedure)}" placeholder="Procedure" autocomplete="off"></div></div><div class="field"><label>Case Type</label><select id="septic"><option value="0" ${!form.septic?'selected':''}>Non‑Septic</option><option value="1" ${form.septic?'selected':''}>Septic</option></select></div>${photoBlock('prePhotoInput','Upload Pre‑Op Photo')}<div class="photo-status">${prePhoto?'✓ Pre‑Op photo attached':''}</div><button class="btn primary full" id="continuePre" style="margin-top:13px">Continue to Safety Checklist</button></section>`}
function readForm(){form.name=$('#name').value.trim();form.age=$('#age').value;form.sex=$('#sex').value;form.opd=$('#opd').value;form.diagnosis=$('#diagnosis').value.trim();form.site=$('#site').value.trim();form.procedure=$('#procedure').value.trim();form.septic=$('#septic').value==='1';if(!form.name||!form.opd||!form.diagnosis||!form.site||!form.procedure){toast('Please complete all required patient details');return false}return true}
function safetyPage(){return `${header()}<section class="card"><h2 class="title">Safety Checklist</h2><div class="hint">Choose Done or N/A. They are mutually exclusive.</div><div class="checklist">${checklist.map((x,i)=>`<div class="checkrow" id="checkrow${i}"><label class="checkmain"><input class="donebox" id="done${i}" type="checkbox">${x.name}</label>${x.na?`<label class="na"><input class="nabox" id="na${i}" type="checkbox">Not applicable (N/A)</label>`:''}</div>`).join('')}</div><div style="display:flex;gap:9px;margin-top:15px"><button class="btn soft" id="backReg">Back</button><button class="btn yellow" id="generateToken" style="margin-left:auto">Generate Token</button></div></section>`}
function bindSafety(){$$('.nabox').forEach(n=>{n.onchange=()=>{const i=n.id.replace('na','');const d=$('#done'+i),row=$('#checkrow'+i);if(n.checked){d.checked=false;d.disabled=true;row.classList.add('na');row.classList.remove('done')}else{d.disabled=false;row.classList.remove('na')}}});$$('.donebox').forEach(d=>{d.onchange=()=>{const i=d.id.replace('done','');const n=$('#na'+i),row=$('#checkrow'+i);if(d.checked){if(n){n.checked=false;n.disabled=true}row.classList.add('done');row.classList.remove('na')}else{if(n)n.disabled=false;row.classList.remove('done')}}});$('#backReg').onclick=()=>{page='reg';render()};$('#generateToken').onclick=generateToken}
function nextTokenNumber(){let max=0;patients.forEach(p=>{const n=parseInt(String(p.token||'').replace(/\D/g,''),10);if(Number.isFinite(n)&&n>max)max=n});return max+1}
function generateToken(){const preChecklist=checklist.map((x,i)=>({name:x.name,done:!!$('#done'+i)?.checked,na:!!$('#na'+i)?.checked}));const n=nextTokenNumber();const token='OT-'+String(n).padStart(3,'0');const p={...form,token,date,status:'registered',preChecklist,preOpPhoto:prePhoto||'',postOpPhoto:'',otNotes:{diagnosis:form.diagnosis,procedure:form.procedure,site:form.site,findings:'',details:'',hpe:'NA',pusCulture:'NA'},medications:[],advice:[],createdAt:new Date().toISOString()};patients.push(p);saveLocal();cloudSavePatient(p);current=p;page='token';render();toast('Token generated: '+token)}
function tokenPage(){const p=current;if(!p){page='reg';return regPage()}return `${header()}<section class="card"><div class="ticket"><div class="ticketlabel">MINOR OT TOKEN</div><div class="tokenno">${esc(p.token)}</div><div class="ticketname">${esc(p.name)}</div><div class="ticketmeta">${esc(p.age||'')} / ${esc(p.sex==='F'?'Female':'Male')} · ${esc(p.diagnosis)} · ${esc(p.site)}</div></div><div class="actions"><button class="btn yellow" id="announceToken">🔊 Announce</button><button class="btn primary" id="thermalToken">🖨 Thermal Token</button></div><button class="btn soft full" id="systemToken" style="margin-top:9px">🖨 System Token Print</button><button class="btn soft full" id="newPatient" style="margin-top:9px">+ New Patient</button></section>`}
function announcePatient(p){if(!('speechSynthesis' in window)){toast('Tamil speech is not supported on this browser');return}const honorific=p.sex==='F'?'திருமதி':'திரு';const token=String(p.token||'').replace(/^OT-/i,'');const text=`டோக்கன் எண் ${token} ${honorific} ${p.name} மைனர் OT க்கு வரவும்`;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ta-IN';u.rate=.9;u.pitch=1;window.speechSynthesis.speak(u)}
let b21Device=null,b21Char=null,b21Busy=false;
const B21_SERVICE='0000ae30-0000-1000-8000-00805f9b34fb';const B21_TX='0000ae01-0000-1000-8000-00805f9b34fb';
function crc8(data){let c=0;for(const v of data){c^=v;for(let i=0;i<8;i++)c=(c&0x80)?((c<<1)^0x07)&255:(c<<1)&255}return c}
function packet(cmd,data=[]){return new Uint8Array([0x51,0x78,cmd,0x00,data.length&255,(data.length>>8)&255,...data,crc8(data),0xff])}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function renderThermalRows(lines){const W=384,rows=[];for(let i=0;i<lines.length;i++){const isToken=i===0,isFooter=i===lines.length-1,fontSize=isToken?80:(isFooter?9:18),font=`900 ${fontSize}px Arial`;const canvas=document.createElement('canvas');canvas.width=W;canvas.height=isToken?100:(isFooter?18:28);const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.clearRect(0,0,W,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,canvas.height);ctx.fillStyle='#000';ctx.font=font;ctx.textAlign='center';ctx.textBaseline='alphabetic';const metrics=ctx.measureText(String(lines[i]));const ascent=Math.ceil(metrics.actualBoundingBoxAscent||fontSize*.8),descent=Math.ceil(metrics.actualBoundingBoxDescent||fontSize*.2);const baseline=Math.max(ascent+2,Math.ceil((canvas.height+ascent-descent)/2));ctx.fillText(String(lines[i]),W/2,baseline);const pixels=ctx.getImageData(0,0,W,canvas.height).data;let first=-1,last=-1;for(let y=0;y<canvas.height;y++){let ink=false;for(let x=0;x<W;x++){if(pixels[(y*W+x)*4]<160){ink=true;break}}if(ink){if(first<0)first=y;last=y}}if(first<0)continue;for(let y=first;y<=last;y++){const row=new Uint8Array(48);for(let x=0;x<W;x++)if(pixels[(y*W+x)*4]<160)row[x>>3]|=1<<(x&7);rows.push(row)}}return rows}
async function writeChunks(bytes){for(let i=0;i<bytes.length;i+=120){const chunk=bytes.slice(i,i+120);if(b21Char.properties.writeWithoutResponse&&b21Char.writeValueWithoutResponse)await b21Char.writeValueWithoutResponse(chunk);else await b21Char.writeValue(chunk);await sleep(25)}}
async function startThermalPrintFromClick(token){if(b21Busy)return;b21Busy=true;try{if(!navigator.bluetooth)throw new Error('Web Bluetooth is not available. Use Chrome on Android.');const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[B21_SERVICE,'0000ff00-0000-1000-8000-00805f9b34fb','000018f0-0000-1000-8000-00805f9b34fb']});b21Device=device;const server=await device.gatt.connect();let services=[];try{services=await server.getPrimaryServices()}catch(e){}b21Char=null;for(const service of services){const chars=await service.getCharacteristics().catch(()=>[]);const exact=chars.find(c=>c.uuid.toLowerCase()===B21_TX&&(c.properties.write||c.properties.writeWithoutResponse));if(exact){b21Char=exact;break}}if(!b21Char)for(const service of services){const chars=await service.getCharacteristics().catch(()=>[]);const writable=chars.find(c=>c.properties.write||c.properties.writeWithoutResponse);if(writable){b21Char=writable;break}}if(!b21Char)throw new Error('No writable printer channel found.');await writeChunks(packet(0xA3,[0]));await writeChunks(packet(0xA4,[0x32]));await writeChunks(packet(0xAF,[0xFF,0xFF]));await writeChunks(packet(0xBE,[0x01]));const patient=patients.find(x=>x.token===token)||current||{};const diagnosis=patient.diagnosis||patient.otNotes?.diagnosis||'';const details=[String(token),`Name: ${patient.name||'-'}`,`Age: ${patient.age||'-'}`,`Sex: ${patient.sex==='F'?'Female':'Male'}`,`Diagnosis: ${diagnosis||'-'}`,'IGMC&RI - Department of Surgery'];for(const row of renderThermalRows(details))await writeChunks(packet(0xA2,[...row]));await writeChunks(packet(0xBD,[25]));await writeChunks(packet(0xA1,[0x30,0x00]));await writeChunks(packet(0xA1,[0x30,0x00]));await writeChunks(packet(0xA1,[0x30,0x00]));await sleep(100);toast('SEZNIK B21: token sent')}catch(e){toast('Thermal printing failed: '+(e?.message||'Unknown error'))}finally{b21Busy=false}}
function advanceStatus(p){const next={registered:'ready',ready:'progress',progress:'completed',completed:'completed'}[p.status]||'registered';p.status=next;saveLocal();cloudSavePatient(p);toast(next==='completed'?'Patient marked Done':'Status: '+statusLabel(next));render()}
function statusLabel(s){return({registered:'Registered',ready:'Ready',progress:'In Progress',completed:'Done'})[s]||'Registered'}
function listPage(){return `${header()}<section class="card"><h2 class="title">OT List</h2><div class="sub">${esc(date)}</div>${patients.length?patients.map(p=>{const done=p.status==='completed';return `<article class="patient"><div class="prow"><span class="token">${esc(p.token)}</span><b>${esc(p.name)}</b><span class="push sub">${esc(p.opd)}</span></div><div class="info">${esc(p.age||'')}/${esc(p.sex==='F'?'F':'M')} · ${esc(p.diagnosis)} · ${esc(p.site)}<br>${esc(p.procedure)}</div><div style="margin-top:10px"><button class="btn soft statusbtn advance" data-token="${esc(p.token)}">Status: ${esc(statusLabel(p.status))} — Advance</button></div><div class="actions"><button class="btn yellow announceList" data-token="${esc(p.token)}">🔊 Announce</button>${done?`<button class="btn primary notesBtn" data-token="${esc(p.token)}">Operative Notes</button>`:`<button class="btn soft" disabled>Operative Notes after Done</button>`}</div>${done?`<button class="btn green full printPatient" data-token="${esc(p.token)}" style="margin-top:9px">Print PDF</button>`:''}</article>`}).join(''):'<div class="empty">No patients for this date.</div>'}</section>`}
function openNotes(token){const p=patients.find(x=>x.token===token);if(!p||p.status!=='completed')return;const o=p.otNotes||{};const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><div class="modalhead"><h2>Operative Notes</h2><button class="btn soft closeNotes">Close</button></div><div class="field"><label>Diagnosis</label><input id="od" value="${esc(o.diagnosis||p.diagnosis)}"></div><div class="field"><label>Procedure</label><input id="op" value="${esc(o.procedure||p.procedure)}"></div><div class="field"><label>Site</label><input id="os" value="${esc(o.site||p.site)}"></div><div class="field"><label>Findings</label><textarea id="of" rows="3">${esc(o.findings||'')}</textarea></div><div class="field"><label>Operative Details</label><textarea id="ox" rows="3">${esc(o.details||'')}</textarea></div><div class="section">HPE</div><label class="rx"><input id="hpeSent" type="checkbox" ${o.hpe==='SENT'?'checked':''}>HPE sent</label><label class="rx"><input id="hpeNA" type="checkbox" ${o.hpe!=='SENT'?'checked':''}>HPE N/A</label><div class="section">Pus Culture</div><label class="rx"><input id="pusSent" type="checkbox" ${o.pusCulture==='SENT'?'checked':''}>Pus culture sent</label><label class="rx"><input id="pusNA" type="checkbox" ${o.pusCulture!=='SENT'?'checked':''}>Pus culture N/A</label><div class="section">Medications</div>${medications.map((x,i)=>`<label class="rx"><input class="medbox" id="med${i}" type="checkbox" ${Array.isArray(p.medications)&&p.medications.includes(x)?'checked':''}>${esc(x)}</label>`).join('')}<div class="section">Advice</div>${advice.map((x,i)=>`<label class="rx"><input class="advbox" id="adv${i}" type="checkbox" ${Array.isArray(p.advice)&&p.advice.includes(x)?'checked':''}>${esc(x)}</label>`).join('')}<div style="margin-top:12px">${photoBlock('postPhotoInput','Upload Post‑Op Photo')}<div class="photo-status">${p.postOpPhoto?'✓ Existing post‑op photo stored':''}</div></div><button class="btn yellow full" id="saveNotes" style="margin-top:13px">Save Operative Notes</button></div>`;document.body.appendChild(m);let postPhoto=p.postOpPhoto||'';bindPhoto('postPhotoInput',data=>{postPhoto=data});const hpeSent=$('#hpeSent'),hpeNA=$('#hpeNA');hpeSent.onchange=()=>{if(hpeSent.checked)hpeNA.checked=false;else if(!hpeNA.checked)hpeNA.checked=true};hpeNA.onchange=()=>{if(hpeNA.checked)hpeSent.checked=false;else if(!hpeSent.checked)hpeSent.checked=true};const pusSent=$('#pusSent'),pusNA=$('#pusNA');pusSent.onchange=()=>{if(pusSent.checked)pusNA.checked=false;else if(!pusNA.checked)pusNA.checked=true};pusNA.onchange=()=>{if(pusNA.checked)pusSent.checked=false;else if(!pusSent.checked)pusSent.checked=true};m.querySelector('.closeNotes').onclick=()=>m.remove();m.querySelector('#saveNotes').onclick=()=>{p.otNotes={diagnosis:$('#od').value.trim(),procedure:$('#op').value.trim(),site:$('#os').value.trim(),findings:$('#of').value.trim(),details:$('#ox').value.trim(),hpe:hpeSent.checked?'SENT':'NA',pusCulture:pusSent.checked?'SENT':'NA'};p.medications=medications.filter((x,i)=>$('#med'+i).checked);p.advice=advice.filter((x,i)=>$('#adv'+i).checked);p.postOpPhoto=postPhoto;saveLocal();cloudSavePatient(p);m.remove();toast('Operative notes saved');render()}}
function makePrintSheet(p){const old=$('#printSheet');if(old)old.remove();const o=p.otNotes||{},meds=p.medications||[],adv=p.advice||[];const sheet=document.createElement('section');sheet.id='printSheet';const listHtml=arr=>arr.length?`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<div>-</div>';sheet.innerHTML=`<div style="font-family:Arial,Helvetica,sans-serif;padding:14mm;color:#111;max-width:210mm"><h2 style="text-align:center;margin:0 0 7mm">MINOR OT — PATIENT RECORD</h2><div style="font-size:12pt;margin-bottom:7mm"><b>Name:</b> ${esc(p.name||'-')}<br><b>Age/Sex:</b> ${esc(p.age||'-')} / ${esc(p.sex==='F'?'Female':'Male')}<br><b>Date:</b> ${esc(p.date||'-')}<br><b>Token:</b> ${esc(p.token||'-')}</div><div style="margin-top:5mm"><h3 style="margin-bottom:3mm">OT NOTES</h3><hr><p><b>Diagnosis:</b> ${esc(o.diagnosis||p.diagnosis||'-')}</p><p><b>Procedure:</b> ${esc(o.procedure||p.procedure||'-')}</p><p><b>Site:</b> ${esc(o.site||p.site||'-')}</p><p><b>Findings:</b> ${esc(o.findings||'-')}</p><p><b>Operative Details:</b> ${esc(o.details||'-')}</p><p><b>HPE:</b> ${o.hpe==='SENT'?'Sent':'N/A'}</p><p><b>Pus Culture:</b> ${o.pusCulture==='SENT'?'Sent':'N/A'}</p></div><div style="margin-top:7mm"><h3 style="margin-bottom:3mm">MEDICATIONS</h3><hr>${listHtml(meds)}</div><div style="margin-top:7mm"><h3 style="margin-bottom:3mm">ADVICE</h3><hr>${listHtml(adv)}</div><div style="display:flex;gap:8mm;flex-wrap:wrap;margin-top:8mm">${p.preOpPhoto?`<div><img src="${p.preOpPhoto}" style="width:78mm;max-height:62mm;object-fit:contain"><div style="font-size:10pt;margin-top:2mm">Pre‑Op Photo</div></div>`:''}${p.postOpPhoto?`<div><img src="${p.postOpPhoto}" style="width:78mm;max-height:62mm;object-fit:contain"><div style="font-size:10pt;margin-top:2mm">Post‑Op Photo</div></div>`:''}</div><div style="margin-top:13mm;font-size:10pt">IGMC&RI - Department of Surgery</div></div>`;document.body.appendChild(sheet)}
function printTokenSystem(token){const p=patients.find(x=>x.token===token)||current;if(!p){toast('Patient record not found');return}const old=$('#printSheet');if(old)old.remove();const diagnosis=p.diagnosis||p.otNotes?.diagnosis||'-';const sheet=document.createElement('section');sheet.id='printSheet';sheet.innerHTML=`<div class="tokenPrintSheet"><div class="tokenPrintNumber">${esc(p.token||'-')}</div><div class="tokenPrintLine"><b>Name:</b> ${esc(p.name||'-')}</div><div class="tokenPrintLine"><b>Age:</b> ${esc(p.age||'-')}</div><div class="tokenPrintLine"><b>Sex:</b> ${esc(p.sex==='F'?'Female':'Male')}</div><div class="tokenPrintLine"><b>Diagnosis:</b> ${esc(diagnosis)}</div><div class="tokenPrintFooter">IGMC&RI - Department of Surgery</div></div>`;document.body.appendChild(sheet);setTimeout(()=>window.print(),60)}
function printPatient(token){const p=patients.find(x=>x.token===token);if(!p){toast('Patient record not found');return}if(p.status!=='completed'){toast('Complete the patient before printing the record');return}makePrintSheet(p);setTimeout(()=>window.print(),60);setTimeout(()=>{const s=$('#printSheet');if(s)s.remove()},1500)}
function printSummary(){const done=patients.filter(p=>p.status==='completed');if(!done.length){toast('No completed patients for this date');return}const old=$('#printSheet');if(old)old.remove();const sheet=document.createElement('section');sheet.id='printSheet';sheet.innerHTML=`<div style="font-family:Arial,Helvetica,sans-serif;padding:12mm;color:#111;max-width:210mm"><h2 style="text-align:center;margin:0 0 3mm">MINOR OT — COMPLETED PATIENT SUMMARY</h2><div style="text-align:center;margin-bottom:7mm;font-size:11pt">${esc(date)} · ${done.length} completed patient(s)</div>${done.map((p,i)=>{const o=p.otNotes||{};return `<div style="border:1px solid #bbb;padding:5mm;margin-bottom:5mm;page-break-inside:avoid"><div style="font-size:13pt;font-weight:bold">${i+1}. ${esc(p.token)} — ${esc(p.name)}</div><div style="font-size:10pt;margin-top:2mm">${esc(p.age||'-')}/${esc(p.sex==='F'?'F':'M')} · ${esc(p.diagnosis||'-')} · ${esc(p.site||'-')} · ${esc(p.procedure||'-')}</div><div style="font-size:10pt;margin-top:3mm"><b>Findings:</b> ${esc(o.findings||'-')}<br><b>HPE:</b> ${o.hpe==='SENT'?'Sent':'N/A'} · <b>Pus culture:</b> ${o.pusCulture==='SENT'?'Sent':'N/A'}</div></div>`}).join('')}<div style="margin-top:8mm;font-size:10pt">IGMC&RI - Department of Surgery</div></div>`;document.body.appendChild(sheet);setTimeout(()=>window.print(),60);setTimeout(()=>{const s=$('#printSheet');if(s)s.remove()},1500)}
function recordsPage(){return `${header()}<section class="card"><div class="datebar"><div><h2 class="title" style="margin:0">Records</h2><div class="sub">Date-wise local records</div></div><input id="datePick" type="date" value="${esc(date)}"></div><button class="btn green full" id="summaryPrint" style="margin-top:13px">🖨 Print Summary — Completed Patients</button>${patients.length?patients.map(p=>`<article class="patient"><div class="prow"><span class="token">${esc(p.token)}</span><b>${esc(p.name)}</b><span class="push sub">${esc(statusLabel(p.status))}</span></div><div class="info">${esc(p.age||'')}/${esc(p.sex==='F'?'F':'M')} · ${esc(p.diagnosis||'-')} · ${esc(p.site||'-')}<br>${esc(p.procedure||'-')}</div>${p.status==='completed'?`<button class="btn primary full printPatient" data-token="${esc(p.token)}" style="margin-top:9px">Print PDF</button>`:`<div class="summarybox">Operative record becomes available after status is Done.</div>`}</article>`).join(''):'<div class="empty">No records for this date.</div>'}</section>`}
function bindCommon(){$$('[data-page]').forEach(btn=>{btn.onclick=()=>{page=btn.dataset.page;render()}});const clear=$('#clearAll');if(clear){clear.onclick=()=>{if(!confirm('Clear ALL Minor OT patient data from this device? This cannot be undone.'))return;const oldDate=date;patients=patients.filter(p=>(p.date||'')!==oldDate);current=null;prePhoto='';saveLocal();cloudClearDate(oldDate);toast('All patient data for this date cleared');render()}}}
function bindPage(){bindCommon();if(page==='reg'){bindPhoto('prePhotoInput',data=>{prePhoto=data});$('#continuePre').onclick=()=>{if(readForm()){page='pre';render()}}}if(page==='pre'){bindSafety()}if(page==='token'){$('#announceToken').onclick=()=>{if(current)announcePatient(current)};$('#thermalToken').onclick=()=>{if(current)startThermalPrintFromClick(current.token)};$('#systemToken').onclick=()=>{if(current)printTokenSystem(current.token)};$('#newPatient').onclick=()=>{resetForm();page='reg';render()}}if(page==='list'){$$('.announceList').forEach(btn=>{btn.onclick=()=>{const p=patients.find(x=>x.token===btn.dataset.token);if(p)announcePatient(p)}});$$('.advance').forEach(btn=>{btn.onclick=()=>{const p=patients.find(x=>x.token===btn.dataset.token);if(p)advanceStatus(p)}});$$('.notesBtn').forEach(btn=>{btn.onclick=()=>openNotes(btn.dataset.token)});$$('.printPatient').forEach(btn=>{btn.onclick=()=>printPatient(btn.dataset.token)})}if(page==='records'){$('#datePick').onchange=()=>{date=$('#datePick').value||today();localStorage.setItem(DATE_KEY,date);loadLocal();render();cloudLoadDate()};$('#summaryPrint').onclick=printSummary;$$('.printPatient').forEach(btn=>{btn.onclick=()=>printPatient(btn.dataset.token)})}}
function render(){loadLocal();if(page==='reg')app.innerHTML=regPage();else if(page==='pre')app.innerHTML=safetyPage();else if(page==='token')app.innerHTML=tokenPage();else if(page==='list')app.innerHTML=listPage();else if(page==='records')app.innerHTML=recordsPage();bindPage()}
window.addEventListener('afterprint',()=>{const s=$('#printSheet');if(s)s.remove()});
/* No SpeechRecognition. No microphone buttons. */
render();cloudLoadDate();
</script>
</body>
