<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minor OT – Records</title><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eff6ff;font-family:system-ui,-apple-system,sans-serif;color:#111827;padding:10px}.app{max-width:1100px;margin:auto}.card{background:white;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0001}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:28px;font-weight:900;color:#2563eb}.tabs{display:flex;gap:7px;margin:12px 0}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.blue{background:#2563eb;color:white}.green{background:#16a34a;color:white}.purple{background:#9333ea;color:white}.red{background:#dc2626;color:white}.yellow{background:#eab308;color:white}.gray{background:#f3f4f6;color:#111827}.input{width:100%;padding:11px;border:2px solid #d1d5db;border-radius:10px;font-size:15px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.section{padding:12px;border-radius:12px;margin:10px 0;background:#f8fafc;border:1px solid #dbeafe}.patient{border:1px solid #dbeafe;border-radius:12px;padding:12px;margin:8px 0;background:white}.token{font-size:22px;font-weight:900;padding:6px 12px;border-radius:9px;background:#22c55e;color:white;display:inline-block}.small{font-size:12px;color:#6b7280}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:12px;z-index:20}.modalbox{background:white;border-radius:16px;padding:16px;width:min(760px,100%);max-height:92vh;overflow:auto}.photo{max-width:100%;max-height:240px;border-radius:10px;margin-top:8px}.check{display:flex;gap:8px;align-items:center;padding:8px;background:white;border-radius:9px;margin:5px 0}.check input{width:20px;height:20px}.history{max-height:60vh;overflow:auto}.link{color:#2563eb;text-decoration:underline;cursor:pointer}@media(max-width:600px){.grid2,.grid3{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.tabs .btn{flex:1}}
</style></head><body><div id="root"></div><script type="text/babel">const{useState,useEffect}=React;firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const PRE=[['allergies','Allergies',false],['tt','TT — Subject: 0.5 ml IM stat',true],['testDose','Test Dose — Subject: Injection Xylo test dose',true],['attender','Attender',true],['ornaments','Ornaments',true],['consent','Consent',false]];const RX=[['amoxyclav','Tab Amoxyclav 625 mg BD for 5 days'],['cefu','Tab CefU 200 mg BD for 5 days'],['paracetamol','Tab Paracetamol 500 mg BD for 5 days'],['pantop','Tab Pantop 40 mg OD for 5 days'],['chymoral','Tab Chymoral Forte 1 tab TDS for 5 days']];const INS=[['cd','C&D daily'],['soak','Watch for soakage'],['warning','Review if there is warning has explained']];
function say(t){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';u.rate=.82;let v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('ta'));if(v)u.voice=v;speechSynthesis.speak(u)}function announce(p,post){say(`திரு ${p.name} அவர்கள் ${post?'Dressing Room':'Minor OT Room'}க்கு வரவும்.`)}
function fileData(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function crc8(a){let c=0;for(const b of a){c^=b;for(let i=0;i<8;i++)c=(c&128)?((c<<1)^7)&255:(c<<1)&255}return c}function pkt(cmd,data=[]){let d=[...data];return new Uint8Array([81,120,cmd,0,d.length&255,d.length>>8,...d,crc8(d),255])}let printerChar=null;
async function printer(){if(printerChar)return printerChar;let d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['0000ae30-0000-1000-8000-00805f9b34fb']});let s=await d.gatt.connect(),ss=await s.getPrimaryServices(),svc=ss.find(x=>x.uuid.toLowerCase().includes('ae30'));if(!svc)throw Error('AE30 print service not found');let cs=await svc.getCharacteristics();printerChar=cs.find(x=>x.uuid.toLowerCase().includes('ae01')&&x.properties.writeWithoutResponse)||cs.find(x=>x.uuid.toLowerCase().includes('ae01')&&x.properties.write);if(!printerChar)throw Error('AE01 writable BLE channel not found');return printerChar}const wait=m=>new Promise(r=>setTimeout(r,m));async function send(ch,b){if(ch.writeValueWithoutResponse)return ch.writeValueWithoutResponse(b);return ch.writeValue(b)}
function canvas(lines){let c=document.createElement('canvas'),ctx=c.getContext('2d'),W=384;c.width=W;c.height=Math.max(120,lines.length*34+40);ctx.fillStyle='white';ctx.fillRect(0,0,W,c.height);ctx.fillStyle='black';ctx.textAlign='center';let y=30;for(let l of lines){ctx.font=l.b?'bold 25px Arial':'21px Arial';ctx.fillText(l.t,W/2,y);y+=l.s||32}return c}function rows(c){let x=c.getContext('2d'),W=384,H=c.height,a=x.getImageData(0,0,W,H).data,o=[];for(let y=0;y<H;y++){let r=new Uint8Array(48);for(let q=0;q<W;q++){if(a[(y*W+q)*4]<150)r[q>>3]|=1<<(q&7)}o.push(r)}return o}
async function printLines(lines){let ch=await printer();await send(ch,pkt(175,[16,0]));await wait(60);await send(ch,pkt(164,[51]));await wait(60);await send(ch,pkt(190,[0]));await wait(60);await send(ch,pkt(166,[170,85,23,56,68,95,95,95,68,56,44]));for(let r of rows(canvas(lines))){await send(ch,pkt(162,[...r]));await wait(2)}await send(ch,pkt(166,[170,85,23,0,0,0,0,0,0,23,17]));await wait(50);await send(ch,pkt(189,[24]))}
async function printPatient(p){await printLines([{t:'MINOR OT',b:true,s:36},{t:p.token,b:true,s:36},{t:`Name: ${p.name}`},{t:`Age/Sex: ${p.age}/${p.sex}`},{t:`OPD: ${p.opd}`},{t:`Diagnosis: ${p.diagnosis}`},{t:`Site: ${p.site||'-'}`},{t:`Procedure: ${p.procedure}`},{t:p.room,s:36}])}
async function printNotes(p,n){let l=[{t:'MINOR OT',b:true},{t:`OT NOTES - ${p.token}`,b:true},{t:`${p.name} ${p.age}/${p.sex}`},{t:`Diagnosis: ${p.diagnosis}`},{t:`Site: ${p.site||'-'}`},{t:`Procedure: ${n.procedureDone||p.procedure}`},{t:`Findings: ${n.findings||'-'}`},{t:`Details: ${n.details||'-'}`},{t:`Complications: ${n.complications||'Nil'}`},{t:'PRESCRIPTION',b:true}];RX.filter(r=>n.rx?.[r[0]]).forEach(r=>l.push({t:r[1],s:28}));l.push({t:'INSTRUCTIONS',b:true});INS.filter(r=>n.ins?.[r[0]]).forEach(r=>l.push({t:r[1]}));if(n.additional)l.push({t:n.additional});await printLines(l)}
function App(){const today=()=>{let d=new Date();return d.toISOString().slice(0,10)};const[date,setDate]=useState(today()),[patients,setPatients]=useState([]),[tab,setTab]=useState('reg'),[form,setForm]=useState({name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',isSeptic:false}),[photo,setPhoto]=useState(''),[step,setStep]=useState(1),[current,setCurrent]=useState(null),[record,setRecord]=useState(null),[notes,setNotes]=useState(null),[message,setMessage]=useState('');const col=()=>db.collection('minorOT').doc(date).collection('patients');useEffect(()=>col().orderBy('time').onSnapshot(s=>setPatients(s.docs.map(d=>({id:d.id,...d.data()}))),e=>setMessage(e.message)),[date]);const upd=(p,data)=>col().doc(p.id).update(data);const add=async()=>{let ref=col().doc(),field=form.isSeptic?'septicCount':'nonSepticCount',prefix=form.isSeptic?'D':'OT';await db.runTransaction(async tx=>{let day=db.collection('minorOT').doc(date),ds=await tx.get(day),n=(ds.exists?ds.data()[field]||0:0)+1;tx.set(day,{[field]:n},{merge:true});tx.set(ref,{...current,token:`${prefix}-${String(n).padStart(3,'0')}`,time:new Date().toISOString()})});setStep(1);setCurrent(null);setPhoto('');setForm({name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',isSeptic:false})};const generate=()=>{if(!form.name||!form.age||!form.opd||!form.diagnosis||!form.site||!form.procedure)return setMessage('Fill all fields');setCurrent({...form,token:'PREVIEW',room:form.isSeptic?'Dressing':`Minor OT ${(patients.filter(p=>!p.isSeptic).length%3)+1}`,preOp:{},preOpNA:{},postOp:{},preOpPhoto:photo,status:'registered'});setStep(2)};const upload=async(e,kind,p)=>{let f=e.target.files?.[0];if(!f)return;let d=await fileData(f);if(kind==='pre'){setPhoto(d)}else await upd(p,{postOpPhoto:d})};const ready=p=>PRE.every(x=>p.preOp?.[x[0]]||(!x[2]?false:p.preOpNA?.[x[0]]));return <div className="app"><div className="card"><div className="top"><div><div className="title">Minor OT</div><div className="small">Date-based patient records</div></div><div className="row"><input className="input" type="date" value={date} onChange={e=>setDate(e.target.value)}/><button className="btn gray" onClick={()=>setDate(today())}>Today</button></div></div><div className="tabs"><button className={`btn ${tab==='reg'?'blue':'gray'}`} onClick={()=>setTab('reg')}>Registration</button><button className={`btn ${tab==='pre'?'green':'gray'}`} onClick={()=>setTab('pre')}>Pre-Op</button><button className={`btn ${tab==='post'?'purple':'gray'}`} onClick={()=>setTab('post')}>Post-Op</button><button className={`btn ${tab==='records'?'yellow':'gray'}`} onClick={()=>setTab('records')}>Records</button></div></div>
{tab==='reg'&&<div className="card">{step===1&&<><h2>Patient Registration</h2><div className="grid2"><input className="input" placeholder="Patient name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/><input className="input" type="number" placeholder="Age" value={form.age} onChange={e=>setForm({...form,age:e.target.value})}/></div><div className="grid3" style={{marginTop:9}}><select className="input" value={form.sex} onChange={e=>setForm({...form,sex:e.target.value})}><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select><select className="input" value={form.opd} onChange={e=>setForm({...form,opd:e.target.value})}><option value="">OPD</option><option>7A</option><option>7B</option><option>7C</option><option>7D</option></select><input className="input" placeholder="Site" value={form.site} onChange={e=>setForm({...form,site:e.target.value})}/></div><div className="grid2" style={{marginTop:9}}><input className="input" placeholder="Diagnosis" value={form.diagnosis} onChange={e=>setForm({...form,diagnosis:e.target.value})}/><div className="row"><input className="input" placeholder="Procedure" value={form.procedure} onChange={e=>setForm({...form,procedure:e.target.value})}/><button className="btn gray" onClick={()=>say(`Procedure ${form.procedure}`)}>🔊</button></div></div><button className="btn blue" style={{width:'100%',marginTop:10}} onClick={()=>setStep(1.5)}>Next</button></>}{step===1.5&&<><h2>Triage</h2><div className="row"><button className={`btn ${form.isSeptic?'red':'green'}`} onClick={()=>setForm({...form,isSeptic:!form.isSeptic})}>{form.isSeptic?'🔴 SEPTIC':'🟢 NON-SEPTIC'}</button><label className="btn green">📷 Upload Pre-Op Photo<input hidden type="file" accept="image/*" capture="environment" onChange={e=>upload(e,'pre')}/></label></div>{photo&&<img className="photo" src={photo}/>}<div className="row" style={{marginTop:10}}><button className="btn gray" onClick={()=>setStep(1)}>Back</button><button className="btn blue" onClick={generate}>Generate Token</button></div></>}{step===2&&current&&<><div style={{textAlign:'center'}}><span className="token">{current.token}</span></div><div className="section"><b>{current.name}</b> · {current.age}/{current.sex}<br/>OPD: {current.opd}<br/>Diagnosis: {current.diagnosis}<br/>Site: {current.site}<br/>Procedure: {current.procedure}{current.preOpPhoto&&<><br/><img className="photo" src={current.preOpPhoto}/></>}</div><div className="row"><button className="btn green" onClick={async()=>{try{await printPatient(current);setMessage('Printed successfully')}catch(e){setMessage(e.message)}}}>🖨️ Print</button><button className="btn green" onClick={()=>announce(current,false)}>🔊 Announce</button><button className="btn blue" onClick={add}>Add to Queue</button></div></>}</div>}
{tab==='pre'&&<div className="card"><h2>Pre-Op — {date}</h2>{patients.filter(p=>['registered','ready'].includes(p.status)).map(p=><div className="patient" key={p.id}><div className="top"><div><span className="token">{p.token}</span> <b>{p.name}</b><div className="small">{p.age}/{p.sex} · {p.opd} · {p.diagnosis} · Site: {p.site||'-'}</div></div><div className="row"><button className="btn green" onClick={()=>announce(p,false)}>🔊</button><button className="btn blue" onClick={()=>printPatient(p).catch(e=>setMessage(e.message))}>🖨️</button><button className="btn yellow" onClick={()=>setRecord(p)}>View Record</button></div></div><div className="section">{PRE.map(x=><div className="check" key={x[0]}><label style={{flex:1}}><input type="checkbox" checked={!!p.preOp?.[x[0]]} onChange={e=>upd(p,{[`preOp.${x[0]}`]:e.target.checked})}/> {x[1]}</label>{x[2]&&<label><input type="checkbox" checked={!!p.preOpNA?.[x[0]]} onChange={e=>upd(p,{[`preOpNA.${x[0]}`]:e.target.checked})}/> NA</label>}</div>)}</div><button className="btn green" disabled={!ready(p)} onClick={()=>upd(p,{status:'in-progress'})}>Start OT</button></div>)}</div>}
{tab==='post'&&<div className="card"><h2>Post-Op — {date}</h2>{patients.map(p=><div className="patient" key={p.id}><div className="top"><div><span className="token">{p.token}</span> <b>{p.name}</b><div className="small">{p.diagnosis} · Site: {p.site||'-'}</div></div><div className="row"><button className="btn green" onClick={()=>announce(p,true)}>🔊</button><button className="btn blue" onClick={()=>printPatient(p).catch(e=>setMessage(e.message))}>🖨️</button><button className="btn yellow" onClick={()=>setRecord(p)}>View Record</button></div></div>{p.status==='in-progress'&&<div className="section"><label className="btn purple">📷 Upload Post-Op Photo<input hidden type="file" accept="image/*" capture="environment" onChange={e=>upload(e,'post',p)}/></label>{p.postOpPhoto&&<><br/><span className="link" onClick={()=>window.open(p.postOpPhoto,'_blank')}>Open uploaded post-op photo</span></>}<div style={{marginTop:10}}><button className="btn purple" onClick={()=>setNotes({p,data:p.otNotesData||{rx:{},ins:{}}})}>OT Notes</button></div></div>}</div>)}</div>}
{tab==='records'&&<div className="card"><h2>Future Reference</h2><p className="small">Selected date: {date}. Use the date toggle above to open another day's records.</p><div className="history">{patients.map(p=><div className="patient" key={p.id}><div className="top"><div><span className="token">{p.token}</span> <b>{p.name}</b><div className="small">{p.diagnosis} · Site: {p.site||'-'}</div></div><button className="btn yellow" onClick={()=>setRecord(p)}>View Complete Record</button></div></div>)}</div></div>}
{record&&<div className="modal" onClick={()=>setRecord(null)}><div className="modalbox" onClick={e=>e.stopPropagation()}><div className="top"><h2>Patient Record — {record.token}</h2><button className="btn gray" onClick={()=>setRecord(null)}>✕</button></div><div className="section"><b>{record.name}</b><br/>Age/Sex: {record.age}/{record.sex}<br/>OPD: {record.opd}<br/>Diagnosis: {record.diagnosis}<br/>Site: {record.site||'-'}<br/>Procedure: {record.procedure}<br/>Date: {new Date(record.time).toLocaleString()}</div>{record.preOpPhoto&&<div><b>Pre-Op Photo:</b><br/><span className="link" onClick={()=>window.open(record.preOpPhoto,'_blank')}>Open uploaded pre-op photo</span></div>}{record.postOpPhoto&&<div style={{marginTop:10}}><b>Post-Op Photo:</b><br/><span className="link" onClick={()=>window.open(record.postOpPhoto,'_blank')}>Open uploaded post-op photo</span></div>}{record.otNotesData&&<div className="section"><b>OT Notes</b><p>Procedure: {record.otNotesData.procedureDone||record.procedure}</p><p>Findings: {record.otNotesData.findings||'-'}</p><p>Details: {record.otNotesData.details||'-'}</p><p>Complications: {record.otNotesData.complications||'Nil'}</p><button className="btn purple" onClick={()=>setNotes({p:record,data:record.otNotesData})}>Open OT Notes</button></div>}<button className="btn blue" onClick={()=>printPatient(record).catch(e=>setMessage(e.message))}>🖨️ Print Record</button></div></div>}
{notes&&<Notes p={notes.p} initial={notes.data} close={()=>setNotes(null)} save={async d=>{await upd(notes.p,{otNotesData:d,'postOp.otNotes':true});setNotes(null)}}/>}{message&&<div className="modal" onClick={()=>setMessage('')}><div className="modalbox"><b>{message}</b><br/><button className="btn blue" style={{marginTop:10}} onClick={()=>setMessage('')}>OK</button></div></div>}</div>}
function Notes({p,initial,close,save}){const[d,setD]=useState({...initial,rx:initial.rx||{},ins:initial.ins||{}});return <div className="modal" onClick={close}><div className="modalbox" onClick={e=>e.stopPropagation()}><div className="top"><h2>OT Notes — {p.token}</h2><button className="btn gray" onClick={close}>✕</button></div><input className="input" placeholder="Procedure done" value={d.procedureDone||''} onChange={e=>setD({...d,procedureDone:e.target.value})}/><textarea className="input" style={{marginTop:8}} rows="2" placeholder="Findings" value={d.findings||''} onChange={e=>setD({...d,findings:e.target.value})}/><textarea className="input" style={{marginTop:8}} rows="2" placeholder="Procedure details" value={d.details||''} onChange={e=>setD({...d,details:e.target.value})}/><input className="input" style={{marginTop:8}} placeholder="Complications" value={d.complications||''} onChange={e=>setD({...d,complications:e.target.value})}/><h3>Prescription</h3>{RX.map(r=><label className="check" key={r[0]}><input type="checkbox" checked={!!d.rx[r[0]]} onChange={e=>setD({...d,rx:{...d.rx,[r[0]]:e.target.checked}})}/>{r[1]}</label>)}<h3>Instructions</h3>{INS.map(r=><label className="check" key={r[0]}><input type="checkbox" checked={!!d.ins[r[0]]} onChange={e=>setD({...d,ins:{...d.ins,[r[0]]:e.target.checked}})}/>{r[1]}</label>)}<textarea className="input" rows="2" placeholder="Additional instructions" value={d.additional||''} onChange={e=>setD({...d,additional:e.target.value})}/><div className="row" style={{marginTop:10}}><button className="btn purple" onClick={()=>say(`${d.procedureDone||'Procedure'}. ${d.findings||''}. ${d.details||''}`)}>🔊 Speak</button><button className="btn green" onClick={()=>save(d)}>Save</button><button className="btn blue" onClick={()=>printNotes(p,d).catch(e=>alert(e.message))}>🖨️ Print</button></div></div></div>}
ReactDOM.render(<App/>,document.getElementById('root'));</script></body></html>
