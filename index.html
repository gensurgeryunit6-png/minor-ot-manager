<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minor OT</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{--navy:#303247;--yellow:#ffc400;--green:#25c66a;--blue:#2877e8;--purple:#a74de8;--bg:#eef5fb;--muted:#727684}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--navy)}.app{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:28px;padding:20px;margin-bottom:14px;box-shadow:0 5px 22px #26334a12}.brand{font-size:34px;font-weight:950;letter-spacing:-1px}.sub{color:var(--muted);font-size:14px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.online{background:#e7faef;color:#08723a;border-radius:20px;padding:9px 13px;font-weight:850}.danger{background:#ef454c;color:#fff;border-radius:13px;padding:12px 16px;font-weight:850}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.tab{background:#f2f3f6;color:#202433;padding:14px 8px;border-radius:16px;font-weight:900}.tab.active{background:var(--blue);color:#fff}.tab.pre.active{background:var(--green)}.tab.list.active{background:var(--purple)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.stat{border-radius:17px;padding:11px;text-align:center;border:1px solid}.stat b{display:block;font-size:23px}.stat small{font-weight:850}.s1{background:#e4efff;color:#244ba7}.s2{background:#fff4ca;color:#8d4c00}.s3{background:#dcf8e8;color:#086b4c}.s4{background:#f0ddff;color:#7422a9}.s5{background:#f3f4f6;color:#3e4452}.title{font-size:26px;font-weight:950;margin:4px 0 14px}.input,select,textarea{width:100%;padding:14px 15px;border:2px solid #dfe2e8;border-radius:15px;background:#fff;color:#202433;outline:none}.input:focus,select:focus,textarea:focus{border-color:#8bb6f5}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.btn{padding:13px 16px;border-radius:14px;font-weight:900}.blue{background:var(--blue);color:#fff}.green{background:var(--green);color:#fff}.purple{background:var(--purple);color:#fff}.yellow{background:var(--yellow);color:#4a3600}.light{background:#f3f4f6;color:#272b38}.red{background:#ef454c;color:#fff}.wide{width:100%;margin-top:12px}.triage{background:#fff3f3;border:2px solid #ffd0d0;border-radius:20px;padding:16px;margin:14px 0}.section{border-radius:20px;padding:16px;margin-top:14px}.pre{background:#f1fff6;border:2px solid #9ae9bc}.post{background:#fbf2ff;border:2px solid #dcaaf6}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{background:#fff;border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.check label{display:flex;gap:9px;align-items:flex-start;font-weight:750}.check input{width:20px;height:20px;accent-color:var(--green)}.hint{font-size:12px;color:var(--muted);margin-top:3px;font-weight:650}.upload{display:block;text-align:center}.photo{max-width:100%;max-height:300px;border-radius:18px;margin-top:10px;object-fit:contain}.link{color:#1769d2;text-decoration:underline;font-weight:850;cursor:pointer;margin-top:7px}.ticket{background:var(--navy);color:#fff;border-radius:28px;overflow:hidden;box-shadow:0 10px 30px #30324730}.ticketTop{background:var(--yellow);color:#303247;padding:20px;text-align:center}.ticketNo{font-size:42px;font-weight:950;letter-spacing:1px}.ticketBody{padding:20px}.ticketGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ticketLabel{color:#bfc2ce;font-size:12px}.ticketValue{font-size:18px;font-weight:850}.ticketBottom{border-top:1px dashed #777989;padding:15px 20px;text-align:center}.queue{background:#fff;border-radius:25px;padding:15px;margin-top:12px;box-shadow:0 4px 18px #26334a10}.queueHead{display:flex;align-items:center;gap:10px}.token{background:var(--green);color:#fff;border-radius:14px;padding:10px 14px;font-size:22px;font-weight:950}.token.septic{background:#ef454c}.actions{margin-left:auto;display:flex;gap:7px}.iconbtn{width:48px;height:48px;border-radius:14px;font-size:20px}.datebar{display:flex;align-items:center;gap:8px;background:#f4f5f7;border-radius:17px;padding:8px;margin-bottom:12px}.datebar input{border:0;background:transparent;font-weight:850;padding:8px;flex:1}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:14px;z-index:5000}.modalbox{background:#fff;color:var(--navy);width:min(760px,100%);max-height:94vh;overflow:auto;border-radius:26px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.rx{display:flex;gap:10px;align-items:flex-start;background:#f7f8fa;padding:12px;border-radius:14px;margin:7px 0}.rx input{width:20px;height:20px;accent-color:var(--purple)}.toast{position:fixed;left:16px;right:16px;bottom:16px;background:#166534;color:#fff;padding:14px;border-radius:16px;text-align:center;font-weight:850;z-index:9000}@media(max-width:650px){.app{padding:9px}.card{padding:15px;border-radius:23px}.brand{font-size:30px}.head{align-items:flex-start}.grid2,.grid3,.ticketGrid,.checks{grid-template-columns:1fr}.stats{gap:4px}.stat{padding:8px 3px}.stat b{font-size:19px}.stat small{font-size:10px}.tabs{gap:6px}.tab{padding:13px 4px}.ticketNo{font-size:36px}.actions{margin-left:0}.queueHead{flex-wrap:wrap}}
</style>
</head>
<body><div id="root"></div>
<script>
(function(){
'use strict';
if(!window.firebase||!window.firebaseConfig){root.innerHTML='<div class="card"><div class="brand">Minor OT</div><p>Firebase configuration could not be loaded.</p></div>';return}
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig)}catch(e){console.error(e)}
const db=firebase.firestore();
const PRE=[['allergies','Allergies',''],['tt','TT','Subject: 0.5 ml IM stat'],['testDose','Test Dose','Subject: Injection Xylo test dose'],['attender','Attender',''],['ornaments','Ornaments',''],['consent','Consent','']];
const RX=[['amoxyclav','Tab Amoxyclav 625 mg','BD for 5 days'],['cefu','Tab CefU 200 mg','BD for 5 days'],['paracetamol','Tab Paracetamol 500 mg','BD for 5 days'],['pantop','Tab Pantop 40 mg','OD for 5 days'],['chymoral','Tab Chymoral Forte','1 tab TDS for 5 days']];
const INS=[['cd','C&D daily'],['soak','Watch for soakage'],['warning','Review if there is warning has explained']];
let date=localDate(),tab='reg',step=1,patients=[],form=blank(),prePhoto='',current=null,notesPatient=null,unsub=null,timer;
function localDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date())}
function blank(){return{name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',isSeptic:false,fever:false,bleeding:false,pain:false,shock:false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){document.getElementById('toast')?.remove();document.body.insertAdjacentHTML('beforeend','<div id="toast" class="toast">'+esc(t)+'</div>');clearTimeout(timer);timer=setTimeout(()=>document.getElementById('toast')?.remove(),3500)}
function speak(t){if(!('speechSynthesis'in window)){toast('Text-to-speech is not available on this device');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';u.rate=.8;const v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('ta'));if(v)u.voice=v;speechSynthesis.speak(u)}
function announce(p,post){if(p)speak('திரு '+p.name+' அவர்கள் '+(post?'dressing room':'minor OT room')+'க்கு வரவும்.')}
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function counts(){return [patients.length,...['registered','ready','in-progress','completed'].map(s=>patients.filter(p=>p.status===s).length)]}
function header(){const c=counts();return '<div class="card"><div class="head"><div><div class="brand">Minor OT</div><div class="sub">'+new Date(date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+'</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="online">● Online</span><button class="danger" id="clear">🗑 Clear All Data</button></div></div><div class="tabs"><button class="tab '+(tab==='reg'?'active':'')+'" data-tab="reg">Registration</button><button class="tab pre '+(tab==='pre'?'active':'')+'" data-tab="pre">Pre-Op</button><button class="tab list '+(tab==='list'?'active':'')+'" data-tab="list">List</button></div><div class="stats">'+[['s1','Total'],['s2','Reg'],['s3','Ready'],['s4','Progress'],['s5','Done']].map((x,i)=>'<div class="stat '+x[0]+'"><b>'+c[i]+'</b><small>'+x[1]+'</small></div>').join('')+'</div></div>'}
function registration(){if(step===1)return '<div class="card"><div class="title">Patient Information</div><input class="input" id="name" placeholder="Patient name" value="'+esc(form.name)+'"><div class="grid3"><input class="input" id="age" type="number" placeholder="Age" value="'+esc(form.age)+'"><select id="sex"><option value="M" '+(form.sex==='M'?'selected':'')+'>Male</option><option value="F" '+(form.sex==='F'?'selected':'')+'>Female</option><option value="O" '+(form.sex==='O'?'selected':'')+'>Other</option></select><select id="opd"><option value="">OPD</option>'+['7A','7B','7C','7D'].map(x=>'<option '+(form.opd===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="grid2"><input class="input" id="diagnosis" placeholder="Diagnosis" value="'+esc(form.diagnosis)+'"><input class="input" id="site" placeholder="Site" value="'+esc(form.site)+'"></div><div style="display:flex;gap:8px;margin-top:10px"><input class="input" id="procedure" placeholder="Procedure" value="'+esc(form.procedure)+'"><button class="btn light" id="speakProc">🔊</button></div><button class="btn blue wide" id="next">Next</button></div>';
return '<div class="card"><div class="title">Triage & Pre-Op</div><div class="grid2"><button class="btn '+(!form.isSeptic?'green':'light')+'" id="non">🟢 NON-SEPTIC</button><button class="btn '+(form.isSeptic?'red':'light')+'" id="sept">🔴 SEPTIC</button></div><div class="triage"><b>Red Flags</b>'+[['fever','Fever'],['bleeding','Bleeding'],['pain','Severe Pain'],['shock','Shock']].map(x=>'<label style="display:block;margin-top:10px"><input type="checkbox" id="'+x[0]+'" '+(form[x[0]]?'checked':'')+'> '+x[1]+'</label>').join('')+'</div><label class="btn green upload">📷 Upload Pre-Op Photo<input id="prePhoto" type="file" accept="image/*" capture="environment" hidden></label>'+(prePhoto?'<img class="photo" src="'+prePhoto+'"><div class="link" id="openPre">Open uploaded photo</div>':'')+'<div style="display:flex;gap:8px;margin-top:12px"><button class="btn light" id="back">Back</button><button class="btn blue" id="generate" style="flex:1">Generate Token</button></div></div>'}
function tokenPreview(){return '<div class="card"><div class="ticket"><div class="ticketTop"><div>YOUR OT TOKEN</div><div class="ticketNo">'+esc(current.token)+'</div></div><div class="ticketBody"><div class="ticketGrid"><div><div class="ticketLabel">PATIENT</div><div class="ticketValue">'+esc(current.name)+'</div></div><div><div class="ticketLabel">AGE / SEX</div><div class="ticketValue">'+esc(current.age)+' / '+esc(current.sex)+'</div></div><div><div class="ticketLabel">OPD</div><div class="ticketValue">'+esc(current.opd)+'</div></div><div><div class="ticketLabel">ROOM</div><div class="ticketValue">'+esc(current.room)+'</div></div><div><div class="ticketLabel">DIAGNOSIS</div><div class="ticketValue">'+esc(current.diagnosis)+'</div></div><div><div class="ticketLabel">SITE</div><div class="ticketValue">'+esc(current.site)+'</div></div><div><div class="ticketLabel">PROCEDURE</div><div class="ticketValue">'+esc(current.procedure)+'</div></div></div>'+(current.preOpPhoto?'<img class="photo" src="'+current.preOpPhoto+'">':'')+'</div><div class="ticketBottom">Please wait for your token to be announced</div></div><div class="grid2" style="margin-top:12px"><button class="btn green" id="announceCurrent">🔊 Announce</button><button class="btn blue" id="printCurrent">🖨 Print</button></div><div class="grid2"><button class="btn blue" id="addQueue">Add to Queue</button><button class="btn light" id="new">New Patient</button></div></div></div>'}
function preDone(p){return PRE.every(i=>i[0]==='allergies'||i[0]==='consent'||p.preOp?.[i[0]]||p.preOpNA?.[i[0]])}
function preop(){const arr=patients.filter(p=>p.status==='registered'||p.status==='ready');return '<div class="card"><div class="title">Pre-Op Queue</div>'+(!arr.length?'<p class="sub">No patients in the pre-op queue for this date.</p>':arr.map(p=>'<div class="queue"><div class="queueHead"><span class="token '+(p.isSeptic?'septic':'')+'">'+esc(p.token)+'</span><div><b>'+esc(p.name)+'</b><div class="sub">'+esc(p.age)+'/'+esc(p.sex)+' • '+esc(p.opd)+' • '+esc(p.site||'Site not entered')+'</div></div><div class="actions"><button class="iconbtn green" data-ann="'+p.id+'">🔊</button><button class="iconbtn blue" data-print="'+p.id+'">🖨</button></div></div><div class="section pre"><div class="checks">'+PRE.map(i=>'<div class="check"><label><input type="checkbox" data-pre="'+p.id+'|'+i[0]+'" '+(p.preOp?.[i[0]]?'checked':'')+'><span>'+i[1]+(i[2]?'<div class="hint">'+i[2]+'</div>':'')+'</span></label>'+(i[0]!=='allergies'&&i[0]!=='consent'?'<label class="hint"><input type="checkbox" data-na="'+p.id+'|'+i[0]+'" '+(p.preOpNA?.[i[0]]?'checked':'')+'> N/A</label>':'')+'</div>').join('')+'</div></div><div class="grid3"><button class="btn yellow" data-status="'+p.id+'|registered">Reg</button><button class="btn green" '+(preDone(p)?'':'disabled')+' data-status="'+p.id+'|ready">Ready</button><button class="btn purple" '+(preDone(p)?'':'disabled')+' data-status="'+p.id+'|in-progress">Start</button></div></div>').join('')+'</div>'}
function list(){const arr=patients;return '<div class="card"><div class="title" style="margin:0">OT List / Post-Op</div><div class="sub">Date-wise records and future reference</div><div class="datebar"><button class="btn light" id="prevDate">‹</button><input id="date" type="date" value="'+date+'"><button class="btn light" id="nextDate">›</button><button class="btn yellow" id="today">Today</button></div>'+(!arr.length?'<p class="sub">No records for '+esc(date)+'.</p>':arr.map(p=>'<div class="queue"><div class="queueHead"><span class="token '+(p.isSeptic?'septic':'')+'">'+esc(p.token)+'</span><div><b>'+esc(p.name)+'</b><div class="sub">'+esc(p.age)+'/'+esc(p.sex)+' • '+esc(p.opd)+' • '+esc(p.site||'Site not entered')+'</div></div><div class="actions"><button class="iconbtn green" data-annpost="'+p.id+'">🔊</button><button class="iconbtn blue" data-print="'+p.id+'">🖨</button></div></div>'+(p.status==='in-progress'?'<div class="section post"><div class="title" style="font-size:20px">Post-Op</div><label class="btn purple upload">📷 Upload Post-Op Photo<input type="file" accept="image/*" capture="environment" data-photo="'+p.id+'" hidden></label>'+(p.postOpPhoto?'<div class="link" data-open-photo="'+p.id+'">Open uploaded Post-Op Photo</div>':'')+'<div class="checks" style="margin-top:10px">'+[['otNotes','OT Notes'],['hpe','HPE'],['culture','Culture'],['prescription','Rx']].map(x=>'<div class="check"><label><input type="checkbox" data-post="'+p.id+'|'+x[0]+'" '+(p.postOp?.[x[0]]?'checked':'')+'><span>'+x[1]+'</span></label>'+(x[0]==='otNotes'?'<button class="btn purple" data-notes="'+p.id+'">Open</button>':'')+'</div>').join('')+'</div></div>':'')+'<div class="grid3"><button class="btn '+(p.status==='registered'?'yellow':'light')+'" data-status="'+p.id+'|registered">Reg</button><button class="btn '+(p.status==='ready'?'green':'light')+'" data-status="'+p.id+'|ready">Ready</button><button class="btn '+(p.status==='in-progress'?'purple':'light')+'" data-status="'+p.id+'|in-progress">Prog</button></div><button class="btn '+(postDone(p)?'green':'light')+' wide" '+(postDone(p)?'':'disabled')+' data-status="'+p.id+'|completed">'+(postDone(p)?'✓ Done':'Done')+'</button></div>').join('')+'</div>'}
function postDone(p){return ['otNotes','hpe','culture','prescription'].every(k=>p.postOp?.[k])}
function render(){root.innerHTML='<div class="app">'+header()+(tab==='reg'?(step===3?tokenPreview():registration()):tab==='pre'?preop():list())+'</div>';bind()}
function readForm(){['name','age','diagnosis','site','procedure'].forEach(k=>{const x=document.getElementById(k);if(x)form[k]=x.value.trim()});const s=document.getElementById('sex'),o=document.getElementById('opd');if(s)form.sex=s.value;if(o)form.opd=o.value;['fever','bleeding','pain','shock'].forEach(k=>{const x=document.getElementById(k);if(x)form[k]=x.checked})}
function generate(){readForm();const urgent=form.fever||form.bleeding||form.pain||form.shock;current={...form,token:'OT-PREVIEW',room:form.isSeptic?'Dressing Room':'Minor OT 1',priority:urgent?'urgent':'routine',status:'registered',time:new Date().toISOString(),preOp:{},preOpNA:{},postOp:{},preOpPhoto:prePhoto};step=3;render()}
async function addQueue(){const col=db.collection('minorOT').doc(date).collection('patients'),day=db.collection('minorOT').doc(date),field=current.isSeptic?'septicCount':'nonSepticCount',prefix=current.isSeptic?'D':'OT';try{const ref=col.doc();await db.runTransaction(async tx=>{const ds=await tx.get(day),n=(ds.exists?ds.data()[field]||0:0)+1;tx.set(day,{[field]:n},{merge:true});tx.set(ref,{...current,token:prefix+'-'+String(n).padStart(3,'0')})});toast('Patient added to queue');form=blank();prePhoto='';current=null;step=1;tab='reg'}catch(e){toast('Could not save: '+e.message)}}
function find(id){return patients.find(p=>p.id===id)}
async function updatePre(x){const [id,k]=x.dataset.pre.split('|');const p=find(id);const v=x.checked;const patch={[`preOp.${k}`]:v};const q={...p,preOp:{...(p.preOp||{}),[k]:v}};if(preDone(q))patch.status='ready';try{await db.collection('minorOT').doc(date).collection('patients').doc(id).update(patch)}catch(e){toast(e.message)}}
async function updateNA(x){const [id,k]=x.dataset.na.split('|');try{await db.collection('minorOT').doc(date).collection('patients').doc(id).update({[`preOpNA.${k}`]:x.checked})}catch(e){toast(e.message)}}
async function updatePost(x){const [id,k]=x.dataset.post.split('|');try{await db.collection('minorOT').doc(date).collection('patients').doc(id).update({[`postOp.${k}`]:x.checked})}catch(e){toast(e.message)}}
async function clearAll(){if(!confirm('Clear all data for '+date+'?'))return;try{const b=db.batch(),col=db.collection('minorOT').doc(date).collection('patients');patients.forEach(p=>b.delete(col.doc(p.id)));await b.commit();await db.collection('minorOT').doc(date).set({septicCount:0,nonSepticCount:0},{merge:true});toast('All data cleared')}catch(e){toast(e.message)}}
async function doPrint(p){if(!p)return;try{if(window.b21PrintLines){await window.b21PrintLines(['MINOR OT',p.token,p.name,p.age+'/'+p.sex,'OPD: '+p.opd,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+p.procedure,p.room])}else toast('Printer module unavailable')}catch(e){toast('Print failed: '+e.message)}}
function showNotes(){const p=notesPatient;if(!p)return;const d=p.otNotesData||{rx:{},instructions:{}};const box=document.createElement('div');box.className='modal';box.innerHTML='<div class="modalbox"><div class="modalhead"><div><div class="title" style="margin:0">Operative Notes</div><div class="sub">'+esc(p.token)+' • '+esc(p.name)+'</div></div><button class="btn light" id="closeNotes">✕</button></div><div class="grid2" style="margin-top:12px"><input class="input" id="nproc" placeholder="Procedure done" value="'+esc(d.procedureDone||p.procedure)+'"><input class="input" id="ncomp" placeholder="Complications (default Nil)" value="'+esc(d.complications||'')+'"></div><textarea class="input" id="nfind" rows="3" placeholder="Findings" style="margin-top:10px">'+esc(d.findings||'')+'</textarea><textarea class="input" id="ndetails" rows="3" placeholder="Procedure details" style="margin-top:10px">'+esc(d.details||'')+'</textarea><h3>Prescription</h3>'+RX.map(r=>'<label class="rx"><input type="checkbox" data-rx="'+r[0]+'" '+(d.rx?.[r[0]]?'checked':'')+'><span><b>'+r[1]+'</b><br><span class="sub">'+r[2]+'</span></span></label>').join('')+'<h3>Instructions</h3>'+INS.map(i=>'<label class="rx"><input type="checkbox" data-ins="'+i[0]+'" '+(d.instructions?.[i[0]]?'checked':'')+'><span>'+i[1]+'</span></label>').join('')+'<textarea class="input" id="nadd" rows="2" placeholder="Additional instructions" style="margin-top:8px">'+esc(d.additional||'')+'</textarea><div class="grid3"><button class="btn purple" id="speakNotes">🔊 Speak</button><button class="btn green" id="saveNotes">Save</button><button class="btn blue" id="printNotes">🖨 Print</button></div></div>';document.body.appendChild(box);box.querySelector('#closeNotes').onclick=()=>box.remove();box.querySelector('#speakNotes').onclick=()=>speak('Procedure '+box.querySelector('#nproc').value+'. Findings '+box.querySelector('#nfind').value+'. Instructions '+box.querySelector('#nadd').value);box.querySelector('#saveNotes').onclick=async()=>{const data=collectNotes(box);try{await db.collection('minorOT').doc(date).collection('patients').doc(p.id).update({otNotesData:data,'postOp.otNotes':true});box.remove();toast('Operative notes saved')}catch(e){toast(e.message)}};box.querySelector('#printNotes').onclick=async()=>{const d2=collectNotes(box),lines=['MINOR OT','OT NOTES '+p.token,p.name,p.age+'/'+p.sex,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+(d2.procedureDone||p.procedure),'Findings: '+(d2.findings||'-'),'Details: '+(d2.details||'-'),'Complications: '+d2.complications,'PRESCRIPTION'];RX.filter(r=>d2.rx[r[0]]).forEach(r=>lines.push(r[1]+' '+r[2]));lines.push('INSTRUCTIONS');INS.filter(i=>d2.instructions[i[0]]).forEach(i=>lines.push(i[1]));if(d2.additional)lines.push(d2.additional);try{await window.b21PrintLines(lines);toast('OT Notes sent to printer')}catch(e){toast('Print failed: '+e.message)}}}
function collectNotes(box){const rx={},instructions={};box.querySelectorAll('[data-rx]').forEach(x=>rx[x.dataset.rx]=x.checked);box.querySelectorAll('[data-ins]').forEach(x=>instructions[x.dataset.ins]=x.checked);return{procedureDone:box.querySelector('#nproc').value,findings:box.querySelector('#nfind').value,details:box.querySelector('#ndetails').value,complications:box.querySelector('#ncomp').value||'Nil',rx,instructions,additional:box.querySelector('#nadd').value}}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;step=1;render()});document.getElementById('clear')?.addEventListener('click',clearAll);document.getElementById('next')?.addEventListener('click',()=>{readForm();if(!form.name||!form.age||!form.opd||!form.diagnosis||!form.site||!form.procedure)return alert('Fill Name, Age, OPD, Diagnosis, Site and Procedure');step=2;render()});document.getElementById('speakProc')?.addEventListener('click',()=>{readForm();speak('Procedure '+form.procedure)});document.getElementById('back')?.addEventListener('click',()=>{step=1;render()});document.getElementById('non')?.addEventListener('click',()=>{form.isSeptic=false;render()});document.getElementById('sept')?.addEventListener('click',()=>{form.isSeptic=true;render()});document.getElementById('prePhoto')?.addEventListener('change',async e=>{if(e.target.files[0]){prePhoto=await fileData(e.target.files[0]);render()}});document.getElementById('openPre')?.addEventListener('click',()=>window.open(prePhoto,'_blank'));document.getElementById('generate')?.addEventListener('click',generate);document.getElementById('announceCurrent')?.addEventListener('click',()=>announce(current,false));document.getElementById('printCurrent')?.addEventListener('click',()=>doPrint(current));document.getElementById('addQueue')?.addEventListener('click',addQueue);document.getElementById('new')?.addEventListener('click',()=>{form=blank();prePhoto='';current=null;step=1;render()});document.querySelectorAll('[data-pre]').forEach(x=>x.onchange=()=>updatePre(x));document.querySelectorAll('[data-na]').forEach(x=>x.onchange=()=>updateNA(x));document.querySelectorAll('[data-post]').forEach(x=>x.onchange=()=>updatePost(x));document.querySelectorAll('[data-ann]').forEach(x=>x.onclick=()=>announce(find(x.dataset.ann),false));document.querySelectorAll('[data-annpost]').forEach(x=>x.onclick=()=>announce(find(x.dataset.annpost),true));document.querySelectorAll('[data-print]').forEach(x=>x.onclick=()=>doPrint(find(x.dataset.print)));document.querySelectorAll('[data-photo]').forEach(x=>x.onchange=async e=>{if(e.target.files[0]){try{await db.collection('minorOT').doc(date).collection('patients').doc(x.dataset.photo).update({postOpPhoto:await fileData(e.target.files[0])});toast('Post-op photo saved')}catch(err){toast(err.message)}}});document.querySelectorAll('[data-open-photo]').forEach(x=>x.onclick=()=>{const p=find(x.dataset.openPhoto);if(p?.postOpPhoto)window.open(p.postOpPhoto,'_blank')});document.querySelectorAll('[data-notes]').forEach(x=>x.onclick=()=>{notesPatient=find(x.dataset.notes);showNotes()});document.getElementById('date')?.addEventListener('change',e=>{date=e.target.value;subscribe()});document.getElementById('today')?.addEventListener('click',()=>{date=localDate();subscribe()});document.getElementById('prevDate')?.addEventListener('click',()=>shiftDate(-1));document.getElementById('nextDate')?.addEventListener('click',()=>shiftDate(1))}
function shiftDate(n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);date=d.toISOString().slice(0,10);subscribe()}
function subscribe(){if(unsub)unsub();unsub=db.collection('minorOT').doc(date).collection('patients').orderBy('time').onSnapshot(s=>{patients=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{patients=[];render();toast('Could not load '+date+': '+e.message)})}
subscribe();
})();
</script>
