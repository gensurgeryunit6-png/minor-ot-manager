<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minor OT</title><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef6ff;font-family:system-ui,-apple-system,sans-serif;color:#111827}.app{max-width:1050px;margin:auto;padding:10px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 9px #0001}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.title{font-size:30px;font-weight:900;color:#2563eb}.muted{color:#6b7280;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:850;font-size:14px;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}.blue{background:#3b82f6;color:#fff}.green{background:#22c55e;color:#fff}.purple{background:#a855f7;color:#fff}.yellow{background:#eab308;color:#fff}.red{background:#ef4444;color:#fff}.gray{background:#f3f4f6;color:#1f2937}.input{width:100%;padding:12px;border:2px solid #d1d5db;border-radius:11px;font-size:16px;background:#fff}.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.stat{border-radius:12px;padding:9px;text-align:center;border:1px solid}.n{font-size:23px;font-weight:900}.l{font-size:12px;font-weight:800}.sb{background:#dbeafe;color:#1e40af}.sy{background:#fef3c7;color:#92400e}.sg{background:#d1fae5;color:#065f46}.sp{background:#e9d5ff;color:#6b21a8}.sgr{background:#f3f4f6;color:#374151}.section{padding:12px;border-radius:14px;margin:10px 0;background:#f8fafc;border:1px solid #dbeafe}.pre{background:#f0fdf4;border:2px solid #86efac}.post{background:#faf5ff;border:2px solid #d8b4fe}.triage{background:#fef2f2;border:2px solid #fecaca}.token{display:inline-flex;padding:9px 14px;border-radius:11px;color:#fff;font-size:24px;font-weight:900}.tokg{background:#22c55e}.tokr{background:#ef4444}.patient{border:1px solid #dbeafe;border-radius:14px;padding:12px;margin:9px 0;background:#fff}.ptop{display:flex;justify-content:space-between;gap:8px;align-items:center}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{background:#fff;border-radius:9px;padding:9px;display:flex;align-items:flex-start;gap:8px}.check input{width:20px;height:20px}.badge{padding:7px 9px;border-radius:9px;color:#fff;font-size:11px;font-weight:900}.photo{max-width:100%;max-height:260px;border-radius:12px;margin-top:8px}.linkbtn{color:#2563eb;text-decoration:underline;cursor:pointer;background:none;border:0;padding:5px;font-weight:800}.modal{position:fixed;inset:0;background:#0008;z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px}.modalbox{background:#fff;border-radius:18px;padding:16px;width:min(760px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.rx{display:flex;gap:8px;background:#f8fafc;border-radius:9px;padding:9px;margin:6px 0}.history{max-height:65vh;overflow:auto}.json{white-space:pre-wrap;background:#111827;color:#e5e7eb;padding:10px;border-radius:10px;font-size:12px;overflow:auto}.smallbtn{padding:8px 10px;font-size:12px}@media(max-width:650px){.g2,.g3{grid-template-columns:1fr}.stats{gap:4px}.n{font-size:18px}.l{font-size:10px}.ptop{align-items:flex-start;flex-direction:column}.tabs{gap:5px}.tabs .btn{padding:10px 6px}.checks{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="root"></div><script type="text/babel">const{useState,useEffect}=React;firebase.initializeApp(firebaseConfig);const db=firebase.firestore();try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){};
const PRE=[{k:'allergies',label:'Allergies',na:false},{k:'tt',label:'TT',sub:'Subject: 0.5 ml IM stat',na:true},{k:'testDose',label:'Test Dose',sub:'Subject: Injection Xylo test dose',na:true},{k:'attender',label:'Attender',na:true},{k:'ornaments',label:'Ornaments',na:true},{k:'consent',label:'Consent',na:false}];
const POST=[{k:'otNotes',label:'OT Notes'},{k:'hpe',label:'HPE'},{k:'culture',label:'Culture'},{k:'prescription',label:'Rx'}];
const RX=[['amoxyclav','Tab Amoxyclav 625 mg','BD for 5 days'],['cefu','Tab CefU 200 mg','BD for 5 days'],['paracetamol','Tab Paracetamol 500 mg','BD for 5 days'],['pantop','Tab Pantop 40 mg','OD for 5 days'],['chymoral','Tab Chymoral Forte','1 tab TDS for 5 days']];
const INS=[['cd','C&D daily'],['soak','Watch for soakage'],['warning','Review if there is warning has explained']];
function speak(t){if(!('speechSynthesis'in window))return alert('Tamil text-to-speech is not available');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';u.rate=.82;let v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('ta'));if(v)u.voice=v;speechSynthesis.speak(u)}
function announce(p,post){speak(`திரு ${p.name} அவர்கள் ${post?'Dressing Room':'Minor OT Room'}க்கு வரவும்.`)}
function fileData(file,max=500){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function crc8(a){let c=0;for(let b of a){c^=b;for(let i=0;i<8;i++)c=(c&128)?((c<<1)^7)&255:(c<<1)&255}return c}function pkt(cmd,data=[]){let d=[...data];return new Uint8Array([81,120,cmd,0,d.length&255,(d.length>>8)&255,...d,crc8(d),255])}let printerChar=null;const wait=m=>new Promise(r=>setTimeout(r,m));
async function getPrinter(){if(printerChar)return printerChar;if(!navigator.bluetooth)throw Error('Web Bluetooth is not supported. Use Chrome on Android.');let d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['0000ae30-0000-1000-8000-00805f9b34fb']}),s=await d.gatt.connect(),ss=await s.getPrimaryServices(),svc=ss.find(x=>x.uuid.toLowerCase().includes('ae30'));if(!svc)throw Error('AE30 print service not found');let cs=await svc.getCharacteristics();printerChar=cs.find(x=>x.uuid.toLowerCase().includes('ae01')&&x.properties.writeWithoutResponse)||cs.find(x=>x.uuid.toLowerCase().includes('ae01')&&x.properties.write);if(!printerChar)throw Error('AE01 writable BLE channel not found');return printerChar}
async function send(ch,b){if(ch.properties.writeWithoutResponse&&ch.writeValueWithoutResponse)return ch.writeValueWithoutResponse(b);return ch.writeValue(b)}
function canvas(lines){let c=document.createElement('canvas'),ctx=c.getContext('2d'),W=384;c.width=W;c.height=Math.max(120,lines.length*34+40);ctx.fillStyle='white';ctx.fillRect(0,0,W,c.height);ctx.fillStyle='black';ctx.textAlign='center';let y=30;for(let l of lines){ctx.font=l.bold?'bold 25px Arial':'21px Arial';ctx.fillText(String(l.text||''),W/2,y);y+=l.space||32}return c}
function rows(c){let x=c.getContext('2d'),W=384,H=c.height,a=x.getImageData(0,0,W,H).data,o=[];for(let y=0;y<H;y++){let r=new Uint8Array(48);for(let q=0;q<W;q++)if(a[(y*W+q)*4]<150)r[q>>3]|=1<<(q&7);o.push(r)}return o}
async function printLines(lines){let ch=await getPrinter();await send(ch,pkt(175,[16,0]));await wait(60);await send(ch,pkt(164,[51]));await wait(60);await send(ch,pkt(190,[0]));await wait(60);await send(ch,pkt(166,[170,85,23,56,68,95,95,95,68,56,44]));for(let r of rows(canvas(lines))){await send(ch,pkt(162,[...r]));await wait(2)}await send(ch,pkt(166,[170,85,23,0,0,0,0,0,0,23,17]));await wait(50);await send(ch,pkt(189,[24]))}
async function printPatient(p){await printLines([{text:'MINOR OT',bold:true,space:36},{text:p.token,bold:true,space:36},{text:`Name: ${p.name}`},{text:`Age/Sex: ${p.age}/${p.sex}`},{text:`OPD: ${p.opd}`},{text:`Diagnosis: ${p.diagnosis}`},{text:`Site: ${p.site||'-'}`},{text:`Procedure: ${p.procedure}`},{text:p.room,space:36}])}
async function printNotes(p,n){let l=[{text:'MINOR OT',bold:true},{text:`OT NOTES - ${p.token}`,bold:true},{text:`${p.name} ${p.age}/${p.sex}`},{text:`Diagnosis: ${p.diagnosis}`},{text:`Site: ${p.site||'-'}`},{text:`Procedure: ${n.procedureDone||p.procedure}`},{text:`Findings: ${n.findings||'-'}`},{text:`Details: ${n.details||'-'}`},{text:`Complications: ${n.complications||'Nil'}`},{text:'PRESCRIPTION',bold:true}];RX.filter(r=>n.rx?.[r[0]]).forEach(r=>l.push({text:`${r[1]} ${r[2]}`,space:28}));l.push({text:'INSTRUCTIONS',bold:true});INS.filter(i=>n.instructions?.[i[0]]).forEach(i=>l.push({text:i[1]}));if(n.additional)l.push({text:n.additional});await printLines(l)}
function App(){const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const[date,setDate]=useState(today()),[tab,setTab]=useState('reg'),[step,setStep]=useState(1),[patients,setPatients]=useState([]),[form,setForm]=useState({name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',isSeptic:false,fever:false,bleeding:false,pain:false,shock:false}),[photo,setPhoto]=useState(''),[curr,setCurr]=useState(null),[saving,setSaving]=useState(false),[msg,setMsg]=useState(''),[notes,setNotes]=useState(null),[record,setRecord]=useState(null),[dataView,setDataView]=useState(null);const day=db.collection('minorOT').doc(date),col=day.collection('patients');useEffect(()=>col.orderBy('time').onSnapshot(s=>setPatients(s.docs.map(d=>({id:d.id,...d.data()}))),e=>setMsg(e.message)),[date]);const stats={total:patients.length,reg:patients.filter(p=>p.status==='registered').length,ready:patients.filter(p=>p.status==='ready').length,prog:patients.filter(p=>p.status==='in-progress').length,done:patients.filter(p=>p.status==='completed').length};const reset=()=>{setForm({name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',isSeptic:false,fever:false,bleeding:false,pain:false,shock:false});setPhoto('');setCurr(null);setStep(1)};const next1=()=>{if(!form.name||!form.age||!form.opd||!form.diagnosis||!form.site||!form.procedure)return alert('Fill Name, Age, OPD, Diagnosis, Site and Procedure');setStep(2)};const generate=()=>{let urgent=form.fever||form.bleeding||form.pain||form.shock,prefix=form.isSeptic?'D':'OT',room=form.isSeptic?'Dressing':`Minor OT ${(patients.filter(p=>!p.isSeptic).length%3)+1}`;setCurr({...form,token:`${prefix}-PREVIEW`,priority:urgent?'urgent':'routine',room,status:'registered',time:new Date().toISOString(),preOp:Object.fromEntries(PRE.map(x=>[x.k,false])),preOpNA:{tt:false,testDose:false,attender:false,ornaments:false},postOp:Object.fromEntries(POST.map(x=>[x.k,false])),preOpPhoto:photo});setStep(3)};const confirm=async()=>{if(saving)return;setSaving(true);try{let ref=col.doc(),field=curr.isSeptic?'septicCount':'nonSepticCount',prefix=curr.isSeptic?'D':'OT';await db.runTransaction(async tx=>{let ds=await tx.get(day),n=(ds.exists?ds.data()[field]||0:0)+1;tx.set(day,{[field]:n},{merge:true});tx.set(ref,{...curr,token:`${prefix}-${String(n).padStart(3,'0')}`})});setMsg('Patient added');reset()}catch(e){setMsg(e.message)}setSaving(false)};const upd=(p,d)=>col.doc(p.id).update(d).catch(e=>setMsg(e.message));const preDone=p=>PRE.every(i=>p.preOp?.[i.k]||(!i.na?false:p.preOpNA?.[i.k]));const setPre=(p,i,v)=>{let q={...p,preOp:{...p.preOp,[i.k]:v}},d={[`preOp.${i.k}`]:v};if(preDone(q))d.status='ready';upd(p,d)};const setNA=(p,k,v)=>{let q={...p,preOpNA:{...p.preOpNA,[k]:v}},d={[`preOpNA.${k}`]:v};if(preDone(q))d.status='ready';upd(p,d)};const upload=async(e,kind,p)=>{let f=e.target.files?.[0];if(!f)return;try{let d=await fileData(f);if(kind==='pre')setPhoto(d);else await upd(p,{postOpPhoto:d})}catch(e){setMsg('Photo upload failed')}};const print=async p=>{try{setMsg('Connecting to B21…');await printPatient(p);setMsg(`Printed ${p.token} successfully`)}catch(e){setMsg('Print failed: '+e.message)}};const clearAll=async()=>{if(!confirm('Clear all data for '+date+'?'))return;let b=db.batch();patients.forEach(p=>b.delete(col.doc(p.id)));await b.commit();await day.set({septicCount:0,nonSepticCount:0},{merge:true});setMsg('Date cleared')};const openData=p=>setDataView(p);return <div className="app"><div className="card"><div className="head"><div><div className="title">Minor OT</div><div className="muted">Selected date: {date}</div></div><div className="row"><input className="input" style={{width:165}} type="date" value={date} onChange={e=>setDate(e.target.value)}/><button className="btn gray" onClick={()=>setDate(today())}>Today</button><button className="btn red" onClick={clearAll}>🗑️ Clear All Data</button></div></div><div className="tabs"><button className={`btn ${tab==='reg'?'blue':'gray'}`} onClick={()=>setTab('reg')}>Registration</button><button className={`btn ${tab==='pre'?'green':'gray'}`} onClick={()=>setTab('pre')}>Pre-Op</button><button className={`btn ${tab==='list'?'purple':'gray'}`} onClick={()=>setTab('list')}>List</button><button className={`btn ${tab==='records'?'yellow':'gray'}`} onClick={()=>setTab('records')}>Records</button></div><div className="stats"><div className="stat sb"><div className="n">{stats.total}</div><div className="l">Total</div></div><div className="stat sy"><div className="n">{stats.reg}</div><div className="l">Reg</div></div><div className="stat sg"><div className="n">{stats.ready}</div><div className="l">Ready</div></div><div className="stat sp"><div className="n">{stats.prog}</div><div className="l">Progress</div></div><div className="stat sgr"><div className="n">{stats.done}</div><div className="l">Done</div></div></div></div>
{tab==='reg'&&<div className="card">{step===1&&<><h2>Patient Info</h2><input className="input" placeholder="Name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/><div className="g3" style={{marginTop:9}}><input className="input" type="number" placeholder="Age" value={form.age} onChange={e=>setForm({...form,age:e.target.value})}/><select className="input" value={form.sex} onChange={e=>setForm({...form,sex:e.target.value})}><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select><select className="input" value={form.opd} onChange={e=>setForm({...form,opd:e.target.value})}><option value="">OPD</option><option>7A</option><option>7B</option><option>7C</option><option>7D</option></select></div><div className="g2" style={{marginTop:9}}><input className="input" placeholder="Diagnosis" value={form.diagnosis} onChange={e=>setForm({...form,diagnosis:e.target.value})}/><input className="input" placeholder="Site" value={form.site} onChange={e=>setForm({...form,site:e.target.value})}/></div><div className="row" style={{marginTop:9}}><input className="input" placeholder="Procedure" value={form.procedure} onChange={e=>setForm({...form,procedure:e.target.value})}/><button className="btn gray" onClick={()=>speak(`Procedure ${form.procedure}`)}>🔊</button></div><button className="btn blue" style={{width:'100%',marginTop:10}} onClick={next1}>Next</button><div className="section"><b>Registered Queue ({patients.filter(p=>p.status==='registered').length})</b>{patients.filter(p=>p.status==='registered').map(p=><div className="patient" key={p.id}><div className="ptop"><div><span className={`token ${p.isSeptic?'tokr':'tokg'}`}>{p.token}</span> <b>{p.name}</b><div className="muted">{p.age}/{p.sex} · {p.opd} · {p.diagnosis} · {p.site}</div></div><div className="row"><button className="btn blue smallbtn" onClick={()=>print(p)}>🖨️ Print</button><button className="btn green smallbtn" onClick={()=>announce(p,false)}>🔊</button><button className="btn yellow smallbtn" onClick={()=>setRecord(p)}>Record</button></div></div></div>)}</div></>}{step===2&&<><h2>Triage</h2><div className="g2"><button className={`btn ${!form.isSeptic?'green':'gray'}`} onClick={()=>setForm({...form,isSeptic:false})}>🟢 NON-SEPTIC</button><button className={`btn ${form.isSeptic?'red':'gray'}`} onClick={()=>setForm({...form,isSeptic:true})}>🔴 SEPTIC</button></div><div className="section triage"><b>Red Flags</b>{[['fever','Fever'],['bleeding','Bleeding'],['pain','Severe Pain'],['shock','Shock']].map(x=><label className="check" key={x[0]}><input type="checkbox" checked={form[x[0]]} onChange={e=>setForm({...form,[x[0]]:e.target.checked})}/>{x[1]}</label>)}</div><label className="btn green" style={{display:'block',textAlign:'center'}}>📷 Upload Pre-Op Photo<input hidden type="file" accept="image/*" capture="environment" onChange={e=>upload(e,'pre')}/></label>{photo&&<img className="photo" src={photo}/>}<div className="row" style={{marginTop:10}}><button className="btn gray" onClick={()=>setStep(1)}>Back</button><button className="btn blue" style={{flex:1}} onClick={generate}>Generate Token</button></div></>}{step===3&&curr&&<><div style={{textAlign:'center'}}><span className="token tokg" style={{fontSize:34,padding:'14px 25px'}}>{curr.token}</span></div><div className="section"><div className="g2"><div>Name: <b>{curr.name}</b></div><div>Age/Sex: <b>{curr.age}/{curr.sex}</b></div><div>OPD: <b>{curr.opd}</b></div><div>Room: <b>{curr.room}</b></div><div>Diagnosis: <b>{curr.diagnosis}</b></div><div>Site: <b>{curr.site}</b></div><div>Procedure: <b>{curr.procedure}</b></div></div>{curr.preOpPhoto&&<><div><button className="linkbtn" onClick={()=>window.open(curr.preOpPhoto,'_blank')}>Open Pre-Op Photo</button></div><img className="photo" src={curr.preOpPhoto}/></>}</div><div className="row"><button className="btn green" onClick={()=>print(curr)}>🖨️ Print</button><button className="btn green" onClick={()=>announce(curr,false)}>🔊 Announce</button><button className="btn blue" onClick={confirm} disabled={saving}>{saving?'Saving…':'Add to Queue'}</button><button className="btn gray" onClick={reset}>New</button></div></>}</div>}
{tab==='pre'&&<div className="card"><h2>Pre-Op — {date}</h2>{patients.filter(p=>['registered','ready'].includes(p.status)).map(p=>{let done=preDone(p);return <div className="patient" key={p.id}><div className="ptop"><div><span className={`token ${p.isSeptic?'tokr':'tokg'}`}>{p.token}</span> <b>{p.name}</b><div className="muted">{p.age}/{p.sex} · {p.opd} · {p.diagnosis} · Site: {p.site||'-'}</div></div><div className="row"><span className={`badge ${p.status==='ready'?'green':'yellow'}`}>{p.status.toUpperCase()}</span><button className="btn blue smallbtn" onClick={()=>print(p)}>🖨️</button><button className="btn green smallbtn" onClick={()=>announce(p,false)}>🔊</button><button className="btn yellow smallbtn" onClick={()=>setRecord(p)}>Record</button></div></div><div className="section pre"><div className="checks">{PRE.map(i=><div className="check" key={i.k}><label style={{display:'flex',gap:8,flex:1}}><input type="checkbox" checked={!!p.preOp?.[i.k]} onChange={e=>setPre(p,i,e.target.checked)}/><span><b>{i.label}</b>{i.sub&&<div className="muted">{i.sub}</div>}</span></label>{i.na&&<label><input type="checkbox" checked={!!p.preOpNA?.[i.k]} onChange={e=>setNA(p,i.k,e.target.checked)}/> NA</label>}</div>)}</div></div><div className="g3"><button className="btn yellow" onClick={()=>upd(p,{status:'registered'})}>Reg</button><button className="btn green" disabled={!done} onClick={()=>upd(p,{status:'ready'})}>Ready</button><button className="btn purple" disabled={!done} onClick={()=>upd(p,{status:'in-progress'})}>Start</button></div></div>})}</div>}
{tab==='list'&&<div className="card"><h2>Post-Op / List — {date}</h2>{patients.map(p=>{let done=POST.every(i=>p.postOp?.[i.k]);return <div className="patient" key={p.id}><div className="ptop"><div><span className={`token ${p.isSeptic?'tokr':'tokg'}`}>{p.token}</span> <b>{p.name}</b><div className="muted">{p.age}/{p.sex} · {p.opd} · {p.diagnosis} · Site: {p.site||'-'}</div></div><div className="row"><button className="btn blue smallbtn" onClick={()=>print(p)}>🖨️</button><button className="btn green smallbtn" onClick={()=>announce(p,true)}>🔊 Dressing</button><button className="btn yellow smallbtn" onClick={()=>setRecord(p)}>Record</button></div></div>{p.status==='in-progress'&&<><div className="section post"><label className="btn purple">📷 Upload Post-Op Photo<input hidden type="file" accept="image/*" capture="environment" onChange={e=>upload(e,'post',p)}/></label>{p.postOpPhoto&&<div><button className="linkbtn" onClick={()=>window.open(p.postOpPhoto,'_blank')}>Open Post-Op Photo</button><br/><img className="photo" src={p.postOpPhoto}/></div>}<div className="checks">{POST.map(i=><div className="check" key={i.k}><label style={{display:'flex',gap:8,flex:1}}><input type="checkbox" checked={!!p.postOp?.[i.k]} onChange={e=>upd(p,{[`postOp.${i.k}`]:e.target.checked})}/><b>{i.label}</b></label>{i.k==='otNotes'&&<button className="btn purple smallbtn" onClick={()=>setNotes({p,data:p.otNotesData||{rx:{},instructions:{}}})}>Open</button>}</div>)}</div></div></>}<div className="g2"><button className="btn gray" onClick={()=>upd(p,{status:'registered'})}>Reg</button><button className="btn green" onClick={()=>upd(p,{status:'ready'})}>Ready</button><button className="btn purple" onClick={()=>upd(p,{status:'in-progress'})}>Prog</button><button className="btn gray" disabled={!done} onClick={()=>upd(p,{status:'completed',end:new Date().toISOString()})}>Done</button></div></div>})}</div>}
{tab==='records'&&<div className="card"><h2>Records — {date}</h2><div className="muted">Use the date selector above to access previous days.</div><div className="history">{patients.length===0?<p>No records for this date.</p>:patients.map(p=><div className="patient" key={p.id}><div className="ptop"><div><span className={`token ${p.isSeptic?'tokr':'tokg'}`}>{p.token}</span> <b>{p.name}</b><div className="muted">{p.age}/{p.sex} · {p.opd} · {p.diagnosis} · {p.site||'-'}</div></div><div className="row"><button className="btn yellow smallbtn" onClick={()=>setRecord(p)}>View Record</button><button className="btn blue smallbtn" onClick={()=>setDataView(p)}>View Data</button>{p.preOpPhoto&&<button className="btn green smallbtn" onClick={()=>window.open(p.preOpPhoto,'_blank')}>Pre-Op Photo</button>}{p.postOpPhoto&&<button className="btn purple smallbtn" onClick={()=>window.open(p.postOpPhoto,'_blank')}>Post-Op Photo</button>}{p.otNotesData&&<button className="btn gray smallbtn" onClick={()=>setNotes({p,data:p.otNotesData})}>OT Notes</button>}</div></div></div>)}</div></div>}
{record&&<div className="modal" onClick={()=>setRecord(null)}><div className="modalbox" onClick={e=>e.stopPropagation()}><div className="modalhead"><h2>Patient Record — {record.token}</h2><button className="btn gray" onClick={()=>setRecord(null)}>✕</button></div><div className="section"><b>{record.name}</b> · {record.age}/{record.sex}<br/>OPD: {record.opd}<br/>Diagnosis: {record.diagnosis}<br/>Site: {record.site||'-'}<br/>Procedure: {record.procedure}<br/>Room: {record.room||'-'}<br/>Status: {record.status}</div><div className="row">{record.preOpPhoto&&<button className="btn green" onClick={()=>window.open(record.preOpPhoto,'_blank')}>Open Pre-Op Photo</button>}{record.postOpPhoto&&<button className="btn purple" onClick={()=>window.open(record.postOpPhoto,'_blank')}>Open Post-Op Photo</button>}<button className="btn blue" onClick={()=>setDataView(record)}>View Data</button>{record.otNotesData&&<button className="btn yellow" onClick={()=>setNotes({p:record,data:record.otNotesData})}>Open OT Notes</button>}</div><div className="section"><b>Pre-Op</b><pre className="json">{JSON.stringify({preOp:record.preOp,preOpNA:record.preOpNA},null,2)}</pre></div></div></div>}
{dataView&&<div className="modal" onClick={()=>setDataView(null)}><div className="modalbox" onClick={e=>e.stopPropagation()}><div className="modalhead"><h2>Patient Data — {dataView.token}</h2><button className="btn gray" onClick={()=>setDataView(null)}>✕</button></div><pre className="json">{JSON.stringify(dataView,(k,v)=>k==='id'?v:v,2)}</pre><div className="row" style={{marginTop:10}}><button className="btn blue" onClick={()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(dataView,null,2)],{type:'application/json'}));a.download=`${dataView.token}-record.json`;a.click()}}>Download Data</button></div></div></div>}
{notes&&<OTNotes p={notes.p} initial={notes.data} close={()=>setNotes(null)} save={async d=>{await upd(notes.p,{otNotesData:d,'postOp.otNotes':true});setNotes(null);setMsg('OT Notes saved')}} print={async d=>{try{await printNotes(notes.p,d);setMsg('OT Notes printed')}catch(e){setMsg('Print failed: '+e.message)}}}/>} {msg&&<div onClick={()=>setMsg('')} style={{position:'fixed',left:15,right:15,bottom:15,zIndex:2000;background:#166534;color:#fff;padding:14px;border-radius:13px;text-align:center;font-weight:850}}>{msg}</div>}</div>}
function OTNotes({p,initial,close,save,print}){const[d,setD]=useState({...initial,rx:initial?.rx||{},instructions:initial?.instructions||{}});const set=(k,v)=>setD({...d,[k]:v});return <div className="modal" onClick={close}><div className="modalbox" onClick={e=>e.stopPropagation()}><div className="modalhead"><h2>OT Notes — {p.token}</h2><button className="btn gray" onClick={close}>✕</button></div><input className="input" placeholder="Procedure done" value={d.procedureDone||''} onChange={e=>set('procedureDone',e.target.value)}/><textarea className="input" rows="2" style={{marginTop:8}} placeholder="Findings" value={d.findings||''} onChange={e=>set('findings',e.target.value)}/><textarea className="input" rows="3" style={{marginTop:8}} placeholder="Procedure details" value={d.details||''} onChange={e=>set('details',e.target.value)}/><input className="input" style={{marginTop:8}} placeholder="Complications (default Nil)" value={d.complications||''} onChange={e=>set('complications',e.target.value)}/><h3>Prescription</h3>{RX.map(r=><label className="rx" key={r[0]}><input type="checkbox" checked={!!d.rx[r[0]]} onChange={e=>set('rx',{...d.rx,[r[0]]:e.target.checked})}/><span><b>{r[1]}</b><br/>{r[2]}</span></label>)}<h3>Instructions</h3>{INS.map(i=><label className="rx" key={i[0]}><input type="checkbox" checked={!!d.instructions[i[0]]} onChange={e=>set('instructions',{...d.instructions,[i[0]]:e.target.checked})}/><span>{i[1]}</span></label>)}<textarea className="input" rows="2" style={{marginTop:8}} placeholder="Additional instructions" value={d.additional||''} onChange={e=>set('additional',e.target.value)}/><div className="row" style={{marginTop:12}}><button className="btn purple" onClick={()=>speak(`Procedure ${d.procedureDone||p.procedure}. ${d.findings||''}. ${d.details||''}`)}>🔊 Speak</button><button className="btn green" onClick={()=>save(d)}>Save</button><button className="btn blue" onClick={()=>print(d)}>🖨️ Print</button></div></div></div>}
ReactDOM.render(<App/>,document.getElementById('root'));</script></body></html>
