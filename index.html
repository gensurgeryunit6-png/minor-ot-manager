ab==='records'?'active':''}" data-tab="records">Records</button></div><div class="stats">${[['Total',c[0]],['Registered',c[1]],['Ready',c[2]],['Progress',c[3]],['Done',c[4]]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div></div>`}function reg(){if(step===3)return token();if(step===2)return safety();return`<div class="content"><div class="head"><div><h2>New patient</h2><p>Quick registration for the Minor OT workflow.</p></div><span class="badge">Step 1</span></div><div class="field"><label>Patient name</label><input id="name" value="${esc(form.name)}" placeholder="Full name"></div><div class="grid3"><div class="field"><label>Age</label><input id="age" type="number" value="${esc(form.age)}" placeholder="Age"></div><div class="field"><label>Sex</label><select id="sex"><option value="M" ${form.sex==='M'?'selected':''}>Male</option><option value="F" ${form.sex==='F'?'selected':''}>Female</option><option value="O" ${form.sex==='O'?'selected':''}>Other</option></select></div><div class="field"><label>OPD</label><select id="opd"><option value="">Select OPD</option>${['7A','7B','7C','7D'].map(x=>`<option ${form.opd===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label>Diagnosis</label><input id="diagnosis" value="${esc(form.diagnosis)}" placeholder="Diagnosis"></div><div class="field"><label>Site</label><input id="site" value="${esc(form.site)}" placeholder="Operative site"></div></div><div class="field"><label>Procedure</label><input id="procedure" value="${esc(form.procedure)}" placeholder="Planned procedure"></div><button class="btn primary full" id="next">Continue to safety check</button></div>`}function safety(){return`<div class="content"><div class="head"><div><h2>Safety check</h2><p>Triage and pre‑operative photograph.</p></div><span class="badge">Step 2</span></div><div class="triage"><button class="${!form.isSeptic?'non':''}" id="non">● Non‑septic</button><button class="${form.isSeptic?'sep':''}" id="sep">● Septic</button></div><div class="flags"><b>RED FLAGS</b><div class="checks">${[['fever','Fever'],['bleeding','Bleeding'],['pain','Severe pain'],['shock','Shock']].map(x=>`<label class="check"><input id="${x[0]}" type="checkbox" ${form[x[0]]?'checked':''}>${x[1]}</label>`).join('')}</div></div><label class="upload">📷 Upload pre‑op photo<input id="prePhoto" type="file" accept="image/*" capture="environment"></label>${prePhoto?`<img class="photo" src="${prePhoto}"><button class="link" id="openPre">Open uploaded photo</button>`:''}<div class="actions"><button class="btn soft" id="back">Back</button><button class="btn primary full" id="generate">Generate token</button></div></div>`}function token(){return`<div class="content"><div class="head"><div><h2>Token ready</h2><p>Announce or print this patient token.</p></div></div><div class="ticket"><div class="tickettop"><div class="ticketicon">▤</div><div class="ticketlabel">your token number:</div><div class="ticketno">${esc(current.token)}</div><div class="waiting">number of customers waiting: <b>${patients.filter(p=>p.status!=='completed').length}</b></div></div><div class="ticketbody"><div class="ticketgrid">${[['Patient',current.name],['Age / Sex',current.age+' / '+current.sex],['OPD',current.opd],['Room',current.room],['Diagnosis',current.diagnosis],['Site',current.site],['Procedure',current.procedure]].map(x=>`<div class="kv"><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('')}</div></div><div class="ticketbottom"><span>Date: ${date}</span><span>Time: ${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span></div></div><div class="actions"><button class="btn green" id="announce">🔊 Announce</button><button class="btn blue" id="print">🖨 Print token</button></div><div class="actions"><button class="btn primary" id="add">Add to OT queue</button><button class="btn soft" id="new">New patient</button></div></div>`}function predone(p){return PRE.every(x=>p.preO
