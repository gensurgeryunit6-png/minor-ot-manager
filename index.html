*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#eff6ff;padding:8px;color:#111827}.container{max-width:1024px;margin:auto}.card,.patient-card{background:#fff;border-radius:16px;box-shadow:0 2px 8px #00000012;padding:14px;margin-bottom:12px}.header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.title{font-size:28px;font-weight:800;color:#2563eb}.date{font-size:14px;color:#6b7280}.btn{padding:10px 13px;border:0;border-radius:11px;font-weight:800;cursor:pointer;font-size:14px}.btn:disabled{background:#e5e7eb!important;color:#9ca3af!important}.blue{background:#3b82f6;color:#fff}.green{background:#22c55e;color:#fff}.purple{background:#a855f7;color:#fff}.yellow{background:#eab308;color:#fff}.red{background:#ef4444;color:#fff}.orange{background:#f97316;color:#fff}.gray{background:#f3f4f6;color:#1f2937}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs .btn{flex:1}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stat{padding:9px 4px;border-radius:11px;text-align:center;border:1px solid}.sv{font-size:22px;font-weight:900}.sl{font-size:12px;font-weight:700}.sb{background:#dbeafe;color:#1e40af}.sy{background:#fef3c7;color:#92400e}.sg{background:#d1fae5;color:#065f46}.sp{background:#e9d5ff;color:#6b21a8}.sgr{background:#f3f4f6;color:#374151}.form-input{width:100%;padding:12px;border:2px solid #d1d5db;border-radius:11px;font-size:16px;background:#fff}.form-group{margin-bottom:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.section{padding:12px;border-radius:14px;margin:10px 0}.triage{background:#fef2f2;border:2px solid #fecaca}.prebox{background:#f0fdf4;border:2px solid #86efac}.postbox{background:#faf5ff;border:2px solid #d8b4fe}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.checkrow{display:flex;align-item const {useState,useEffect}=React;
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
const PRE_ITEMS=[{k:'allergies',label:'Allergies',na:false},{k:'tt',label:'TT',sub:'Subject: 0.5 ml IM stat',na:true},{k:'testDose',label:'Test Dose',sub:'Subject: Injection Xylo test dose',na:true},{k:'attender',label:'Attender',na:true},{k:'ornaments',label:'Ornaments',na:true},{k:'consent',label:'Consent',na:false}];
const POST_ITEMS=[{k:'otNotes',label:'OT Notes'},{k:'hpe',label:'HPE'},{k:'pusCulture',label:'Culture'},{k:'prescription',label:'Rx'}];
const RX=[['amoxyclav','Tab Amoxyclav 625 mg','BD for 5 days'],['cefu','Tab CefU 200 mg','BD for 5 days'],['paracetamol','Tab Paracetamol 500 mg','BD for 5 days'],['pantop','Tab Pantop 40 mg','OD for 5 days'],['chymoral','Tab Chymoral Forte','1 tab TDS for 5 days']];
const INSTR=[['cd','C&D daily'],['soak','Watch for soakage'],['warning','Review if there is warning has explained']];
function speakTamil(text){if(!('speechSynthesis'in window)){alert('Text-to-speech is not available on this device');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ta-IN';u.rate=.82;u.pitch=1;const voices=window.speechSynthesis.getVoices();const ta=voices.find(v=>(v.lang||'').toLowerCase().startsWith('ta'));if(ta)u.voice=ta;window.speechSynthesis.speak(u)}
function announce(p,post){speakTamil(`திரு ${p.name} அவர்கள் ${post?'Dressing Room':'Minor OT Room'}க்கு வரவும்.`)}
function dataUrlFromFile(file,max=360){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
const CRC=[0x00,0x07,0x0e,0x09,0x1c,0x1b,0x12,0x15,0x38,0x3f,0x36,0x31,0x24,0x23,0x2a,0x2d,0x70,0x77,0x7e,0x79,0x6c,0x6b,0x62,0x65,0x48,0x4f,0x46,0x41,0x54,0x53,0x5a,0x5d,0xe0,0xe7,0xee,0xe9,0xfc,0xfb,0xf2,0xf5,0xd8,0xdf,0xd6,0xd1,0xc4,0xc3,0xca,0xcd,0x90,0x97,0x9e,0x99,0x8c,0x8b,0x82,0x85,0xa8,0xaf,0xa6,0xa1,0xb4,0xb3,0xba,0xbd,0xc7,0xc0,0xc9,0xce,0xdb,0xdc,0xd5,0xd2,0xff,0xf8,0xf1,0xf6,0xe3,0xe4,0xed,0xea,0xb7,0xb0,0xb9,0xbe,0xab,0xac,0xa5,0xa2,0x8f,0x88,0x81,0x86,0x93,0x94,0x9d,0x9a,0x27,0x20,0x29,0x2e,0x3b,0x3c,0x35,0x32,0x1f,0x18,0x11,0x16,0x03,0x04,0x0d,0x0a,0x57,0x50,0x59,0x5e,0x4b,0x4c,0x45,0x42,0x6f,0x68,0x61,0x66,0x73,0x74,0x7d,0x7a,0x89,0x8e,0x87,0x80,0x95,0x92,0x9b,0x9c,0xb1,0xb6,0xbf,0xb8,0xad,0xaa,0xa3,0xa4,0xf9,0xfe,0xf7,0xf0,0xe5,0xe2,0xeb,0xec,0xc1,0xc6,0xcf,0xc8,0xdd,0xda,0xd3,0xd4,0x69,0x6e,0x67,0x60,0x75,0x72,0x7b,0x7c,0x51,0x56,0x5f,0x58,0x4d,0x4a,0x43,0x44,0x19,0x1e,0x17,0x10,0x05,0x02,0x0b,0x0c,0x21,0x26,0x2f,0x28,0x3d,0x3a,0x33,0x34,0x4e,0x49,0x40,0x47,0x52,0x55,0x5c,0x5b,0x76,0x71,0x78,0x7f,0x6a,0x6d,0x64,0x63,0x3e,0x39,0x30,0x37,0x22,0x25,0x2c,0x2b,0x06,0x01,0x08,0x0f,0x1a,0x1d,0x14,0x13,0xae,0xa9,0xa0,0xa7,0xb2,0xb5,0xbc,0xbb,0x96,0x91,0x98,0x9f,0x8a,0x8d,0x84,0x83,0xde,0xd9,0xd0,0xd7,0xc2,0xc5,0xcc,0xcb,0xe6,0xe1,0xe8,0xef,0xfa,0xfd,0xf4,0xf3];
const crc8=a=>{let c=0;for(const b of a)c=CRC[(c^b)&255];return c};const pkt=(cmd,data=[])=>{const d=[...data];return new Uint8Array([0x51,0x78,cmd,0,d.length&255,(d.length>>8)&255,...d,crc8(d),0xff])};let writer=null;
async function getPrinter(){if(writer)return writer;if(!navigator.bluetooth)throw new Error('Web Bluetooth is not supported. Use Chrome on Android.');const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['0000ae30-0000-1000-8000-00805f9b34fb']});const server=await dev.gatt.connect();const services=await server.getPrimaryServices();const service=services.find(s=>s.uuid.toLowerCase().includes('ae30'));if(!service)throw new Error('AE30 print service not found');const chars=await service.getCharacteristics();const ch=chars.find(c=>c.uuid.toLowerCase().includes('ae01')&&c.properties.writeWithoutResponse)||chars.find(c=>c.uuid.toLowerCase().includes('ae01')&&c.properties.write);if(!ch)throw new Error('AE01 writable channel not found');writer=ch;return writer}
const delay=ms=>new Promise(r=>setTimeout(r,ms));async function sendPacket(ch,data){if(ch.properties.writeWithoutResponse&&ch.writeValueWithoutResponse)return ch.writeValueWithoutResponse(data);return ch.writeValue(data)}
function makeCanvas(lines){const W=384,c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=W;c.height=Math.max(120,lines.length*34+40);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#000';ctx.textAlign='center';let y=30;for(const l of lines){ctx.font=l.bold?'bold 25px Arial':'21px Arial';ctx.fillText(String(l.text||''),W/2,y);y+=l.space||32}return c}
function canvasRows(c){const ctx=c.getContext('2d'),W=384,H=c.height,img=ctx.getImageData(0,0,W,H).data,rows=[];for(let y=0;y<H;y++){const row=new Uint8Array(48);for(let x=0;x<W;x++){const i=(y*W+x)*4;if(img[i]<150)row[x>>3]|=1<<(x&7)}rows.push(row)}return rows}
async function printLines(lines){const ch=await getPrinter();await sendPacket(ch,pkt(0xAF,[0x10,0x00]));await delay(60);await sendPacket(ch,pkt(0xA4,[0x33]));await delay(60);await sendPacket(ch,pkt(0xBE,[0x00]));await delay(60);await sendPacket(ch,pkt(0xA6,[0xaa,0x55,0x17,0x38,0x44,0x5f,0x5f,0x5f,0x44,0x38,0x2c]));const rows=canvasRows(makeCanvas(lines));for(const row of rows){await sendPacket(ch,pkt(0xA2,[...row]));await delay(2)}await sendPacket(ch,pkt(0xA6,[0xaa,0x55,0x17,0,0,0,0,0,0,0x17,0x11]));await delay(50);await sendPacket(ch,pkt(0xBD,[0x18]))}
async function printPatient(p){await printLines([{text:'MINOR OT',bold:true,space:36},{text:p.token,bold:true,space:36},{text:`Name: ${p.name}`},{text:`Age/Sex: ${p.age}/${p.sex}`},{text:`OPD: ${p.opd}`},{text:`Diagnosis: ${p.diagnosis}`},{text:`Procedure: ${p.procedure}`},{text:p.room,space:36}])}
async function printNotes(p,n){const lines=[{text:'MINOR OT',bold:true},{text:`OT NOTES - ${p.token}`,bold:true},{text:`${p.name}  ${p.age}/${p.sex}`},{text:`Procedure: ${n.procedureDone||p.procedure}`},{text:`Findings: ${n.findings||'-'}`},{text:`Details: ${n.details||'-'}`},{text:`Complications: ${n.complications||'Nil'}`},{text:'PRESCRIPTION',bold:true}];RX.filter(x=>n.rx?.[x[0]]).forEach(r=>lines.push({text:`${r[1]} ${r[2]}`,space:28}));lines.push({text:'INSTRUCTIONS',bold:true});INSTR.filter(x=>n.instructions?.[x[0]]).forEach(i=>lines.push({text:i[1]}));if(n.additional)lines.push({text:n.additional});await printLines(lines)}
function App(){
const getDate=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const[date]=useState(getDate);const dayRef=db.collection('minorOT').doc(date),patientsCol=dayRef.collection('patients');const[patients,setPatients]=useState([]),[tab,setTab]=useState('reg'),[step,setStep]=useState(1),[form,setForm]=useState({name:'',age:'',sex:'M',opd:'',diagnosis:'',procedure:'',isSeptic:false,fever:false,bleeding:false,pain:false,shock:false}),[curr,setCurr]=useState(null),[saving,setSaving]=useState(false),[photo,setPhoto]=useState(''),[notes,setNotes]=useState(null),[proc,setProc]=useState(null),[msg,setMsg]=useState('');useEffect(()=>patientsCol.orderBy('time').onSnapshot(s=>setPatients(s.docs.map(d=>({id:d.id,...d.data()}))),console.error),[date]);const stats={total:patients.length,reg:patients.filter(p=>p.status==='registered').length,ready:patients.filter(p=>p.status==='ready').length,prog:patients.filter(p=>p.status==='in-progress').length,done:patients.filter(p=>p.status==='completed').length};const reset=()=>{setForm({name:'',age:'',sex:'M',opd:'',diagnosis:'',procedure:'',isSeptic:false,fever:false,bleeding:false,pain:false,shock:false});setPhoto('');setCurr(null);setStep(1)};const next1=()=>{if(!form.name||!form.age||!form.opd||!form.diagnosis||!form.procedure)return alert('Fill all fields');setStep(2)};const next2=()=>{const urgent=form.fever||form.bleeding||form.pain||form.shock;const prefix=form.isSeptic?'D':'OT';const room=form.isSeptic?'Dressing':`Minor OT ${(patients.filter(p=>!p.isSeptic).length%3)+1}`;setCurr({...form,token:`${prefix}-PREVIEW`,priority:urgent?'urgent':'routine',room,status:'registered',time:new Date().toISOString(),preOp:Object.fromEntries(PRE_ITEMS.map(x=>[x.k,false])),preOpNA:{tt:false,testDose:false,attender:false,ornaments:false},postOp:Object.fromEntries(POST_ITEMS.map(x=>[x.k,false])),preOpPhoto:photo});setStep(3)};const confirm=async()=>{if(saving)return;setSaving(true);try{const ref=patientsCol.doc(),field=curr.isSeptic?'septicCount':'nonSepticCount',prefix=curr.isSeptic?'D':'OT';await db.runTransaction(async tx=>{const ds=await tx.get(dayRef);const next=(ds.exists?ds.data()[field]:0||0)+1;tx.set(dayRef,{[field]:next},{merge:true});tx.set(ref,{...curr,token:`${prefix}-${String(next).padStart(3,'0')}`})});setMsg('Patient added');reset()}catch(e){alert(e.message)}setSaving(false)};const upd=(id,data)=>patientsCol.doc(id).update(data).catch(e=>alert(e.message));const preDone=p=>PRE_ITEMS.every(i=>p.preOp?.[i.k]||(!i.na?false:p.preOpNA?.[i.k]));const updatePre=(p,i,v)=>{const d={[`preOp.${i.k}`]:v};if(preDone({...p,preOp:{...p.preOp,[i.k]:v}}))d.status='ready';upd(p.id,d)};const updateNA=(p,k,v)=>{const d={[`preOpNA.${k}`]:v};if(preDone({...p,preOpNA:{...p.preOpNA,[k]:v}}))d.status='ready';upd(p.id,d)};const updatePost=(p,k,v)=>upd(p.id,{[`postOp.${k}`]:v});const announcePrint=async p=>{try{setMsg('Connecting to printer…');await printPatient(p);setMsg(`Printed ${p.token}`)}catch(e){setMsg(`Print failed: ${e.message}`)}};const handlePhoto=async(e,kind,p)=>{const f=e.target.files?.[0];if(!f)return;try{const d=await dataUrlFromFile(f);if(kind==='pre')setPhoto(d);else await upd(p.id,{postOpPhoto:d})}catch(err){alert('Photo upload failed')}};const clearAll=async()=>{if(!confirm('Clear all data?'))return;const b=db.batch();patients.forEach(p=>b.delete(patientsCol.doc(p.id)));await b.commit();await dayRef.set({septicCount:0,nonSepticCount:0},{merge:true})};
return <div className="container"><div className="card"><div className="header"><div><div className="title">Minor OT</div><div className="date">{new Date().toLocaleDateString()}</div></div><div className="actions"><span className="badge green">● Online</span><button className="btn red" onClick={clearAll}>🗑️ Clear All Data</button></div></div><div className="tabs"><button className={`btn ${tab==='reg'?'blue':'gray'}`} onClick={()=>setTab('reg')}>Registration</button><button className={`btn ${tab==='preop'?'green':'gray'}`} onClick={()=>setTab('preop')}>Pre-Op</button><button className={`btn ${tab==='postop'?'purple':'gray'}`} onClick={()=>setTab('postop')}>List</button></div><div className="stats"><div className="stat sb"><div className="sv">{stats.total}</div><div className="sl">Total</div></div><div className="stat sy"><div className="sv">{stats.reg}</div><div className="sl">Reg</div></div><div className="stat sg"><div className="sv">{stats.ready}</div><div className="sl">Ready</div></div><div className="stat sp"><div className="sv">{stats.prog}</div><div className="sl">Progress</div></div><div className="stat sgr"><div className="sv">{stats.done}</div><div className="sl">Done</div></div></div></div>
{tab==='reg'&&<div className="card">{step===1&&<><h2>Patient Info</h2><div className="form-group"><input className="form-input" placeholder="Name" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div><div className="grid3 form-group"><input className="form-input" type="number" placeholder="Age" value={form.age} onChange={e=>setForm({...form,age:e.target.value})}/><select className="form-input" value={form.sex} onChange={e=>setForm({...form,sex:e.target.value})}><option value="M">Male</option><option value="F">Female</option><option value="O">Other</option></select><select className="form-input" value={form.opd} onChange={e=>setForm({...form,opd:e.target.value})}><option value="">OPD</option><option>7A</option><option>7B</option><option>7C</option><option>7D</option></select></div><div className="form-group"><input className="form-input" placeholder="Diagnosis" value={form.diagnosis} onChange={e=>setForm({...form,diagnosis:e.target.value})}/></div><div className="form-group"><div className="actions"><input className="form-input" placeholder="Procedure" value={form.procedure} onChange={e=>setForm({...form,procedure:e.target.value})}/><button className="btn gray" onClick={()=>setProc({text:form.procedure})}>🔊</button></div></div><button className="btn blue" style={{width:'100%'}} onClick={next1}>Next</button></>}{step===2&&<><h2>Triage</h2><div className="grid2 form-group"><button className={`btn ${!form.isSeptic?'green':'gray'}`} onClick={()=>setForm({...form,isSeptic:false})}>🟢 NON-SEPTIC</button><button className={`btn ${form.isSeptic?'red':'gray'}`} onClick={()=>setForm({...form,isSeptic:true})}>🔴 SEPTIC</button></div><div className="section triage"><b>Red Flags</b>{[['fever','Fever'],['bleeding','Bleeding'],['pain','Severe Pain'],['shock','Shock']].map(x=><label className="checkleft" style={{marginTop:8}} key={x[0]}><input type="checkbox" checked={form[x[0]]} onChange={e=>setForm({...form,[x[0]]:e.target.checked})}/>{x[1]}</label>)}</div><label className="btn green" style={{display:'block',textAlign:'center',marginBottom:10}}>📷 Upload Pre-Op Photo<input className="hidden" type="file" accept="image/*" capture="environment" onChange={e=>handlePhoto(e,'pre')}/></label>{photo&&<img className="photo" src={photo}/>}<div className="actions"><button className="btn gray" onClick={()=>setStep(1)}>Back</button><button className="btn blue" style={{flex:1}} onClick={next2}>Generate Token</button></div></>}{step===3&&curr&&<><div style={{textAlign:'center'}}><div className="token tokgreen" style={{fontSize:34,padding:'14px 25px'}}>{curr.token}</div></div><div className="section" style={{background:'#eff6ff',border:'2px solid #bfdbfe'}}><div className="grid2"><div>Name: <b>{curr.name}</b></div><div>Age/Sex: <b>{curr.age}/{curr.sex}</b></div><div>OPD: <b>{curr.opd}</b></div><div>Room: <b>{curr.room}</b></div><div>Diagnosis: <b>{curr.diagnosis}</b></div><div>Procedure: <b>{curr.procedure}</b></div></div>{curr.preOpPhoto&&<img className="photo" src={curr.preOpPhoto}/>}</div><div className="actions"><button className="btn green" onClick={async()=>{try{await printPatient(curr);setMsg(`Printed ${curr.token}`)}catch(e){setMsg('Print failed: '+e.message)}}}>🖨️ Print</button><button className="btn green" onClick={()=>announce(curr,false)}>🔊 Announce</button><button className="btn blue" onClick={confirm} disabled={saving}>{saving?'Saving…':'Add to Queue'}</button><button className="btn gray" onClick={reset}>New</button></div></>}{step===1&&<div className="queue"><b>📋 Registered Queue ({patients.filter(p=>p.status==='registered').length})</b>{patients.filter(p=>p.status==='registered').map(p=><div className="queue" key={p.id} style={{marginTop:8}}><div className="patient-top"><div className="patient-main"><span className={`token ${p.isSeptic?'tokred':'tokgreen'}`}>{p.token}</span><b>{p.name}</b><span className="small">{p.age}/{p.sex} • {p.opd}</span></div><div className="actions"><button className="btn green" onClick={()=>announcePrint(p)}>🖨️</button><button className="btn green announce" onClick={()=>announce(p,false)}>🔊</button></div></div></div>)}</div>}</div>}
{tab==='preop'&&<div>{patients.filter(p=>['registered','ready'].includes(p.status)).map(p=>{const done=preDone(p);return <div className="patient-card" key={p.id}><div className="patient-top"><div className="patient-main"><span className={`token ${p.isSeptic?'tokred':'tokgreen'}`}>{p.token}</span><div><b>{p.name}</b><div className="small">{p.age}/{p.sex} • {p.opd}</div></div></div><div className="actions"><span className={`badge ${p.status==='ready'?'green':'yellow'}`}>{p.status.toUpperCase()}</span><button className="btn blue" onClick={()=>announcePrint(p)}>🖨️</button><button className="btn green announce" onClick={()=>announce(p,false)}>🔊</button></div></div><div className="section prebox"><div className="checkgrid">{PRE_ITEMS.map(i=><div className="checkrow" key={i.k}><div className="checkleft"><input type="checkbox" checked={!!p.preOp?.[i.k]} onChange={e=>updatePre(p,i,e.target.checked)}/><div><b>{i.label}</b>{i.sub&&<div className="hint">{i.sub}</div>}</div></div>{i.na&&<label className="na"><input type="checkbox" checked={!!p.preOpNA?.[i.k]} onChange={e=>updateNA(p,i.k,e.target.checked)}/> NA</label>}</div>)}</div></div><div className="grid3"><button className={`btn ${p.status==='registered'?'yellow':'gray'}`} onClick={()=>upd(p.id,{status:'registered'})}>Reg</button><button className={`btn ${p.status==='ready'?'green':'gray'}`} disabled={!done} onClick={()=>upd(p.id,{status:'ready'})}>Ready</button><button className="btn purple" disabled={!done} onClick={()=>upd(p.id,{status:'in-progress'})}>Start</button></div></div>})}</div>}
{tab==='postop'&&<div>{patients.map(p=>{const pc=POST_ITEMS.every(i=>p.postOp?.[i.k]);return <div className="patient-card" key={p.id}><div className="patient-top"><div className="patient-main"><span className={`token ${p.isSeptic?'tokred':'tokgreen'}`}>{p.token}</span><div><b>{p.name}</b><div className="small">{p.age}/{p.sex} • {p.opd}</div></div></div><div className="actions"><button className="btn blue" onClick={()=>announcePrint(p)}>🖨️</button><button className="btn green announce" onClick={()=>announce(p,true)}>🔊</button></div></div>{p.status==='in-progress'&&<><div className="section postbox"><label className="btn purple" style={{display:'inline-block',marginBottom:8}}>📷 Upload Post-Op Photo<input className="hidden" type="file" accept="image/*" capture="environment" onChange={e=>handlePhoto(e,'post',p)}/></label>{p.postOpPhoto&&<img className="photo" src={p.postOpPhoto}/>}<div className="checkgrid">{POST_ITEMS.map(i=><div className="checkrow" key={i.k}><label className="checkleft"><input type="checkbox" checked={!!p.postOp?.[i.k]} onChange={e=>updatePost(p,i.k,e.target.checked)}/><b>{i.label}</b></label>{i.k==='otNotes'&&<button className="btn purple" onClick={()=>setNotes({p,data:p.otNotesData||{rx:{},instructions:{}}})}>Open</button>}{i.k==='hpe'&&<label className="btn purple">📷 Upload<input className="hidden" type="file" accept="image/*" capture="environment" onChange={e=>handlePhoto(e,'post',p)}/></label>}{i.k==='pusCulture'&&<label className="btn purple">📷 Upload<input className="hidden" type="file" accept="image/*" capture="environment" onChange={e=>handlePhoto(e,'post',p)}/></label>}</div>)}</div></div></>}<div className="grid4"><button className={`btn ${p.status==='registered'?'yellow':'gray'}`} onClick={()=>upd(p.id,{status:'registered'})}>Reg</button><button className={`btn ${p.status==='ready'?'green':'gray'}`} onClick={()=>upd(p.id,{status:'ready'})}>Ready</button><button className={`btn ${p.status==='in-progress'?'purple':'gray'}`} onClick={()=>upd(p.id,{status:'in-progress'})}>Prog</button><button className="btn gray" disabled={!pc} onClick={()=>upd(p.id,{status:'completed',end:new Date().toISOString()})}>Done</button></div></div>})}</div>}
{proc&&<div className="modal" onClick={()=>setProc(null)}><div className="modalbox" onClick={e=>e.stopPropagation()}><div className="modalhead"><h2>Procedure</h2><button className="btn gray" onClick={()=>setProc(null)}>✕</button></div><textarea className="form-input" rows="5" value={proc.text} onChange={e=>setProc({...proc,text:e.target.value})}/><div className="actions" style={{marginTop:10}}><button className="btn purple" onClick={()=>speakTamil(`Procedure ${proc.text}`)}>🔊 Speak</button><button className="btn blue" onClick={()=>{setForm({...form,procedure:proc.text});setProc(null)}}>Save</button></div></div></div>}
{notes&&<OTNotesModal notes={notes} setNotes={setNotes} onSave={async data=>{await upd(notes.p.id,{otNotesData:data,'postOp.otNotes':true});setNotes(null)}} onPrint={async data=>{try{await printNotes(notes.p,data);setMsg('OT Notes printed')}catch(e){setMsg('Print failed: '+e.message)}}}/>} {msg&&<div style={{position:'fixed',bottom:20,left:20,right:20,zIndex:1200,background:'#166534',color:'#fff',padding:14,borderRadius:14,textAlign:'center',fontWeight:800}} onClick={()=>setMsg('')}>{msg}</div>}</div>}
function OTNotesModal({notes,setNotes,onSave,onPrint}){const d=notes.data||{},[data,setData]=useState({...d,rx:d.rx||{},instructions:d.instructions||{}});const set=(k,v)=>setData({...data,[k]:v});return <div className="modal" onClick={()=>setNotes(null)}><div className="modalbox" onClick={e=>e.stopPropagation()}><div className="modalhead"><h2>OT Notes – {notes.p.token}</h2><button className="btn gray" onClick={()=>setNotes(null)}>✕</button></div><div className="form-group"><input className="form-input" placeholder="Procedure done" value={data.procedureDone||''} onChange={e=>set('procedureDone',e.target.value)}/></div><div className="form-group"><textarea className="form-input" rows="2" placeholder="Findings" value={data.findings||''} onChange={e=>set('findings',e.target.value)}/></div><div className="form-group"><textarea className="form-input" rows="2" placeholder="Procedure details" value={data.details||''} onChange={e=>set('details',e.target.value)}/></div><div className="form-group"><input className="form-input" placeholder="Any complications (default Nil)" value={data.complications||''} onChange={e=>set('complications',e.target.value)}/></div><h3>Prescription</h3>{RX.map(r=><label className="rx" key={r[0]}><input type="checkbox" checked={!!data.rx[r[0]]} onChange={e=>set('rx',{...data.rx,[r[0]]:e.target.checked})}/><span><b>{r[1]}</b><br/>{r[2]}</span></label>)}<h3>Instructions</h3>{INSTR.map(i=><label className="rx" key={i[0]}><input type="checkbox" checked={!!data.instructions[i[0]]} onChange={e=>set('instructions',{...data.instructions,[i[0]]:e.target.checked})}/><span>{i[1]}</span></label>)}<textarea className="form-input" rows="2" placeholder="Additional instructions" value={data.additional||''} onChange={e=>set('additional',e.target.value)}/><div className="actions" style={{marginTop:12}}><button className="btn purple" onClick={()=>speakTamil(`${data.procedureDone||'Procedure'}. ${data.findings||''}. ${data.details||''}`)}>🔊 Speak</button><button className="btn green" onClick={()=>onSave(data)}>Save</button><button className="btn blue" onClick={()=>onPrint(data)}>🖨️ Print</button></div></div></div>}
