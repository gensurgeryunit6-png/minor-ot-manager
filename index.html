<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minor OT</title>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef6ff;font-family:system-ui,-apple-system,sans-serif;color:#111827}.app{max-width:1050px;margin:auto;padding:10px}.card,.patient{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 9px #0001}.head,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between}.title{font-size:30px;font-weight:900;color:#2563eb}.muted{color:#6b7280;font-size:13px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer}.btn:disabled{opacity:.45}.blue{background:#3b82f6;color:#fff}.green{background:#22c55e;color:#fff}.purple{background:#a855f7;color:#fff}.yellow{background:#eab308;color:#fff}.red{background:#ef4444;color:#fff}.gray{background:#f3f4f6;color:#1f2937}.input,select,textarea{width:100%;padding:12px;border:2px solid #d1d5db;border-radius:11px;font-size:16px;background:#fff}.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.stat{padding:9px;border-radius:12px;text-align:center;border:1px solid}.n{font-size:23px;font-weight:900}.l{font-size:12px;font-weight:800}.sb{background:#dbeafe;color:#1e40af}.sy{background:#fef3c7;color:#92400e}.sg{background:#d1fae5;color:#065f46}.sp{background:#e9d5ff;color:#6b21a8}.sgr{background:#f3f4f6;color:#374151}.section{padding:12px;border-radius:14px;margin:10px 0;border:2px solid #dbeafe;background:#f8fafc}.pre{background:#f0fdf4;border-color:#86efac}.post{background:#faf5ff;border-color:#d8b4fe}.triage{background:#fef2f2;border-color:#fecaca}.token{display:inline-flex;padding:9px 14px;border-radius:11px;color:#fff;font-size:24px;font-weight:900}.tokg{background:#22c55e}.tokr{background:#ef4444}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{background:#fff;border-radius:9px;padding:9px;display:flex;justify-content:space-between;gap:8px}.checkleft{display:flex;gap:8px;align-items:flex-start}.check input{width:20px;height:20px}.badge{padding:7px 9px;border-radius:9px;color:#fff;font-size:11px;font-weight:900}.photo{max-width:100%;max-height:280px;border-radius:12px;margin-top:8px}.link{color:#2563eb;text-decoration:underline;cursor:pointer;font-weight:800;margin-top:6px}.modal{position:fixed;inset:0;background:#0008;z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px}.modalbox{background:#fff;border-radius:18px;padding:16px;width:min(760px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.rx{display:flex;gap:8px;background:#f8fafc;border-radius:9px;padding:9px;margin:6px 0}.toast{position:fixed;bottom:18px;left:18px;right:18px;background:#166534;color:#fff;padding:14px;border-radius:14px;text-align:center;font-weight:800;z-index:1200}@media(max-width:650px){.g2,.g3,.checks{grid-template-columns:1fr}.stats{gap:4px}.n{font-size:18px}.l{font-size:10px}.head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div id="root"></div>
<script>
(function(){
'use strict';
if(!window.firebase||!window.firebaseConfig){document.getElementById('root').innerHTML='<div class="card"><h2>Minor OT</h2><p>Firebase configuration could not be loaded. Please refresh.</p></div>';return;}
try{firebase.initializeApp(firebaseConfig)}catch(e){if(!firebase.apps.length)throw e}const db=firebase.firestore();
const PRE=[['allergies','Allergies',false],['tt','TT','Subject: 0.5 ml IM stat'],['testDose','Test Dose','Subject: Injection Xylo test dose'],['attender','Attender',''],['ornaments','Ornaments',''],['consent','Consent',false]];
const RX=[['amoxyclav','Tab Amoxyclav 625 mg','BD for 5 days'],['cefu','Tab CefU 200 mg','BD for 5 days'],['paracetamol','Tab Paracetamol 500 mg','BD for 5 days'],['pantop','Tab Pantop 40 mg','OD for 5 days'],['chymoral','Tab Chymoral Forte','1 tab TDS for 5 days']];
const INS=[['cd','C&D daily'],['soak','Watch for soakage'],['warning','Review if there is warning has explained']];
let date=new Date().toISOString().slice(0,10),tab='reg',step=1,patients=[],form=blank(),prePhoto='',current=null,notesPatient=null,timer;
function blank(){return{name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',isSeptic:false,fever:false,bleeding:false,pain:false,shock:false}}
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function toast(t){let x=document.getElementById('toast');if(x)x.remove();document.body.insertAdjacentHTML('beforeend','<div class="toast" id="toast">'+esc(t)+'</div>');clearTimeout(timer);timer=setTimeout(()=>document.getElementById('toast')?.remove(),5000)}
function speak(t){if(!('speechSynthesis'in window)){toast('Tamil text-to-speech is not available');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';u.rate=.82;let v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('ta'));if(v)u.voice=v;speechSynthesis.speak(u)}
function announce(p,post){speak('திரு '+p.name+' அவர்கள் '+(post?'Dressing Room':'Minor OT Room')+'க்கு வரவும்.')}
function fileData(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function render(){let counts=[patients.length,...['registered','ready','in-progress','completed'].map(s=>patients.filter(p=>p.status===s).length)];root.innerHTML='<div class="app"><div class="card"><div class="head"><div><div class="title">Minor OT</div><div class="muted">'+new Date(date+'T00:00:00').toLocaleDateString()+'</div></div><div class="row"><span class="badge green">● Online</span><button class="btn red" id="clear">🗑️ Clear All Data</button></div></div><div class="tabs"><button class="btn '+(tab==='reg'?'blue':'gray')+'" data-tab="reg">Registration</button><button class="btn '+(tab==='pre'?'green':'gray')+'" data-tab="pre">Pre-Op</button><button class="btn '+(tab==='list'?'purple':'gray')+'" data-tab="list">List</button></div><div class="stats">'+[['sb','Total'],['sy','Reg'],['sg','Ready'],['sp','Progress'],['sgr','Done']].map((x,i)=>'<div class="stat '+x[0]+'"><div class="n">'+counts[i]+'</div><div class="l">'+x[1]+'</div></div>').join('')+'</div></div>'+(tab==='reg'?registration():tab==='pre'?preop():list())+'</div>';bind()}
function registration(){if(step===1)return '<div class="card"><h2>Patient Info</h2><input class="input" id="name" placeholder="Name" value="'+esc(form.name)+'"><div class="g3" style="margin-top:9px"><input class="input" id="age" type="number" placeholder="Age" value="'+esc(form.age)+'"><select id="sex"><option value="M" '+(form.sex==='M'?'selected':'')+'>Male</option><option value="F" '+(form.sex==='F'?'selected':'')+'>Female</option><option value="O" '+(form.sex==='O'?'selected':'')+'>Other</option></select><select id="opd"><option value="">OPD</option><option '+(form.opd==='7A'?'selected':'')+'>7A</option><option '+(form.opd==='7B'?'selected':'')+'>7B</option><option '+(form.opd==='7C'?'selected':'')+'>7C</option><option '+(form.opd==='7D'?'selected':'')+'>7D</option></select></div><div class="g2" style="margin-top:9px"><input class="input" id="diagnosis" placeholder="Diagnosis" value="'+esc(form.diagnosis)+'"><input class="input" id="site" placeholder="Site" value="'+esc(form.site)+'"></div><div class="row" style="margin-top:9px"><input class="input" id="procedure" placeholder="Procedure" value="'+esc(form.procedure)+'" style="flex:1"><button class="btn gray" id="speakProc">🔊</button></div><button class="btn blue" id="next" style="width:100%;margin-top:10px">Next</button></div>';if(step===2)return '<div class="card"><h2>Triage</h2><div class="g2"><button class="btn '+(!form.isSeptic?'green':'gray')+'" id="non">🟢 NON-SEPTIC</button><button class="btn '+(form.isSeptic?'red':'gray')+'" id="sept">🔴 SEPTIC</button></div><div class="section triage"><b>Red Flags</b>'+[['fever','Fever'],['bleeding','Bleeding'],['pain','Severe Pain'],['shock','Shock']].map(x=>'<label class="checkleft" style="display:flex;margin-top:9px"><input type="checkbox" id="'+x[0]+'" '+(form[x[0]]?'checked':'')+'>'+x[1]+'</label>').join('')+'</div><label class="btn green" style="display:block;text-align:center">📷 Upload Pre-Op Photo<input id="prePhoto" type="file" accept="image/*" capture="environment" hidden></label>'+(prePhoto?'<img class="photo" src="'+prePhoto+'"><div class="link" id="openPre">Open Pre-Op Photo</div>':'')+'<div class="row" style="margin-top:10px"><button class="btn gray" id="back">Back</button><button class="btn blue" id="generate" style="flex:1">Generate Token</button></div></div>';return '<div class="card"><div style="text-align:center"><span class="token tokg" style="font-size:34px">'+esc(current.token)+'</span></div><div class="section"><div class="g2"><div>Name: <b>'+esc(current.name)+'</b></div><div>Age/Sex: <b>'+esc(current.age)+'/'+esc(current.sex)+'</b></div><div>OPD: <b>'+esc(current.opd)+'</b></div><div>Room: <b>'+esc(current.room)+'</b></div><div>Diagnosis: <b>'+esc(current.diagnosis)+'</b></div><div>Site: <b>'+esc(current.site)+'</b></div><div>Procedure: <b>'+esc(current.procedure)+'</b></div></div>'+(current.preOpPhoto?'<img class="photo" src="'+current.preOpPhoto+'">':'')+'</div><div class="row"><button class="btn green" id="printCurrent">🖨️ Print</button><button class="btn green" id="announceCurrent">🔊 Announce</button><button class="btn blue" id="addQueue" style="flex:1">Add to Queue</button><button class="btn gray" id="new">New</button></div></div>'}
function preDone(p){return PRE.every(i=>p.preOp?.[i[0]]||i[2]===false||p.preOpNA?.[i[0]])}
function preop(){let arr=patients.filter(p=>['registered','ready'].includes(p.status));return '<div class="card"><h2>Pre-Op Queue</h2>'+arr.map(p=>'<div class="patient"><div class="row"><span class="token '+(p.isSeptic?'tokr':'tokg')+'">'+esc(p.token)+'</span><b>'+esc(p.name)+'</b><span class="muted">'+esc(p.age)+'/'+esc(p.sex)+' • '+esc(p.opd)+'</span><span style="margin-left:auto"></span><button class="btn green" data-ann="'+p.id+'">🔊</button><button class="btn blue" data-print="'+p.id+'">🖨️</button></div><div class="section pre"><div class="checks">'+PRE.map(i=>'<div class="check"><label class="checkleft"><input type="checkbox" data-pre="'+p.id+'|'+i[0]+'" '+(p.preOp?.[i[0]]?'checked':'')+'><span><b>'+i[1]+'</b>'+(i[2]&&i[2]!==false?'<div class="muted">'+i[2]+'</div>':'')+'</span></label>'+(i[2]!==false?'<label class="muted"><input type="checkbox" data-na="'+p.id+'|'+i[0]+'" '+(p.preOpNA?.[i[0]]?'checked':'')+'> NA</label>':'')+'</div>').join('')+'</div></div><div class="g3"><button class="btn yellow" data-status="'+p.id+'|registered">Reg</button><button class="btn green" '+(preDone(p)?'':'disabled')+' data-status="'+p.id+'|ready">Ready</button><button class="btn purple" '+(preDone(p)?'':'disabled')+' data-status="'+p.id+'|in-progress">Start</button></div></div>').join('')+'</div>'}
function list(){return '<div class="card"><div class="row"><h2 style="margin:0;flex:1">OT List / Post-Op</h2><label class="btn gray">Date <input id="date" type="date" value="'+date+'" style="width:auto;border:0;padding:0;background:transparent"></label></div>'+patients.map(p=>'<div class="patient"><div class="row"><span class="token '+(p.isSeptic?'tokr':'tokg')+'">'+esc(p.token)+'</span><b>'+esc(p.name)+'</b><span class="muted">'+esc(p.age)+'/'+esc(p.sex)+' • '+esc(p.opd)+'</span><span style="margin-left:auto"></span><button class="btn green" data-annpost="'+p.id+'">🔊</button><button class="btn blue" data-print="'+p.id+'">🖨️</button></div>'+(p.status==='in-progress'?'<div class="section post"><label class="btn purple">📷 Upload Post-Op Photo<input type="file" accept="image/*" capture="environment" data-photo="'+p.id+'" hidden></label>'+(p.postOpPhoto?'<div class="link" data-open-photo="'+p.id+'">Open Post-Op Photo</div>':'')+'<div class="checks" style="margin-top:9px">'+[['otNotes','OT Notes'],['hpe','HPE'],['culture','Culture'],['prescription','Rx']].map(x=>'<div class="check"><label class="checkleft"><input type="checkbox" data-post="'+p.id+'|'+x[0]+'" '+(p.postOp?.[x[0]]?'checked':'')+'><b>'+x[1]+'</b></label>'+(x[0]==='otNotes'?'<button class="btn purple" data-notes="'+p.id+'">Open</button>':'')+'</div>').join('')+'</div></div>':'')+'<div class="g3"><button class="btn '+(p.status==='registered'?'yellow':'gray')+'" data-status="'+p.id+'|registered">Reg</button><button class="btn '+(p.status==='ready'?'green':'gray')+'" data-status="'+p.id+'|ready">Ready</button><button class="btn '+(p.status==='in-progress'?'purple':'gray')+'" data-status="'+p.id+'|in-progress">Prog</button><button class="btn gray" '+(POSTdone(p)?'':'disabled')+' data-status="'+p.id+'|completed">Done</button></div></div>').join('')+'</div>'}
function POSTdone(p){return ['otNotes','hpe','culture','prescription'].every(k=>p.postOp?.[k])}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;step=1;render()});let c=document.getElementById('clear');if(c)c.onclick=clearAll;let next=document.getElementById('next');if(next)next.onclick=()=>{readForm();if(!form.name||!form.age||!form.opd||!form.diagnosis||!form.site||!form.procedure)return alert('Fill Name, Age, OPD, Diagnosis, Site and Procedure');step=2;render()};let sp=document.getElementById('speakProc');if(sp)sp.onclick=()=>{readForm();speak('Procedure '+form.procedure)};let back=document.getElementById('back');if(back)back.onclick=()=>{step=1;render()};let non=document.getElementById('non'),sept=document.getElementById('sept');if(non)non.onclick=()=>{form.isSeptic=false;render()};if(sept)sept.onclick=()=>{form.isSeptic=true;render()};['fever','bleeding','pain','shock'].forEach(k=>{let x=document.getElementById(k);if(x)x.onchange=()=>form[k]=x.checked});let pp=document.getElementById('prePhoto');if(pp)pp.onchange=async e=>{if(e.target.files[0]){prePhoto=await fileData(e.target.files[0]);render()}};let op=document.getElementById('openPre');if(op)op.onclick=()=>window.open(prePhoto,'_blank');let gen=document.getElementById('generate');if(gen)gen.onclick=generate;let pc=document.getElementById('printCurrent');if(pc)pc.onclick=()=>doPrint(current);let ac=document.getElementById('announceCurrent');if(ac)ac.onclick=()=>announce(current,false);let aq=document.getElementById('addQueue');if(aq)aq.onclick=addQueue;let nw=document.getElementById('new');if(nw)nw.onclick=()=>{form=blank();prePhoto='';current=null;step=1;render()};document.querySelectorAll('[data-pre]').forEach(x=>x.onchange=()=>updatePre(x));document.querySelectorAll('[data-na]').forEach(x=>x.onchange=()=>updateNA(x));document.querySelectorAll('[data-post]').forEach(x=>x.onchange=()=>updatePost(x));document.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>status(x));document.querySelectorAll('[data-ann]').forEach(x=>x.onclick=()=>announce(find(x.dataset.ann),false));document.querySelectorAll('[data-annpost]').forEach(x=>x.onclick=()=>announce(find(x.dataset.annpost),true));document.querySelectorAll('[data-print]').forEach(x=>x.onclick=()=>doPrint(find(x.dataset.print)));document.querySelectorAll('[data-photo]').forEach(x=>x.onchange=async e=>{if(e.target.files[0]){await db.collection('minorOT').doc(date).collection('patients').doc(x.dataset.photo).update({postOpPhoto:await fileData(e.target.files[0])});toast('Post-op photo saved')}});document.querySelectorAll('[data-open-photo]').forEach(x=>x.onclick=()=>{let p=find(x.dataset.openPhoto);if(p?.postOpPhoto)window.open(p.postOpPhoto,'_blank')});document.querySelectorAll('[data-notes]').forEach(x=>x.onclick=()=>{notesPatient=find(x.dataset.notes);showNotes()});let dt=document.getElementById('date');if(dt)dt.onchange=()=>{date=dt.value;subscribe()}}
function readForm(){['name','age','diagnosis','site','procedure'].forEach(k=>{let x=document.getElementById(k);if(x)form[k]=x.value});let s=document.getElementById('sex'),o=document.getElementById('opd');if(s)form.sex=s.value;if(o)form.opd=o.value}
function generate(){let urgent=form.fever||form.bleeding||form.pain||form.shock,room=form.isSeptic?'Dressing':'Minor OT '+((patients.filter(p=>!p.isSeptic).length%3)+1);current={...form,token:(form.isSeptic?'D':'OT')+'-PREVIEW',room,priority:urgent?'urgent':'routine',status:'registered',time:new Date().toISOString(),preOp:Object.fromEntries(PRE.map(x=>[x[0],false])),preOpNA:{},postOp:{},preOpPhoto:prePhoto};step=3;render()}
async function addQueue(){let col=db.collection('minorOT').doc(date).collection('patients'),day=db.collection('minorOT').doc(date),field=current.isSeptic?'septicCount':'nonSepticCount',prefix=current.isSeptic?'D':'OT';try{let ref=col.doc();await db.runTransaction(async tx=>{let ds=await tx.get(day),n=(ds.exists?ds.data()[field]||0:0)+1;tx.set(day,{[field]:n},{merge:true});tx.set(ref,{...current,token:prefix+'-'+String(n).padStart(3,'0')})});toast('Patient added to queue');form=blank();prePhoto='';current=null;step=1;tab='reg'}catch(e){toast(e.message)}}
function find(id){return patients.find(p=>p.id===id)}
async function updatePre(x){let [id,k]=x.dataset.pre.split('|'),p=find(id),v=x.checked,d={[`preOp.${k}`]:v};let q={...p,preOp:{...p.preOp,[k]:v}};if(preDone(q))d.status='ready';await db.collection('minorOT').doc(date).collection('patients').doc(id).update(d)}
async function updateNA(x){let [id,k]=x.dataset.na.split('|');await db.collection('minorOT').doc(date).collection('patients').doc(id).update({[`preOpNA.${k}`]:x.checked})}
async function updatePost(x){let [id,k]=x.dataset.post.split('|');await db.collection('minorOT').doc(date).collection('patients').doc(id).update({[`postOp.${k}`]:x.checked})}
async function status(x){let [id,s]=x.dataset.status;await db.collection('minorOT').doc(date).collection('patients').doc(id).update({status:s,end:s==='completed'?new Date().toISOString():null})}
async function clearAll(){if(!confirm('Clear all data for '+date+'?'))return;let b=db.batch(),col=db.collection('minorOT').doc(date).collection('patients');patients.forEach(p=>b.delete(col.doc(p.id)));await b.commit();await db.collection('minorOT').doc(date).set({septicCount:0,nonSepticCount:0},{merge:true});toast('All data cleared')}
async function doPrint(p){if(!p)return;try{if(window.b21PrintLines){await window.b21PrintLines(['MINOR OT',p.token,p.name,p.age+'/'+p.sex,'OPD: '+p.opd,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+p.procedure,p.room]);toast('Print sent')}else toast('Printer module unavailable')}catch(e){toast('Print failed: '+e.message)}}
function showNotes(){let p=notesPatient,d=p.otNotesData||{rx:{},instructions:{}},box=document.createElement('div');box.className='modal';box.innerHTML='<div class="modalbox"><div class="modalhead"><h2>OT Notes – '+esc(p.token)+'</h2><button class="btn gray" id="closeNotes">✕</button></div><input class="input" id="nproc" placeholder="Procedure done" value="'+esc(d.procedureDone||p.procedure)+'"><textarea class="input" id="nfind" rows="2" placeholder="Findings" style="margin-top:8px">'+esc(d.findings||'')+'</textarea><textarea class="input" id="ndetails" rows="2" placeholder="Procedure details" style="margin-top:8px">'+esc(d.details||'')+'</textarea><input class="input" id="ncomp" placeholder="Complications (default Nil)" value="'+esc(d.complications||'')+'" style="margin-top:8px"><h3>Prescription</h3>'+RX.map(r=>'<label class="rx"><input type="checkbox" data-rx="'+r[0]+'" '+(d.rx?.[r[0]]?'checked':'')+'><span><b>'+r[1]+'</b><br>'+r[2]+'</span></label>').join('')+'<h3>Instructions</h3>'+INS.map(i=>'<label class="rx"><input type="checkbox" data-ins="'+i[0]+'" '+(d.instructions?.[i[0]]?'checked':'')+'><span>'+i[1]+'</span></label>').join('')+'<textarea class="input" id="nadd" rows="2" placeholder="Additional instructions" style="margin-top:8px">'+esc(d.additional||'')+'</textarea><div class="row" style="margin-top:12px"><button class="btn purple" id="speakNotes">🔊 Speak</button><button class="btn green" id="saveNotes">Save</button><button class="btn blue" id="printNotes">🖨️ Print</button></div></div>';document.body.appendChild(box);box.querySelector('#closeNotes').onclick=()=>box.remove();box.querySelector('#speakNotes').onclick=()=>speak('Procedure '+box.querySelector('#nproc').value+'. Findings '+box.querySelector('#nfind').value);box.querySelector('#saveNotes').onclick=async()=>{let rx={},instructions={};box.querySelectorAll('[data-rx]').forEach(x=>rx[x.dataset.rx]=x.checked);box.querySelectorAll('[data-ins]').forEach(x=>instructions[x.dataset.ins]=x.checked);let data={procedureDone:box.querySelector('#nproc').value,findings:box.querySelector('#nfind').value,details:box.querySelector('#ndetails').value,complications:box.querySelector('#ncomp').value||'Nil',rx,instructions,additional:box.querySelector('#nadd').value};await db.collection('minorOT').doc(date).collection('patients').doc(p.id).update({otNotesData:data,'postOp.otNotes':true});box.remove();toast('OT Notes saved')};box.querySelector('#printNotes').onclick=async()=>{let data={procedureDone:box.querySelector('#nproc').value,findings:box.querySelector('#nfind').value,details:box.querySelector('#ndetails').value,complications:box.querySelector('#ncomp').value||'Nil',rx:{},instructions:{}};box.querySelectorAll('[data-rx]').forEach(x=>data.rx[x.dataset.rx]=x.checked);box.querySelectorAll('[data-ins]').forEach(x=>data.instructions[x.dataset.ins]=x.checked);let lines=['MINOR OT','OT NOTES '+p.token,p.name,p.age+'/'+p.sex,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+(data.procedureDone||p.procedure),'Findings: '+(data.findings||'-'),'Details: '+(data.details||'-'),'Complications: '+data.complications,'PRESCRIPTION'];RX.filter(r=>data.rx[r[0]]).forEach(r=>lines.push(r[1]+' '+r[2]));lines.push('INSTRUCTIONS');INS.filter(i=>data.instructions[i[0]]).forEach(i=>lines.push(i[1]));await window.b21PrintLines(lines);toast('OT Notes sent to printer')}}
function subscribe(){db.collection('minorOT').doc(date).collection('patients').orderBy('time').onSnapshot(s=>{patients=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast(e.message))}
subscribe();
})();
