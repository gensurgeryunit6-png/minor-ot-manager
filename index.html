mg','OD for 5 days'],['chymoral','Tab Chymoral Forte','1 tab TDS for 5 days']];const INS=[['cd','C&D daily'],['soak','Watch for soakage'],['warning','Review if there is warning has explained']];function blank(){return{name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',isSeptic:false,fever:false,bleeding:false,pain:false,shock:false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function lkey(){return'minorOT_'+date}function localLoad(){try{return JSON.parse(localStorage.getItem(lkey())||'[]')}catch(e){return[]}}function localSave(){try{localStorage.setItem(lkey(),JSON.stringify(patients))}catch(e){}}function toast(t,bad){document.getElementById('toast')?.remove();document.body.insertAdjacentHTML('beforeend','<div class="toast '+(bad?'error':'')+'" id="toast">'+esc(t)+'</div>');clearTimeout(timer);timer=setTimeout(()=>document.getElementById('toast')?.remove(),3500)}function speak(t){if(!('speechSynthesis'in window)){toast('Text-to-speech unavailable',true);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';u.rate=.8;let v=speechSynthesis.getVoices().find(x=>(x.lang||'').toLowerCase().startsWith('ta'));if(v)u.voice=v;speechSynthesis.speak(u)}function announce(p,post){if(p)speak('திரு '+p.name+' அவர்கள் '+(post?'dressing room':'minor OT room')+'க்கு வரவும்.')}function fileData(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}function counts(){return[patients.length,...['registered','ready','in-progress','completed'].map(s=>patients.filter(p=>p.status===s).length)]}function header(){let c=counts();return'<div class="card"><div class="head"><div><div class="brand">Minor OT</div><div class="sub">'+new Date(date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+'</div></div><div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap"><span class="online">● Online</span><button class="danger" id="clear">🗑 Clear All Data</button></div></div><div class="tabs"><button class="tab '+(tab==='reg'?'active':'')+'" data-tab="reg">Registration</button><button class="tab pre '+(tab==='pre'?'active':'')+'" data-tab="pre">Pre-Op</button><button class="tab list '+(tab==='list'?'active':'')+'" data-tab="list">List</button></div><div class="stats">'+[['s1','Total'],['s2','Reg'],['s3','Ready'],['s4','Progress'],['s5','Done']].map((x,i)=>'<div class="stat '+x[0]+'"><b>'+c[i]+'</b><small>'+x[1]+'</small></div>').join('')+'</div></div>'}function registration(){if(step===1)return'<div class="card"><div class="title">Patient Information</div><input class="input" id="name" placeholder="Patient name" value="'+esc(form.name)+'"><div class="grid3"><input class="input" id="age" type="number" placeholder="Age" value="'+esc(form.age)+'"><select id="sex"><option value="M" '+(form.sex==='M'?'selected':'')+'>Male</option><option value="F" '+(form.sex==='F'?'selected':'')+'>Female</option><option value="O" '+(form.sex==='O'?'selected':'')+'>Other</option></select><select id="opd"><option value="">OPD</option>'+['7A','7B','7C','7D'].map(x=>'<option '+(form.opd===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="grid2"><input class="input" id="diagnosis" placeholder="Diagnosis" value="'+esc(form.diagnosis)+'"><input class="input" id="site" placeholder="Site" value="'+esc(form.site)+'"></div><div style="display:flex;gap:8px;margin-top:9px"><input class="input" id="procedure" placeholder="Procedure" value="'+esc(form.procedure)+'"><button class="btn light" id="speakProc">🔊</button></div><button class="btn blue wide" id="next">Next</button></div>';return'<div class="card"><div class="title">Triage & Pre-Op</div><div class="grid2"><button class="btn '+(!form.isSeptic?'green':'light')+'" id="non">🟢 NON-SEPTIC</button><button class="btn '+(form.isSeptic?'red':'light')+'" id="sept">🔴 SEPTIC</button></div><div class="triage"><b>Red Flags</b>'+[['fever','Fever'],['bleeding','Bleeding'],['pain','Severe Pain'],['shock','Shock']].map(x=>'<label style="display:block;margin-top:10px"><input type="checkbox" id="'+x[0]+'" '+(form[x[0]]?'checked':'')+'> '+x[1]+'</label>').join('')+'</div><label class="btn green upload">📷 Upload Pre-Op Photo<input id="prePhoto" type="file" accept="image/*" capture="environment" hidden></label>'+(prePhoto?'<img class="photo" src="'+prePhoto+'"><div class="link" id="openPre">Open uploaded photo</div>':'')+'<div style="display:flex;gap:8px;margin-top:12px"><button class="btn light" id="back">Back</button><button class="btn blue" id="generate" style="flex:1">Generate Token</button></div></div>'}function tokenPreview(){return'<div class="card"><div class="ticket"><div class="ticketTop"><div>YOUR OT TOKEN</div><div class="ticketNo">'+esc(current.token)+'</div></div><div class="ticketBody"><div class="ticketGrid"><div><div class="ticketLabel">PATIENT</div><div class="ticketValue">'+esc(current.name)+'</div></div><div><div class="ticketLabel">AGE / SEX</div><div class="ticketValue">'+esc(current.age)+' / '+esc(current.sex)+'</div></div><div><div class="ticketLabel">OPD</div><div class="ticketValue">'+esc(current.opd)+'</div></div><div><div class="ticketLabel">ROOM</div><div class="ticketValue">'+esc(current.room)+'</div></div><div><div class="ticketLabel">DIAGNOSIS</div><div class="ticketValue">'+esc(current.diagnosis)+'</div></div><div><div class="ticketLabel">SITE</div><div class="ticketValue">'+esc(current.site)+'</div></div><div><div class="ticketLabel">PROCEDURE</div><div class="ticketValue">'+esc(current.procedure)+'</div></div></div></div><div class="ticketBottom">Please wait for your token to be announced</div></div><div class="grid2" style="margin-top:12px"><button class="btn green" id="announceCurrent">🔊 Announce</button><button class="btn blue" id="printCurrent">🖨 Print</button></div><div class="grid2"><button class="btn blue" id="addQueue">Add to Queue</button><button class="btn light" id="new">New</button></div></div>'}function preDone(p){return PRE.every(i=>p.preOp?.[i[0]]||p.preOpNA?.[i[0]])}function preop(){let arr=patients.filter(p=>['registered','ready'].includes(p.status));return'<div class="card"><div class="title">Pre-Op Queue</div>'+(!arr.length?'<div class="empty">No patients in pre-op queue</div>':arr.map(p=>'<div class="queue"><div class="queueHead"><span class="token '+(p.isSeptic?'septic':'')+'">'+esc(p.token)+'</span><b>'+esc(p.name)+'</b><span class="muted">'+esc(p.age)+'/'+esc(p.sex)+' • '+esc(p.opd)+'</span><div class="actions"><button class="iconbtn green" data-ann="'+p.id+'">🔊</button><button class="iconbtn blue" data-print="'+p.id+'">🖨</button></div></div><div class="section pre"><div class="checkgrid">'+PRE.map(i=>'<div class="check"><label><input type="checkbox" data-pre="'+p.id+'|'+i[0]+'" '+(p.preOp?.[i[0]]?'checked':'')+'><span><b>'+i[1]+'</b>'+(i[2]?'<div class="muted">'+i[2]+'</div>':'')+'</span></label>'+(i[0]==='allergies'||i[0]==='consent'?'':'<label class="muted"><input type="checkbox" data-na="'+p.id+'|'+i[0]+'" '+(p.preOpNA?.[i[0]]?'checked':'')+'> N/A</label>')+'</div>').join('')+'</div></div><div class="grid3"><button class="btn yellow" data-status="'+p.id+'|registered">Reg</button><button class="btn green" '+(preDone(p)?'':'disabled')+' data-status="'+p.id+'|ready">Ready</button><button class="btn purple" '+(preDone(p)?'':'disabled')+' data-status="'+p.id+'|in-progress">Start</button></div></div>').join('')+'</div>'}function list(){return'<div class="card"><div class="title">OT List / Post-Op</div><div class="datebar"><b>Date</b><input id="date" type="date" value="'+date+'"></div>'+(!patients.length?'<div class="empty">No patients for this date</div>':patients.map(p=>'<div class="queue"><div class="queueHead"><span class="token '+(p.isSeptic?'septic':'')+'">'+esc(p.token)+'</span><b>'+esc(p.name)+'</b><span class="muted">'+esc(p.age)+'/'+esc(p.sex)+' • '+esc(p.opd)+'</span><div class="actions"><button class="iconbtn green" data-annpost="'+p.id+'">🔊</button><button class="iconbtn blue" data-print="'+p.id+'">🖨</button></div></div><div class="grid3" style="margin-top:11px"><button class="btn '+(p.status==='registered'?'yellow':'light')+'" data-status="'+p.id+'|registered">Reg</button><button class="btn '+(p.status==='ready'?'green':'light')+'" data-status="'+p.id+'|ready">Ready</button><button class="btn '+(p.status==='in-progress'?'purple':'light')+'" data-status="'+p.id+'|in-progress">Prog</button><button class="btn '+(p.status==='completed'?'green':'light')+'" data-status="'+p.id+'|completed">Done</button></div>'+(p.status==='in-progress'?'<div class="section post"><label class="btn purple upload">📷 Upload Post-Op Photo<input type="file" accept="image/*" capture="environment" data-photo="'+p.id+'" hidden></label>'+(p.postOpPhoto?'<div class="link" data-open-photo="'+p.id+'">Open Post-Op Photo</div>':'')+'<div class="checkgrid" style="margin-top:9px">'+[['otNotes','OT Notes'],['hpe','HPE'],['culture','Culture'],['prescription','Rx']].map(x=>'<div class="check"><label><input type="checkbox" data-post="'+p.id+'|'+x[0]+'" '+(p.postOp?.[x[0]]?'checked':'')+'><b>'+x[1]+'</b></label>'+(x[0]==='otNotes'?'<button class="btn purple" data-notes="'+p.id+'">Open</button>':'')+'</div>').join('')+'</div></div>':'')+'</div>').join('')+'</div>'}function render(){root.innerHTML='<div class="app">'+header()+(tab==='reg'?(step===3?tokenPreview():registration()):tab==='pre'?preop():list())+'</div>';bind()}function readForm(){['name','age','diagnosis','site','procedure'].forEach(k=>{let x=document.getElementById(k);if(x)form[k]=x.value});let s=document.getElementById('sex'),o=document.getElementById('opd');if(s)form.sex=s.value;if(o)form.opd=o.value}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;step=1;render()});document.getElementById('clear')?.addEventListener('click',clearAll);document.getElementById('next')?.addEventListener('click',()=>{readForm();if(!form.name||!form.age||!form.opd||!form.diagnosis||!form.site||!form.procedure)return alert('Fill Name, Age, OPD, Diagnosis, Site and Procedure');step=2;render()});document.getElementById('speakProc')?.addEventListener('click',()=>{readForm();speak('Procedure '+form.procedure)});document.getElementById('back')?.addEventListener('click',()=>{step=1;render()});document.getElementById('non')?.addEventListener('click',()=>{form.isSeptic=false;render()});document.getElementById('sept')?.addEventListener('click',()=>{form.isSeptic=true;render()});['fever','bleeding','pain','shock'].forEach(k=>document.getElementById(k)?.addEventListener('change',e=>form[k]=e.target.checked));document.getElementById('prePhoto')?.addEventListener('change',async e=>{if(e.target.files[0]){prePhoto=await fileData(e.target.files[0]);render()}});document.getElementById('openPre')?.addEventListener('click',()=>window.open(prePhoto,'_blank'));document.getElementById('generate')?.addEventListener('click',generate);document.getElementById('announceCurrent')?.addEventListener('click',()=>announce(current,false));document.getElementById('printCurrent')?.addEventListener('click',()=>doPrint(current));document.getElementById('addQueue')?.addEventListener('click',addQueue);document.getElementById('new')?.addEventListener('click',()=>{form=blank();prePhoto='';current=null;step=1;render()});document.querySelectorAll('[data-pre]').forEach(x=>x.onchange=()=>updatePre(x));document.querySelectorAll('[data-na]').forEach(x=>x.onchange=()=>updateNA(x));document.querySelectorAll('[data-post]').forEach(x=>x.onchange=()=>updatePost(x));document.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>statusChange(x));document.querySelectorAll('[data-ann]').forEach(x=>x.onclick=()=>announce(find(x.dataset.ann),false));document.querySelectorAll('[data-annpost]').forEach(x=>x.onclick=()=>announce(find(x.dataset.annpost),true));document.querySelectorAll('[data-print]').forEach(x=>x.onclick=()=>doPrint(find(x.dataset.print)));document.querySelectorAll('[data-photo]').forEach(x=>x.onchange=async e=>{if(e.target.files[0])await savePatch(x.dataset.photo,{postOpPhoto:await fileData(e.target.files[0])},'Post-op photo saved')});document.querySelectorAll('[data-open-photo]').forEach(x=>x.onclick=()=>{let p=find(x.dataset.openPhoto);if(p?.postOpPhoto)window.open(p.postOpPhoto,'_blank')});document.querySelectorAll('[data-notes]').forEach(x=>x.onclick=()=>{notesPatient=find(x.dataset.notes);showNotes()});document.getElementById('date')?.addEventListener('change',e=>{date=e.target.value;loadData()})}function generate(){let n=patients.filter(p=>p.isSeptic===form.isSeptic).length+1;current={...form,token:(form.isSeptic?'D':'OT')+'-'+String(n).padStart(3,'0'),room:form.isSeptic?'Dressing':'Minor OT 1',status:'registered',time:new Date().toISOString(),preOp:Object.fromEntries(PRE.map(x=>[x[0],false])),preOpNA:{},postOp:{},preOpPhoto:prePhoto};step=3;render()}async function addQueue(){let p={...current,id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()))};patients.push(p);localSave();await remoteSet(p);toast('Patient added to queue');form=blank();prePhoto='';current=null;step=1;tab='reg';render()}function find(id){return patients.find(p=>p.id===id)}async function remoteSet(p){if(!db)return;try{await db.collection('minorOT').doc(date).collection('patients').doc(p.id).set(p)}catch(e){console.warn(e);toast('Saved on device; Firebase sync failed',true)}}async function savePatch(id,patch,msg){let p=find(id);if(!p)return;Object.assign(p,patch);localSave();await remoteSet(p);toast(msg);render()}async function updatePre(x){let[a,k]=x.dataset.pre.split('|'),p=find(a);if(!p)return;p.preOp=p.preOp||{};p.preOp[k]=x.checked;if(preDone(p))p.status='ready';localSave();await remoteSet(p);render()}async function updateNA(x){let[a,k]=x.dataset.na.split('|'),p=find(a);if(!p)return;p.preOpNA=p.preOpNA||{};p.preOpNA[k]=x.checked;localSave();await remoteSet(p)}async function updatePost(x){let[a,k]=x.dataset.post.split('|'),p=find(a);if(!p)return;p.postOp=p.postOp||{};p.postOp[k]=x.checked;localSave();await remoteSet(p);if(k==='otNotes'&&x.checked)showNotes()}async function statusChange(x){let[a,s]=x.dataset.status.split('|'),p=find(a);if(!p)return;p.status=s;if(s==='completed')p.end=new Date().toISOString();localSave();await remoteSet(p);render()}async function clearAll(){if(!confirm('Clear all data for '+date+'?'))return;patients=[];localSave();if(db)try{let s=await db.collection('minorOT').doc(date).collection('patients').get(),batch=db.batch();s.docs.forEach(d=>batch.delete(d.ref));await batch.commit()}catch(e){console.warn(e)}render();toast('All data cleared')}function subscribe(){if(unsub)unsub();if(!db)return;unsub=db.collection('minorOT').doc(date).collection('patients').onSnapshot(s=>{patients=s.docs.map(d=>({id:d.id,...d.data()}));localSave();render()},e=>toast('Firebase unavailable; using device data',true))}function loadData(){patients=localLoad();render();if(!db)return;db.collection('minorOT').doc(date).collection('patients').get().then(s=>{patients=s.docs.map(d=>({id:d.id,...d.data()}));localSave();render();subscribe()}).catch(e=>{console.warn(e);toast('Firebase unavailable; device data active',true)})}async function doPrint(p){if(!p)return;if(!window.b21PrintLines){toast('Printer module unavailable',true);return}try{await window.b21PrintLines(['MINOR OT',p.token,p.name,p.age+'/'+p.sex,'OPD: '+p.opd,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+p.procedure,p.room||'Minor OT 1']);toast('Ticket sent to SEZNIK B21')}catch(e){toast('Print failed: '+e.message,true)}}function showNotes(){let p=notesPatient,d=p.otNotesData||{rx:{},instructions:{}},box=document.createElement('div');box.className='modal';box.innerHTML='<div class="modalbox"><div class="modalhead"><h2>Operative Notes • '+esc(p.token)+'</h2><button class="btn light" id="closeNotes">✕</button></div><div class="grid2"><input class="input" id="nproc" placeholder="Procedure done" value="'+esc(d.procedureDone||p.procedure)+'"><input class="input" id="ncomp" placeholder="Complications" value="'+esc(d.complications||'Nil')+'"></div><textarea class="input" id="nfind" rows="3" placeholder="Findings" style="margin-top:9px">'+esc(d.findings||'')+'</textarea><textarea class="input" id="ndetails" rows="3" placeholder="Procedure details" style="margin-top:9px">'+esc(d.details||'')+'</textarea><h3>Prescription</h3>'+RX.map(r=>'<label class="rx"><input type="checkbox" data-rx="'+r[0]+'" '+(d.rx?.[r[0]]?'checked':'')+'><span><b>'+r[1]+'</b><br>'+r[2]+'</span></label>').join('')+'<h3>Instructions</h3>'+INS.map(i=>'<label class="rx"><input type="checkbox" data-ins="'+i[0]+'" '+(d.instructions?.[i[0]]?'checked':'')+'><span>'+i[1]+'</span></label>').join('')+'<textarea class="input" id="nadd" rows="2" placeholder="Additional instructions" style="margin-top:8px">'+esc(d.additional||'')+'</textarea><div class="grid2" style="margin-top:12px"><button class="btn purple" id="speakNotes">🔊 Speak</button><button class="btn blue" id="printNotes">🖨 Print</button></div><button class="btn green wide" id="saveNotes">Save OT Notes</button></div>';document.body.appendChild(box);function collect(){let rx={},instructions={};box.querySelectorAll('[data-rx]').forEach(x=>rx[x.dataset.rx]=x.checked);box.querySelectorAll('[data-ins]').forEach(x=>instructions[x.dataset.ins]=x.checked);return{procedureDone:box.querySelector('#nproc').value,findings:box.querySelector('#nfind').value,details:box.querySelector('#ndetails').value,complications:box.querySelector('#ncomp').value||'Nil',rx,instructions,additional:box.querySelector('#nadd').value}}box.querySelector('#closeNotes').onclick=()=>box.remove();box.querySelector('#speakNotes').onclick=()=>{let z=collect();speak('Procedure '+z.procedureDone+'. Findings '+z.findings)};box.querySelector('#saveNotes').onclick=async()=>{let z=collect();p.otNotesData=z;p.postOp=p.postOp||{};p.postOp.otNotes=true;localSave();await remoteSet(p);box.remove();toast('OT Notes saved');render()};box.querySelector('#printNotes').onclick=async()=>{let z=collect(),lines=['MINOR OT','OT NOTES '+p.token,p.name,p.age+'/'+p.sex,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+z.procedureDone,'Findings: '+(z.findings||'-'),'Details: '+(z.details||'-'),'Complications: '+z.complications,'PRESCRIPTION'];RX.filter(r=>z.rx[r[0]]).forEach(r=>lines.push(r[1]+' '+r[2]));lines.push('INSTRUCTIONS');INS.filter(i=>z.instructions[i[0]]).forEach(i=>lines.push(i[1]));if(z.additional)lines.push(z.additional);try{await window.b21PrintLines(lines);toast('OT Notes sent to printer')}catch(e){toast('Print failed: '+e.message,true)}}}try{if(window.firebase&&window.firebaseConfig){if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.firestore()}}catch(e){console.warn(e);db=null}render();loadData()})();</script></body></html>
