</style></head><body><div id="root"></div><script>
(()=>{const root=document.getElementById('root');let date=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date()),tab='reg',step=1,patients=[],form=blank(),prePhoto='',current=null,notesPatient=null,db=null;const PRE=[['allergies','Allergies',''],['tt','TT','Subject: 0.5 ml IM stat'],['testDose','Test dose','Subject: Injection Xylo test dose'],['attender','Attender',''],['ornaments','Ornaments',''],['consent','Consent','']];const RX=[['amoxyclav','Tab Amoxyclav 625 mg','BD for 5 days'],['cefu','Tab CefU 200 mg','BD for 5 days'],['paracetamol','Tab Paracetamol 500 mg','BD for 5 days'],['pantop','Tab Pantop 40 mg','OD for 5 days'],['chymoral','Tab Chymoral Forte','1 tab TDS for 5 days']];const INS=[['cd','C&D daily'],['soak','Watch for soakage'],['warning','Review if there is warning has explained']];function blank(){return{name:'',age:'',sex:'M',opd:'',diagnosis:'',site:'',procedure:'',isSeptic:false,fever:false,bleeding:false,pain:false,shock:false}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function key(){return'minorOT_'+date}function loadLocal(){try{return JSON.parse(localStorage.getItem(key())||'[]')}catch{return[]}}function saveLocal(){try{localStorage.setItem(key(),JSON.stringify(patients))}catch{}}function toast(t,bad=false){let x=document.createElement('div');x.className='toast'+(bad?' bad':'');x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}function speak(t){if(!('speechSynthesis'in window)){toast('Text-to-speech is not available',true);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ta-IN';u.rate=.8;let v=speechSynthesis.getVoices().find(v=>(v.lang||'').toLowerCase().startsWith('ta'));if(v)u.voice=v;speechSynthesis.speak(u)}function announce(p,dressing=false){if(p)speak('திரு '+p.name+' அவர்கள் '+(dressing?'dressing room':'minor OT room')+'க்கு வரவும்.')}function counts(){return[patients.length,...['registered','ready','in-progress','completed'].map(s=>patients.filter(p=>p.status===s).length)]}function header(){let c=counts();return `<div class="top"><div><div class="brand">Minor OT</div><div class="date">${new Date(date+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</div></div><div style="display:flex;gap:8px;align-items:center"><span class="online"><i></i>Online</span><button class="clear" id="clear">Clear data</button></div></div><div class="nav"><button class="${tab==='reg'?'active':''}" data-tab="reg">Registration</button><button class="${tab==='pre'?'active':''}" data-tab="pre">Pre‑Op</button><button class="${tab==='list'?'active':''}" data-tab="list">OT List</button></div><div class="stats">${[['Total',c[0]],['Registered',c[1]],['Ready',c[2]],['Progress',c[3]],['Done',c[4]]].map(x=>`<div class="stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>`}function registration(){if(step===3)return tokenPage();if(step===2)return `<div class="content"><div class="section-title"><div><h2>Safety check</h2><p>Complete triage before issuing the token.</p></div><span class="badge">Step 2 of 2</span></div><div class="triage"><button class="${!form.isSeptic?'selected non':''}" id="non">● Non‑septic</button><button class="${form.isSeptic?'selected sep':''}" id="sep">● Septic</button></div><div class="flags"><div class="flags-title">RED FLAGS</div><div class="checks">${[['fever','Fever'],['bleeding','Bleeding'],['pain','Severe pain'],['shock','Shock']].map(x=>`<label class="check"><input id="${x[0]}" type="checkbox" ${form[x[0]]?'checked':''}>${x[1]}</label>`).join('')}</div></div><label class="upload">📷 Upload pre‑op photo<input id="prePhoto" type="file" accept="image/*" capture="environment"></label>${prePhoto?`<img class="photo" src="${prePhoto}"><button class="linkbtn" id="openPre">Open photo</button>`:''}<div class="actions"><button class="btn soft" id="back">Back</button><button class="btn primary full" id="generate">Generate token</button></div></div>`;return `<div class="content"><div class="section-title"><div><h2>New patient</h2><p>Enter the minimum information needed to create an OT token.</p></div><span class="badge">Step 1</span></div><div class="field"><label>Patient name</label><input id="name" value="${esc(form.name)}" placeholder="Full name"></div><div class="grid3"><div class="field"><label>Age</label><input id="age" type="number" value="${esc(form.age)}" placeholder="Age"></div><div class="field"><label>Sex</label><select id="sex"><option value="M" ${form.sex==='M'?'selected':''}>Male</option><option value="F" ${form.sex==='F'?'selected':''}>Female</option><option value="O" ${form.sex==='O'?'selected':''}>Other</option></select></div><div class="field opd"><label>OPD</label><select id="opd"><option value="">Select OPD</option>${['7A','7B','7C','7D'].map(x=>`<option ${form.opd===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="grid2"><div class="field"><label>Diagnosis</label><input id="diagnosis" value="${esc(form.diagnosis)}" placeholder="Diagnosis"></div><div class="field"><label>Site</label><input id="site" value="${esc(form.site)}" placeholder="Operative site"></div></div><div class="field"><label>Procedure</label><input id="procedure" value="${esc(form.procedure)}" placeholder="Planned procedure"></div><button class="btn primary full" id="next">Continue to safety check →</button></div>`}function tokenPage(){return `<div class="content"><div class="section-title"><div><h2>Token generated</h2><p>Confirm details, announce or print this token.</p></div></div><div class="ticket"><div class="tickettop"><div style="font-size:11px;opacity:.7;font-weight:800">MINOR OT TOKEN</div><div class="ticketno">${esc(current.token)}</div></div><div class="ticketbody"><div class="ticketgrid">${[['Patient',current.name],['Age / Sex',current.age+' / '+current.sex],['OPD',current.opd],['Room',current.room],['Diagnosis',current.diagnosis],['Site',current.site],['Procedure',current.procedure]].map(x=>`<div class="kv"><small>${x[0]}</small><b>${esc(x[1])}</b></div>`).join('')}</div></div></div><div class="actions"><button class="btn green" id="announce">🔊 Announce</button><button class="btn primary" id="print">🖨 Print token</button></div><div class="actions"><button class="btn soft" id="add">Add to OT queue</button><button class="btn soft" id="new">New patient</button></div></div>`}function preDone(p){return PRE.every(x=>p.preOp?.[x[0]]||p.preOpNA?.[x[0]])}function preop(){let a=patients.filter(p=>['registered','ready'].includes(p.status));return `<div class="content"><div class="section-title"><div><h2>Pre‑Op queue</h2><p>Complete the checklist and move patients to Ready.</p></div></div>${a.length?a.map(p=>queuePre(p)).join(''):'<div class="empty">No patients waiting for pre‑op.</div>'}</div>`}function queuePre(p){return `<div class="queue"><div class="qhead"><span class="token ${p.isSeptic?'dress':''}">${esc(p.token)}</span><div><div class="qname">${esc(p.name)}</div><div class="qmeta">${esc(p.age)}/${esc(p.sex)} · ${esc(p.opd)} · ${esc(p.site||'Site not entered')}</div></div><div class="qactions"><button class="icon green" data-ann="${p.id}" title="Announce">🔊</button><button class="icon blue" data-print="${p.id}" title="Print">🖨</button></div></div><div class="prebox"><div class="boxhead"><span>Pre‑Op checklist</span><span class="badge">${PRE.filter(x=>p.preOp?.[x[0]]).length}/${PRE.length}</span></div><div class="precheck">${PRE.map(x=>`<div class="preitem"><label><input type="checkbox" data-pre="${p.id}|${x[0]}" ${p.preOp?.[x[0]]?'checked':''}><span><b>${x[1]}</b>${x[2]?`<br><span class="na">${x[2]}</span>`:''}</span></label>${!['allergies','consent'].includes(x[0])?`<label class="na"><input type="checkbox" data-na="${p.id}|${x[0]}" ${p.preOpNA?.[x[0]]?'checked':''}> N/A</label>`:''}</div>`).join('')}</div>${p.preOpPhoto?'<div class="postlinks"><button class="linkbtn" data-photo-open="'+p.id+'">View pre‑op photo</button></div>':''}</div><div class="workflow"><button class="${p.status==='registered'?'on reg':''}" data-status="${p.id}|registered">Reg</button><button class="${p.status==='ready'?'on ready':''}" ${preDone(p)?'':'disabled'} data-status="${p.id}|ready">Ready</button><button class="${p.status==='in-progress'?'on prog':''}" ${preDone(p)?'':'disabled'} data-status="${p.id}|in-progress">Start</button><button data-status="${p.id}|completed">Done</button></div></div>`}function list(){return `<div class="content"><div class="section-title"><div><h2>OT List / Post‑Op</h2><p>Review cases by date and complete documentation.</p></div><div class="datebar"><input id="date" type="date" value="${date}"></div></div>${patients.length?patients.map(p=>queueList(p)).join(''):'<div class="empty">No OT cases for this date.</div>'}</div>`}function queueList(p){return `<div class="queue"><div class="qhead"><span class="token ${p.isSeptic?'dress':''}">${esc(p.token)}</span><div><div class="qname">${esc(p.name)}</div><div class="qmeta">${esc(p.age)}/${esc(p.sex)} · ${esc(p.opd)} · ${esc(p.procedure)}</div></div><div class="qactions"><button class="icon green" data-annpost="${p.id}">🔊</button><button class="icon blue" data-print="${p.id}">🖨</button></div></div><div class="workflow"><button class="${p.status==='registered'?'on reg':''}" data-status="${p.id}|registered">Reg</button><button class="${p.status==='ready'?'on ready':''}" data-status="${p.id}|ready">Ready</button><button class="${p.status==='in-progress'?'on prog':''}" data-status="${p.id}|in-progress">Prog</button><button class="${p.status==='completed'?'on done':''}" data-status="${p.id}|completed">Done</button></div>${p.status==='in-progress'||p.status==='completed'?`<div class="postbox"><div class="boxhead"><span>Post‑Op</span><span class="badge">${['otNotes','hpe','culture','prescription'].filter(k=>p.postOp?.[k]).length}/4</span></div><label class="upload">📷 Upload post‑op photo<input type="file" accept="image/*" capture="environment" data-photo="${p.id}"></label>${p.postOpPhoto?`<div class="postlinks"><button class="linkbtn" data-photo-open="${p.id}">View post‑op photo</button></div>`:''}<div class="precheck" style="margin-top:9px">${[['otNotes','OT Notes'],['hpe','HPE'],['culture','Culture'],['prescription','Rx']].map(x=>`<label class="check"><input type="checkbox" data-post="${p.id}|${x[0]}" ${p.postOp?.[x[0]]?'checked':''}>${x[1]}</label>`).join('')}</div><div class="postlinks"><button class="btn purple" data-notes="${p.id}">Open operative notes & prescription</button></div></div>`:''}</div>`}function render(){root.innerHTML=`<div class="app">${header()}${tab==='reg'?registration():tab==='pre'?preop():list()}</div>`;bind()}function read(){['name','age','diagnosis','site','procedure'].forEach(k=>{let x=document.getElementById(k);if(x)form[k]=x.value});let s=document.getElementById('sex'),o=document.getElementById('opd');if(s)form.sex=s.value;if(o)form.opd=o.value}function find(id){return patients.find(p=>p.id===id)}async function remote(p){if(!db)return;try{await db.collection('minorOT').doc(date).collection('patients').doc(p.id).set(p)}catch{toast('Saved on this device; cloud sync unavailable',true)}}async function patch(id,obj,msg='Saved'){let p=find(id);if(!p)return;Object.assign(p,obj);saveLocal();await remote(p);toast(msg);render()}async function photoData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let scale=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,im.width*scale);c.height=Math.max(1,im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}function generate(){read();let n=patients.filter(p=>p.isSeptic===form.isSeptic).length+1;current={...form,id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString()),token:(form.isSeptic?'D':'OT')+'-'+String(n).padStart(3,'0'),room:form.isSeptic?'Dressing room':'Minor OT 1',status:'registered',time:new Date().toISOString(),preOp:Object.fromEntries(PRE.map(x=>[x[0],false])),preOpNA:{},postOp:{},preOpPhoto:prePhoto};step=3;render()}async function add(){patients.push(current);saveLocal();await remote(current);toast('Token added to OT queue');form=blank();prePhoto='';current=null;step=1;render()}async function status(id,s){let p=find(id);if(!p)return;p.status=s;if(s==='completed')p.end=new Date().toISOString();saveLocal();await remote(p);render()}async function print(p){if(window.b21PrintLines){try{await window.b21PrintLines(['MINOR OT',p.token,p.name,p.age+'/'+p.sex,'OPD: '+p.opd,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+p.procedure,p.room||'Minor OT 1']);toast('Sent to SEZNIK B21')}catch(e){toast('Printer error: '+e.message,true)}}else toast('Printer connection is not available',true)}function showNotes(){let p=notesPatient,d=p.otNotesData||{rx:{},instructions:{}},m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modalbox"><div class="modalhead"><h3>Operative notes · ${esc(p.token)}</h3><button class="btn soft" id="close">Close</button></div><div class="grid2"><div class="field"><label>Procedure done</label><input id="np" value="${esc(d.procedureDone||p.procedure)}"></div><div class="field"><label>Complications</label><input id="nc" value="${esc(d.complications||'Nil')}"></div></div><div class="field"><label>Findings</label><textarea id="nf" rows="3">${esc(d.findings||'')}</textarea></div><div class="field"><label>Procedure details</label><textarea id="nd" rows="3">${esc(d.details||'')}</textarea></div><h4>Prescription</h4>${RX.map(x=>`<label class="rx"><input type="checkbox" data-rx="${x[0]}" ${d.rx?.[x[0]]?'checked':''}><span><b>${x[1]}</b><br>${x[2]}</span></label>`).join('')}<h4>Instructions</h4>${INS.map(x=>`<label class="rx"><input type="checkbox" data-ins="${x[0]}" ${d.instructions?.[x[0]]?'checked':''}><span>${x[1]}</span></label>`).join('')}<div class="field"><label>Additional instructions</label><textarea id="na" rows="2">${esc(d.additional||'')}</textarea></div><div class="actions"><button class="btn soft" id="speak">🔊 Speak</button><button class="btn primary" id="printn">🖨 Print</button><button class="btn green" id="save">Save notes</button></div></div>`;document.body.appendChild(m);let collect=()=>{let rx={},instructions={};m.querySelectorAll('[data-rx]').forEach(x=>rx[x.dataset.rx]=x.checked);m.querySelectorAll('[data-ins]').forEach(x=>instructions[x.dataset.ins]=x.checked);return{procedureDone:m.querySelector('#np').value,complications:m.querySelector('#nc').value||'Nil',findings:m.querySelector('#nf').value,details:m.querySelector('#nd').value,rx,instructions,additional:m.querySelector('#na').value}};m.querySelector('#close').onclick=()=>m.remove();m.querySelector('#speak').onclick=()=>{let z=collect();speak('Procedure '+z.procedureDone+'. Findings '+z.findings)};m.querySelector('#save').onclick=async()=>{let z=collect();p.otNotesData=z;p.postOp=p.postOp||{};p.postOp.otNotes=true;saveLocal();await remote(p);m.remove();toast('Operative notes saved');render()};m.querySelector('#printn').onclick=async()=>{let z=collect(),lines=['MINOR OT','OT NOTES '+p.token,p.name,p.age+'/'+p.sex,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+z.procedureDone,'Findings: '+(z.findings||'-'),'Details: '+(z.details||'-'),'Complications: '+z.complications,'PRESCRIPTION'];RX.filter(x=>z.rx[x[0]]).forEach(x=>lines.push(x[1]+' '+x[2]));lines.push('INSTRUCTIONS');INS.filter(x=>z.instructions[x[0]]).forEach(x=>lines.push(x[1]));if(z.additional)lines.push(z.additional);if(window.b21PrintLines){try{await window.b21PrintLines(lines);toast('OT notes sent to printer')}catch(e){toast('Print error: '+e.message,true)}}else toast('Printer connection is not available',true)}}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;step=1;render()});document.getElementById('clear')?.addEventListener('click',()=>{if(confirm('Clear all data for '+date+'?')){patients=[];saveLocal();render();toast('Data cleared')}});document.getElementById('next')?.addEventListener('click',()=>{read();if(!form.name||!form.age||!form.opd||!form.diagnosis||!form.site||!form.procedure){toast('Please complete all patient fields',true);return}step=2;render()});document.getElementById('back')?.addEventListener('click',()=>{step=1;render()});document.getElementById('non')?.addEventListener('click',()=>{form.isSeptic=false;render()});document.getElementById('sep')?.addEventListener('click',()=>{form.isSeptic=true;render()});['fever','bleeding','pain','shock'].forEach(k=>document.getElementById(k)?.addEventListener('change',e=>form[k]=e.target.checked));document.getElementById('prePhoto')?.addEventListener('change',async e=>{if(e.target.files[0]){prePhoto=await photoData(e.target.files[0]);render()}});document.getElementById('openPre')?.addEventListener('click',()=>window.open(prePhoto,'_blank'));document.getElementById('generate')?.addEventListener('click',generate);document.getElementById('announce')?.addEventListener('click',()=>announce(current,false));document.getElementById('print')?.addEventListener('click',()=>print(current));document.getElementById('add')?.addEventListener('click',add);document.getElementById('new')?.addEventListener('click',()=>{form=blank();prePhoto='';current=null;step=1;render()});document.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>status(x.dataset.status.split('|')[0],x.dataset.status.split('|')[1]));document.querySelectorAll('[data-ann]').forEach(x=>x.onclick=()=>announce(find(x.dataset.ann),false));document.querySelectorAll('[data-annpost]').forEach(x=>x.onclick=()=>announce(find(x.dataset.annpost),true));document.querySelectorAll('[data-print]').forEach(x=>x.onclick=()=>print(find(x.dataset.print)));document.querySelectorAll('[data-pre]').forEach(x=>x.onchange=async()=>{let [id,k]=x.dataset.pre.split('|'),p=find(id);p.preOp=p.preOp||{};p.preOp[k]=x.checked;if(preDone(p))p.status='ready';saveLocal();await remote(p);render()});document.querySelectorAll('[data-na]').forEach(x=>x.onchange=async()=>{let [id,k]=x.dataset.na.split('|'),p=find(id);p.preOpNA=p.preOpNA||{};p.preOpNA[k]=x.checked;saveLocal();await remote(p);render()});document.querySelectorAll('[data-post]').forEach(x=>x.onchange=async()=>{let [id,k]=x.dataset.post.split('|'),p=find(id);p.postOp=p.postOp||{};p.postOp[k]=x.checked;saveLocal();await remote(p);if(k==='otNotes'&&x.checked){notesPatient=p;showNotes()}else render()});document.querySelectorAll('[data-notes]').forEach(x=>x.onclick=()=>{notesPatient=find(x.dataset.notes);showNotes()});document.querySelectorAll('[data-photo]').forEach(x=>x.onchange=async e=>{if(e.target.files[0]){let p=find(x.dataset.photo);p.postOpPhoto=await photoData(e.target.files[0]);saveLocal();await remote(p);toast('Post-op photo saved');render()}});document.querySelectorAll('[data-photo-open]').forEach(x=>x.onclick=()=>{let p=find(x.dataset.photoOpen);let src=p?.postOpPhoto||p?.preOpPhoto;if(src)window.open(src,'_blank')});document.getElementById('date')?.addEventListener('change',e=>{date=e.target.value;patients=loadLocal();render();loadCloud()})}function loadCloud(){if(!db)return;db.collection('minorOT').doc(date).collection('patients').get().then(s=>{if(!s.empty){patients=s.docs.map(d=>({id:d.id,...d.data()}));saveLocal();render()}}).catch(()=>{})}try{if(window.firebase&&window.firebaseConfig){if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.firestore()}}catch{}patients=loadLocal();render();loadCloud()})();
</script></body></html>
