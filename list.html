<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minor OT – List / Post-Op</title><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef6ff;font-family:system-ui,-apple-system,sans-serif;color:#111827}.app{max-width:1050px;margin:auto;padding:12px}.card,.patient{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 9px #0001}.head,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.title{font-size:30px;font-weight:900;color:#2563eb}.muted{color:#6b7280}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer}.blue{background:#3b82f6;color:#fff}.green{background:#22c55e;color:#fff}.purple{background:#a855f7;color:#fff}.gray{background:#f3f4f6;color:#1f2937}.yellow{background:#eab308;color:#fff}.token{display:inline-flex;padding:9px 14px;border-radius:11px;color:#fff;font-size:22px;font-weight:900;background:#22c55e}.section{padding:12px;border-radius:14px;margin:10px 0;border:2px solid #d8b4fe;background:#faf5ff}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{background:#fff;border-radius:9px;padding:10px}.check label{display:flex;gap:8px;align-items:flex-start}.check input{width:20px;height:20px}.photo{max-width:100%;max-height:280px;border-radius:12px}.input,.area{width:100%;padding:10px;border:2px solid #d1d5db;border-radius:10px;font-size:16px}.area{min-height:80px;resize:vertical}.modal{position:fixed;inset:0;background:#0008;z-index:1000;display:flex;align-items:center;justify-content:center;padding:12px}.modalbox{background:#fff;border-radius:18px;padding:16px;width:min(760px,100%);max-height:94vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.rx{display:flex;gap:9px;align-items:flex-start;background:#f8fafc;border-radius:10px;padding:10px;margin:6px 0}.rx input{width:20px;height:20px}.toast{position:fixed;bottom:18px;left:18px;right:18px;background:#166534;color:#fff;padding:14px;border-radius:14px;text-align:center;font-weight:800;z-index:1200}@media(max-width:650px){.checks{grid-template-columns:1fr}.title{font-size:26px}}
</style></head><body><div class="app"><div class="card"><div class="head"><div><div class="title">Minor OT – List</div><div class="muted">OT List / Post-Op</div></div><div class="row" style="margin-left:auto"><a class="btn blue" href="./">← Main</a><label class="btn gray">Date <input id="date" class="input" type="date" style="width:auto;padding:3px"></label></div></div></div><div id="root"></div></div><script>
const db=firebase.firestore();let date=new Date().toISOString().slice(0,10),patients=[],unsub=null;const RX=[['amoxyclav','Tab Amoxyclav 625 mg — BD for 5 days'],['cefu','Tab CefU 200 mg — BD for 5 days'],['paracetamol','Tab Paracetamol 500 mg — BD for 5 days'],['pantop','Tab Pantop 40 mg — OD for 5 days'],['chymoral','Tab Chymoral Forte — 1 tab TDS for 5 days']];const INS=[['cd','C&D daily'],['soak','Watch for soakage'],['warning','Review if there is warning has explained']];document.getElementById('date').value=date;document.getElementById('date').onchange=e=>{date=e.target.value;load()};function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function toast(t){let x=document.getElementById('toast');if(x)x.remove();document.body.insertAdjacentHTML('beforeend','<div class="toast" id="toast">'+esc(t)+'</div>');setTimeout(()=>document.getElementById('toast')?.remove(),4500)}function load(){if(unsub)unsub();unsub=db.collection('minorOT').doc(date).collection('patients').orderBy('time').onSnapshot(s=>{patients=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{document.getElementById('root').innerHTML='<div class="card"><b>Unable to load List</b><p>'+esc(e.message)+'</p></div>'})}function render(){document.getElementById('root').innerHTML=patients.length?patients.map(p=>card(p)).join(''):'<div class="card"><h2>No patients</h2><p class="muted">No patients are recorded for '+esc(date)+'.</p></div>'}function card(p){let post=p.status==='in-progress'||p.status==='completed';return '<div class="patient"><div class="row"><span class="token">'+esc(p.token)+'</span><b>'+esc(p.name)+'</b><span class="muted">'+esc(p.age)+'/'+esc(p.sex)+' • '+esc(p.opd)+'</span><span style="margin-left:auto"></span><button class="btn green" onclick="announce('+JSON.stringify(p.name)+','+post+')">🔊 Announce</button><button class="btn blue" onclick="printPatient('+JSON.stringify(p.id)+')">🖨️ Print</button></div><div class="section"><div class="checks"><div class="check"><b>Status:</b> '+esc(p.status||'registered')+'</div><div class="check"><b>Diagnosis:</b> '+esc(p.diagnosis)+'</div><div class="check"><b>Site:</b> '+esc(p.site||'-')+'</div><div class="check"><b>Procedure:</b> '+esc(p.procedure)+'</div></div>'+(p.preOpPhoto?'<div><b>Pre-Op Photo:</b><br><img class="photo" src="'+p.preOpPhoto+'"><br><button class="btn gray" onclick="window.open('+JSON.stringify(p.preOpPhoto)+',\'_blank\')">Open Pre-Op Photo</button></div>':'')+(p.postOpPhoto?'<div style="margin-top:10px"><b>Post-Op Photo:</b><br><img class="photo" src="'+p.postOpPhoto+'"><br><button class="btn gray" onclick="window.open('+JSON.stringify(p.postOpPhoto)+',\'_blank\')">Open Post-Op Photo</button></div>':'')+'</div><div class="row">'+['registered','ready','in-progress','completed'].map(s=>'<button class="btn '+(p.status===s?'purple':'gray')+'" onclick="setStatus('+JSON.stringify(p.id)+','+JSON.stringify(s)+')">'+({registered:'Reg',ready:'Ready','in-progress:'Prog',completed:'Done'}[s])+'</button>').join('')+'<button class="btn green" onclick="openNotes('+JSON.stringify(p.id)+')">📝 OT Notes & Prescription</button>'+(post?'<label class="btn purple">📷 Post-Op Photo<input type="file" accept="image/*" capture="environment" hidden onchange="uploadPost('+JSON.stringify(p.id)+',this)"></label>':'')+'</div></div>'}async function setStatus(id,status){try{await db.collection('minorOT').doc(date).collection('patients').doc(id).update({status:end=status==='completed'?new Date().toISOString():null});toast('Status changed to '+({registered:'Reg',ready:'Ready','in-progress':'Prog',completed:'Done'}[status]))}catch(e){alert('Status update failed: '+e.message)}}function announce(name,post){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('திரு '+name+' அவர்கள் '+(post?'Dressing Room':'Minor OT Room')+'க்கு வரவும்.');u.lang='ta-IN';u.rate=.82;speechSynthesis.speak(u)}async function fileData(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}async function uploadPost(id,input){if(!input.files?.[0])return;try{let d=await fileData(input.files[0]);await db.collection('minorOT').doc(date).collection('patients').doc(id).update({postOpPhoto:d});toast('Post-Op photo saved')}catch(e){alert(e.message)}}async function printPatient(id){let p=patients.find(x=>x.id===id);if(!p)return;if(window.b21PrintLines)await window.b21PrintLines(['MINOR OT',p.token,p.name,p.age+'/'+p.sex,'OPD: '+p.opd,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+p.procedure,p.room||'']);else alert('B21 printer module unavailable')}
function openNotes(id){let p=patients.find(x=>x.id===id),d=p.otNotesData||{},rx=d.rx||{},ins=d.ins||{};let box=document.createElement('div');box.className='modal';box.innerHTML='<div class="modalbox"><div class="modalhead"><h2>Operative Notes — '+esc(p.token)+'</h2><button class="btn gray" onclick="this.closest(\'.modal\').remove()">✕</button></div><div class="muted">'+esc(p.name)+' • '+esc(p.age)+'/'+esc(p.sex)+' • '+esc(p.opd)+'</div><div class="section"><b>Patient details</b><p>Diagnosis: <b>'+esc(p.diagnosis)+'</b><br>Site: <b>'+esc(p.site||'-')+'</b><br>Planned procedure: <b>'+esc(p.procedure)+'</b></p></div><label>Procedure performed<textarea id="nproc" class="area" placeholder="Procedure performed">'+esc(d.procedureDone||p.procedure)+'</textarea></label><label>Operative findings<textarea id="nfind" class="area" placeholder="Operative findings">'+esc(d.findings||'')+'</textarea></label><label>Procedure details<textarea id="ndet" class="area" placeholder="Procedure details">'+esc(d.details||'')+'</textarea></label><label>Complications<textarea id="ncomp" class="area" placeholder="Complications">'+esc(d.complications||'Nil')+'</textarea></label><div class="section"><h3>Prescription</h3>'+RX.map(r=>'<label class="rx"><input type="checkbox" data-rx="'+r[0]+'" '+(rx[r[0]]?'checked':'')+'><span>'+r[1]+'</span></label>').join('')+'<input id="naddrx" class="input" placeholder="Additional prescription" value="'+esc(d.additionalRx||'')+'"></div><div class="section"><h3>Instructions</h3>'+INS.map(r=>'<label class="rx"><input type="checkbox" data-ins="'+r[0]+'" '+(ins[r[0]]?'checked':'')+'><span>'+r[1]+'</span></label>').join('')+'<textarea id="nadditional" class="area" placeholder="Additional instructions">'+esc(d.additional||'')+'</textarea></div><div class="row"><button class="btn gray" onclick="this.closest(\'.modal\').remove()">Cancel</button><button class="btn green" onclick="saveNotes('+JSON.stringify(id)+')">💾 Save Notes</button><button class="btn blue" onclick="saveAndPrintNotes('+JSON.stringify(id)+')">🖨️ Save & Print</button></div></div>';document.body.appendChild(box)}async function collectNotes(){let rx={},ins={};document.querySelectorAll('[data-rx]').forEach(x=>{rx[x.dataset.rx]=x.checked});document.querySelectorAll('[data-ins]').forEach(x=>{ins[x.dataset.ins]=x.checked});return{procedureDone:document.getElementById('nproc').value,findings:document.getElementById('nfind').value,details:document.getElementById('ndet').value,complications:document.getElementById('ncomp').value,rx,ins,additionalRx:document.getElementById('naddrx').value,additional:document.getElementById('nadditional').value,savedAt:new Date().toISOString()}}async function saveNotes(id){try{let d=await collectNotes();await db.collection('minorOT').doc(date).collection('patients').doc(id).update({otNotesData:d,'postOp.otNotes':true});toast('Operative notes saved');document.querySelector('.modal')?.remove()}catch(e){alert('Could not save notes: '+e.message)}}async function saveAndPrintNotes(id){try{let d=await collectNotes();await db.collection('minorOT').doc(date).collection('patients').doc(id).update({otNotesData:d,'postOp.otNotes':true});let p=patients.find(x=>x.id===id),lines=[{t:'MINOR OT',b:true},{t:'OPERATIVE NOTES - '+p.token,b:true},{t:'Name: '+p.name},{t:'Age/Sex: '+p.age+'/'+p.sex},{t:'OPD: '+p.opd},{t:'Diagnosis: '+p.diagnosis},{t:'Site: '+(p.site||'-')},{t:'Procedure: '+d.procedureDone},{t:'Findings: '+(d.findings||'-')},{t:'Details: '+(d.details||'-')},{t:'Complications: '+(d.complications||'Nil')},{t:'PRESCRIPTION',b:true}];RX.filter(r=>d.rx?.[r[0]]).forEach(r=>lines.push({t:r[1]}));if(d.additionalRx)lines.push({t:d.additionalRx});lines.push({t:'INSTRUCTIONS',b:true});INS.filter(r=>d.ins?.[r[0]]).forEach(r=>lines.push({t:r[1]}));if(d.additional)lines.push({t:d.additional});if(window.b21PrintLines){await window.b21PrintLines(lines.map(x=>x.t));toast('Notes saved and sent to B21')}else alert('B21 printer module unavailable')}catch(e){alert('Save/print failed: '+e.message)}}load();</script></body></html>
