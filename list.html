<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minor OT – List</title><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef6ff;font-family:system-ui,-apple-system,sans-serif;color:#111827}.app{max-width:1050px;margin:auto;padding:12px}.card,.patient{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 9px #0001}.head,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.title{font-size:30px;font-weight:900;color:#2563eb}.muted{color:#6b7280}.btn{border:0;border-radius:11px;padding:11px 14px;font-weight:800;font-size:14px}.blue{background:#3b82f6;color:#fff}.green{background:#22c55e;color:#fff}.purple{background:#a855f7;color:#fff}.gray{background:#f3f4f6;color:#1f2937}.yellow{background:#eab308;color:#fff}.red{background:#ef4444;color:#fff}.token{display:inline-flex;padding:9px 14px;border-radius:11px;color:#fff;font-size:22px;font-weight:900}.tokg{background:#22c55e}.tokr{background:#ef4444}.section{padding:12px;border-radius:14px;margin:10px 0;border:2px solid #d8b4fe;background:#faf5ff}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{background:#fff;border-radius:9px;padding:10px}.photo{max-width:100%;max-height:280px;border-radius:12px}.input{padding:10px;border:2px solid #d1d5db;border-radius:10px;font-size:16px}@media(max-width:650px){.checks{grid-template-columns:1fr}}</style></head><body><div class="app"><div class="card"><div class="head"><div><div class="title">Minor OT – List</div><div class="muted">OT List / Post-Op</div></div><div class="row" style="margin-left:auto"><a class="btn blue" href="./">← Main</a><label class="btn gray">Date <input id="date" class="input" type="date"></label></div></div></div><div id="root"></div></div><script>const db=firebase.firestore();let date=new Date().toISOString().slice(0,10),patients=[];document.getElementById('date').value=date;document.getElementById('date').onchange=e=>{date=e.target.value;load()};function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function load(){db.collection('minorOT').doc(date).collection('patients').orderBy('time').onSnapshot(s=>{patients=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{document.getElementById('root').innerHTML='<div class="card"><b>Unable to load List</b><p>'+esc(e.message)+'</p></div>'})}function render(){document.getElementById('root').innerHTML=patients.length?patients.map(p=>'<div class="patient"><div class="row"><span class="token '+(p.isSeptic?'tokr':'tokg')+'">'+esc(p.token)+'</span><b>'+esc(p.name)+'</b><span class="muted">'+esc(p.age)+'/'+esc(p.sex)+' • '+esc(p.opd)+'</span><span style="margin-left:auto"></span><button class="btn green" onclick="announce('+JSON.stringify(p.name)+','+(p.status==='in-progress')+')">🔊 Announce</button><button class="btn blue" onclick="printPatient('+JSON.stringify(p.id)+')">🖨️ Print</button></div><div class="section"><div class="checks"><div class="check"><b>Status:</b> '+esc(p.status||'registered')+'</div><div class="check"><b>Diagnosis:</b> '+esc(p.diagnosis)+'</div><div class="check"><b>Site:</b> '+esc(p.site||'-')+'</div><div class="check"><b>Procedure:</b> '+esc(p.procedure)+'</div></div>'+(p.postOpPhoto?'<img class="photo" src="'+p.postOpPhoto+'"><br><button class="btn gray" onclick="window.open('+JSON.stringify(p.postOpPhoto)+',\'_blank\')">Open Post-Op Photo</button>':'')+'</div><div class="row">'+['registered','ready','in-progress','completed'].map(s=>'<button class="btn '+(p.status===s?'purple':'gray')+'" onclick="setStatus('+JSON.stringify(p.id)+','+JSON.stringify(s)+')">'+({registered:'Reg',ready:'Ready','in-progress':'Prog',completed:'Done'}[s])+'</button>').join('')+(p.status==='in-progress'?'<button class="btn purple" onclick="openNotes('+JSON.stringify(p.id)+')">OT Notes</button>':'')+'</div></div>').join(''):'<div class="card"><h2>No patients</h2><p class="muted">No patients are recorded for '+esc(date)+'.</p></div>'}async function setStatus(id,status){await db.collection('minorOT').doc(date).collection('patients').doc(id).update({status,end:status==='completed'?new Date().toISOString():null})}function announce(name,post){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('திரு '+name+' அவர்கள் '+(post?'Dressing Room':'Minor OT Room')+'க்கு வரவும்.');u.lang='ta-IN';u.rate=.82;speechSynthesis.speak(u)}async function printPatient(id){let p=patients.find(x=>x.id===id);if(!p)return;if(window.b21PrintLines)await window.b21PrintLines(['MINOR OT',p.token,p.name,p.age+'/'+p.sex,'OPD: '+p.opd,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+p.procedure,p.room||'']);else alert('B21 printer module unavailable')}function openNotes(id){let p=patients.find(x=>x.id===id),d=p.otNotesData||{};let box=document.createElement('div');box.style='position:fixed;inset:0;background:#0008;z-index:99;padding:15px';box.innerHTML='<div class="card" style="max-width:760px;margin:auto;max-height:92vh;overflow:auto"><h2>OT Notes – '+esc(p.token)+'</h2><input id="proc" class="input" style="width:100%" placeholder="Procedure done" value="'+esc(d.procedureDone||p.procedure)+'"><textarea id="find" class="input" style="width:100%;margin-top:8px" rows="3" placeholder="Findings">'+esc(d.findings||'')+'</textarea><textarea id="det" class="input" style="width:100%;margin-top:8px" rows="3" placeholder="Procedure details">'+esc(d.details||'')+'</textarea><div class="row" style="margin-top:10px"><button class="btn gray" onclick="this.closest(\'[style*=fixed]\').remove()">Close</button><button class="btn green" onclick="saveNotes('+JSON.stringify(id)+')">Save</button><button class="btn blue" onclick="printNotes('+JSON.stringify(id)+')">Print</button></div></div>';document.body.appendChild(box)}async function saveNotes(id){let p=patients.find(x=>x.id===id),data={procedureDone:document.getElementById('proc').value,findings:document.getElementById('find').value,details:document.getElementById('det').value,complications:'Nil'};await db.collection('minorOT').doc(date).collection('patients').doc(id).update({otNotesData:data,'postOp.otNotes':true});load();document.querySelector('[style*=fixed]')?.remove()}async function printNotes(id){let p=patients.find(x=>x.id===id);if(window.b21PrintLines)await window.b21PrintLines(['MINOR OT','OT NOTES '+p.token,p.name,p.age+'/'+p.sex,'Diagnosis: '+p.diagnosis,'Site: '+(p.site||'-'),'Procedure: '+(p.otNotesData?.procedureDone||p.procedure),'Findings: '+(p.otNotesData?.findings||'-'),'Details: '+(p.otNotesData?.details||'-'),'Complications: '+(p.otNotesData?.complications||'Nil')])}load();</script></body></html>
